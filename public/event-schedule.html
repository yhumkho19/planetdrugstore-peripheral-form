<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deployment Roster — Medical &amp; People's Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F2EEE3;
    --surface: #FFFDF8;
    --surface-dim: #EAE2CC;
    --ink: #211F1A;
    --ink-muted: #6E6656;
    --ink-faint: #A79E8A;
    --border: #DBD2B9;
    --south: #0F6E5C;
    --south-soft: #DFEEE8;
    --north: #B5560C;
    --north-soft: #F5E5D0;
    --other: #4B4A66;
    --other-soft: #E7E6F0;
    --danger: #BF3B2C;
    --danger-soft: #F9E7E1;
    --ok: #1E7B4D;
    --ok-soft: #E2F1E8;
    --stamp: #B5342A;
    --stamp-ink: #FBF2E9;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(33,31,26,0.05) 1px, transparent 0);
    background-size: 22px 22px;
    color: var(--ink);
    font-family: 'IBM Plex Sans', Arial, sans-serif;
    font-size: 14px;
  }
  body { padding: 28px clamp(16px, 4vw, 48px) 60px; }

  /* ---------- Header ---------- */
  .page-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 20px;
    padding-bottom: 20px;
    border-bottom: 2px solid var(--ink);
  }
  .page-head h1 {
    font-family: 'Fraunces', serif;
    font-optical-sizing: auto;
    font-weight: 600;
    font-size: 32px;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  .page-head p {
    margin: 0;
    color: var(--ink-muted);
    font-size: 13.5px;
  }
  .stats {
    display: flex;
    gap: 20px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    border: 1px solid var(--border);
    background: var(--surface);
    padding: 10px 16px;
  }
  .stats .stat { text-align: right; }
  .stats .stat .num {
    display: block;
    font-size: 22px;
    font-weight: 600;
    line-height: 1.1;
  }
  .stats .stat.warn .num { color: var(--danger); }
  .stats .stat.good .num { color: var(--ok); }
  .stats .stat .cap {
    color: var(--ink-faint);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-size: 10px;
  }

  /* ---------- Toolbar ---------- */
  .toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .region-filter {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .filter-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 7px 16px;
    border-radius: 20px;
    cursor: pointer;
    border: 1.5px solid var(--border);
    background: var(--surface);
    color: var(--ink-muted);
  }
  .filter-btn:hover { border-color: var(--ink-faint); color: var(--ink); }
  .filter-btn.active { color: #fff; border-color: transparent; }
  .filter-btn.active[data-filter="all"] { background: var(--ink); }
  .filter-btn.active[data-filter="south"] { background: var(--south); }
  .filter-btn.active[data-filter="north"] { background: var(--north); }
  .btn {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    padding: 10px 18px;
    border-radius: 2px;
    cursor: pointer;
    border: 1.5px solid var(--ink);
    background: var(--surface);
    color: var(--ink);
    box-shadow: 2px 2px 0 var(--ink);
    transition: transform .08s ease, box-shadow .08s ease;
  }
  .btn:hover { transform: translate(1px, 1px); box-shadow: 1px 1px 0 var(--ink); }
  .btn:focus-visible { outline: 2px solid var(--south); outline-offset: 2px; }
  .btn.primary {
    background: var(--south);
    border-color: var(--south);
    color: #fff;
    box-shadow: 2px 2px 0 #0a4a3e;
  }
  .btn.primary:hover { box-shadow: 1px 1px 0 #0a4a3e; }
  .btn.danger-outline { color: var(--danger); border-color: var(--danger); box-shadow: 2px 2px 0 var(--danger); }
  .btn.danger-outline:hover { background: var(--danger-soft); }

  /* ---------- Grid ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
    gap: 22px 18px;
    margin-top: 8px;
  }

  /* ---------- Card ---------- */
  .site-card {
    background: var(--surface);
    border: 1px solid var(--border);
    display: flex;
    overflow: visible;
    position: relative;
    box-shadow: 3px 3px 0 rgba(33,31,26,0.07);
  }
  .accent-bar { width: 5px; flex-shrink: 0; background: var(--other); }
  .site-card[data-region="south"] .accent-bar { background: var(--south); }
  .site-card[data-region="north"] .accent-bar { background: var(--north); }

  .ticket-number {
    position: absolute;
    top: -12px;
    left: 14px;
    background: var(--stamp);
    color: var(--stamp-ink);
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 0.03em;
    padding: 3px 8px;
    transform: rotate(-2deg);
    box-shadow: 1px 1px 0 rgba(33,31,26,0.35);
    z-index: 2;
  }

  .card-inner { flex: 1; padding: 22px 16px 12px; min-width: 0; }

  .perforation {
    border-top: 1.5px dashed var(--border);
    margin: 14px 0;
  }

  .remove-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink-faint);
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .remove-btn:hover { border-color: var(--danger); color: var(--danger); background: var(--danger-soft); }

  .region-line {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 10px;
    padding-right: 26px;
    flex-wrap: wrap;
  }
  .region-line select, .region-line input.customText {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: var(--surface);
    color: var(--ink-muted);
    padding: 3px 10px;
  }
  .site-card[data-region="south"] .region-line select.regionSelect { color: var(--south); border-color: var(--south); background: var(--south-soft); }
  .site-card[data-region="north"] .region-line select.regionSelect { color: var(--north); border-color: var(--north); background: var(--north-soft); }
  .region-line .sep { color: var(--ink-faint); font-size: 12px; }

  .locationInput {
    display: block;
    width: 100%;
    font-family: 'Fraunces', serif;
    font-optical-sizing: auto;
    font-size: 21px;
    font-weight: 600;
    border: none;
    border-bottom: 1.5px solid var(--border);
    background: transparent;
    padding: 2px 26px 6px 0;
    margin-bottom: 14px;
    color: var(--ink);
  }
  .locationInput::placeholder { color: var(--ink-faint); font-weight: 500; }
  .locationInput:focus { outline: none; border-bottom-color: var(--ink); }

  .schedule-row {
    display: flex;
    gap: 8px;
    margin-bottom: 4px;
  }
  .schedule-row .field {
    flex: 1;
    border: 1px solid var(--border);
    background: var(--surface-dim);
    padding: 5px 9px;
  }
  .schedule-row label {
    display: block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9.5px;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--ink-muted);
    margin-bottom: 2px;
  }
  .schedule-row input {
    width: 100%;
    border: none;
    background: transparent;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    color: var(--ink);
    padding: 0;
  }
  .schedule-row input:focus { outline: none; }

  .date-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }
  .date-wrap .dateInput { padding-right: 18px; }
  .date-wrap .calendarBtn {
    position: absolute;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    border: none;
    background: transparent;
    cursor: pointer;
    font-size: 12px;
    line-height: 1;
    padding: 0 2px;
    color: var(--ink-faint);
  }
  .date-wrap .calendarBtn:hover { color: var(--ink); }
  .date-wrap .dateNative {
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
    left: 0;
    top: 0;
    border: none;
  }

  .time-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }
  .time-wrap .timeInput { padding-right: 18px; }
  .time-wrap .clockBtn {
    position: absolute;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    border: none;
    background: transparent;
    cursor: pointer;
    font-size: 12px;
    line-height: 1;
    padding: 0 2px;
    color: var(--ink-faint);
  }
  .time-wrap .clockBtn:hover { color: var(--ink); }
  .time-wrap .timeNative {
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
    left: 0;
    top: 0;
    border: none;
  }

  .staff-grid { padding-top: 2px; }
  .staff-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 0;
    border-bottom: 1px dotted var(--border);
  }
  .staff-row:last-child { border-bottom: none; }
  .staff-row .role-label {
    width: 122px;
    flex-shrink: 0;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--ink-muted);
  }
  .staff-row.dragging { opacity: 0.35; }
  .staff-row.drag-over { background: var(--south-soft); }
  .drag-handle {
    flex-shrink: 0;
    width: 14px;
    text-align: center;
    font-size: 13px;
    line-height: 1;
    color: var(--ink-faint);
    cursor: grab;
    user-select: none;
  }
  .drag-handle:active { cursor: grabbing; }
  .staff-row select.roleSelect {
    width: 122px;
    flex-shrink: 0;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--ink-muted);
    background: transparent;
    border: none;
    border-radius: 0;
    padding: 2px 0;
    cursor: pointer;
  }
  .staff-row select.roleSelect:focus { outline: none; color: var(--ink); }
  .removeFieldBtn {
    flex-shrink: 0;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 1px solid transparent;
    background: transparent;
    color: var(--ink-faint);
    font-size: 12px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .removeFieldBtn:hover { border-color: var(--danger); color: var(--danger); background: var(--danger-soft); }
  .addFieldBtn {
    display: block;
    width: 100%;
    margin-top: 8px;
    padding: 7px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--ink-muted);
    background: transparent;
    border: 1.5px dashed var(--border);
    border-radius: 2px;
    cursor: pointer;
  }
  .addFieldBtn:hover { border-color: var(--south); color: var(--south); background: var(--south-soft); }
  .staff-row input.nameInput {
    flex: 1;
    min-width: 0;
    border: none;
    border-bottom: 1px solid transparent;
    background: transparent;
    font-size: 13.5px;
    font-weight: 500;
    padding: 2px 2px;
    color: var(--ink);
  }
  .staff-row input.nameInput:focus { outline: none; border-bottom-color: var(--south); }
  .staff-row input.nameInput::placeholder { color: var(--ink-faint); font-weight: 400; }
  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
    background: var(--danger);
    box-shadow: 0 0 0 2px var(--danger-soft);
  }
  .status-dot.filled { background: var(--ok); box-shadow: 0 0 0 2px var(--ok-soft); }

  .attach-row {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1.5px dashed var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .attach-thumb {
    width: 40px;
    height: 40px;
    border-radius: 3px;
    border: 1px dashed var(--ink-faint);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    flex-shrink: 0;
    cursor: pointer;
    color: var(--ink-faint);
    font-size: 15px;
    background: var(--surface-dim);
  }
  .attach-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .attach-text {
    font-size: 12px;
    color: var(--ink-muted);
    cursor: pointer;
    flex: 1;
  }
  .attach-text .fname { color: var(--ink); font-weight: 500; }
  .attach-clear {
    font-size: 11.5px;
    color: var(--danger);
    cursor: pointer;
    background: none;
    border: none;
    text-decoration: underline;
    padding: 0;
    display: none;
  }
  .attach-row.has-photo .attach-clear { display: inline; }
  input[type="file"].hiddenFile { display: none; }

  @media print {
    .toolbar, .stats, .remove-btn, .attach-clear { display: none !important; }
    body { background: #fff; padding: 0 10px; }
    .site-card { break-inside: avoid; border-color: #999; box-shadow: none; }
    .staff-row input.nameInput, .locationInput { border-bottom: none; }
    .ticket-number { box-shadow: none; }
  }
  @media (max-width: 460px) {
    body { padding: 26px 14px 48px; }
    .page-head { flex-direction: column; align-items: flex-start; gap: 12px; }
    .stats { width: 100%; justify-content: space-between; gap: 10px; }
    .toolbar { gap: 8px; }
    .toolbar .btn { flex: 1 1 auto; text-align: center; padding: 9px 10px; }
    .grid { grid-template-columns: 1fr; margin-top: 6px; }
    .region-line { flex-wrap: wrap; padding-right: 30px; }
    .schedule-row { flex-direction: column; }
    .staff-row .role-label,
    .staff-row select.roleSelect { width: 92px; font-size: 9.5px; }
    .staff-row { flex-wrap: wrap; }
  }
  @media (max-width: 340px) {
    .stats { font-size: 11px; }
    .page-head h1 { font-size: 24px; }
  }

  /* ---------- Modal (replaces native alert/confirm popups) ---------- */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 1000;
    background: rgba(33,31,26,0.42);
    display: none; align-items: center; justify-content: center;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    width: 100%; max-width: 380px;
    background: var(--surface);
    border: 1.5px solid var(--ink);
    box-shadow: 6px 6px 0 rgba(33,31,26,0.15);
    padding: 24px 22px 20px;
  }
  .modal-box p {
    margin: 0 0 20px;
    font-size: 14.5px;
    line-height: 1.55;
    color: var(--ink);
    white-space: pre-line;
  }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }
  .modal-actions button {
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 9px 16px;
    border: 1.5px solid var(--ink);
    background: var(--surface);
    color: var(--ink);
    cursor: pointer;
  }
  .modal-actions button:hover { background: var(--surface-dim); }
  .modal-actions button.primary {
    background: var(--ink);
    color: var(--surface);
  }
  .modal-actions button.primary:hover { opacity: 0.88; }
</style>
</head>
<body>

<div class="modal-overlay" id="appModal">
  <div class="modal-box">
    <p id="appModalMessage"></p>
    <div class="modal-actions" id="appModalActions"></div>
  </div>
</div>

<div class="page-head">
  <div>
    <h1>Deployment Roster</h1>
    <p>Medical &amp; Dental Mission — isang ticket kada site, staff assignment tracker</p>
  </div>
  <div class="stats">
    <div class="stat">
      <span class="num" id="statSites">0</span>
      <span class="cap">Sites</span>
    </div>
    <div class="stat warn">
      <span class="num" id="statUnfilled">0</span>
      <span class="cap">Unfilled roles</span>
    </div>
    <div class="stat good">
      <span class="num" id="statReady">0</span>
      <span class="cap">Fully staffed</span>
    </div>
  </div>
</div>

<div class="region-filter" id="regionFilter">
  <button type="button" class="filter-btn active" data-filter="all">All</button>
  <button type="button" class="filter-btn" data-filter="south">South Caloocan</button>
  <button type="button" class="filter-btn" data-filter="north">North Caloocan</button>
</div>

<div class="toolbar">
  <button class="btn primary" id="addCardBtn">+ Add site</button>
  <button class="btn" id="saveBtn">Send</button>
  <button class="btn" id="printBtn">Print / Export PDF</button>
  <button class="btn danger-outline" id="resetBtn">Reset all</button>
</div>

<div id="datalistContainer" style="display:none" aria-hidden="true"></div>

<div class="grid" id="grid"></div>

<script type="module">
// ---------- In-page modal (replaces native alert()/confirm()) ----------
const appModal = document.getElementById("appModal");
const appModalMessage = document.getElementById("appModalMessage");
const appModalActions = document.getElementById("appModalActions");

function closeModal() {
  appModal.classList.remove("open");
  appModalActions.innerHTML = "";
}

function showAlert(message) {
  return new Promise(resolve => {
    appModalMessage.textContent = message;
    appModalActions.innerHTML = "";
    const okBtn = document.createElement("button");
    okBtn.className = "primary";
    okBtn.textContent = "OK";
    okBtn.addEventListener("click", () => { closeModal(); resolve(); });
    appModalActions.appendChild(okBtn);
    appModal.classList.add("open");
    okBtn.focus();
  });
}

function showConfirm(message) {
  return new Promise(resolve => {
    appModalMessage.textContent = message;
    appModalActions.innerHTML = "";
    const cancelBtn = document.createElement("button");
    cancelBtn.textContent = "Cancel";
    cancelBtn.addEventListener("click", () => { closeModal(); resolve(false); });
    const okBtn = document.createElement("button");
    okBtn.className = "primary";
    okBtn.textContent = "Confirm";
    okBtn.addEventListener("click", () => { closeModal(); resolve(true); });
    appModalActions.appendChild(cancelBtn);
    appModalActions.appendChild(okBtn);
    appModal.classList.add("open");
    okBtn.focus();
  });
}

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  initializeFirestore, doc, setDoc, onSnapshot, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Same Firebase project as employee-signup.html / landing-employee-page.html,
// used here so "Send" can publish the roster for employees to read.
const firebaseConfig = {
  apiKey: "AIzaSyAD6rm7RPOObiSw3Pz0wsQJZNaxr0O0TRQ",
  authDomain: "planetdrugstore-peripher-d24c0.firebaseapp.com",
  projectId: "planetdrugstore-peripher-d24c0",
  storageBucket: "planetdrugstore-peripher-d24c0.firebasestorage.app",
  messagingSenderId: "115454971026",
  appId: "1:115454971026:web:0357eaa6bfb171e86cea4b"
};
const fbApp = initializeApp(firebaseConfig);
const db = initializeFirestore(fbApp, {
  experimentalForceLongPolling: true,
  useFetchStreams: false
});
// Single shared doc that "Send" overwrites and employees read live.
const scheduleDocRef = doc(db, "eventSchedule", "current");

// The logged-in employee's session, expected to be set by employee-login.html
// after a successful sign-in, shaped like:
//   { staffId, name, department, branch }  where branch is "south" or "north"
// (branch comes from the Branch field added to employee-signup.html).
// If employee-login.html stores this under a different key/shape, update
// this function to match — that's the only place session lookup happens.
function getEmployeeSession() {
  try {
    const raw = sessionStorage.getItem("pdEmployeeSession") || localStorage.getItem("pdEmployeeSession");
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (!s || (s.branch !== "south" && s.branch !== "north")) return null;
    return s;
  } catch (e) { return null; }
}
const employeeSession = getEmployeeSession();

const STORAGE_KEY = "medicalMissionCardsV2";
const SITE_HISTORY_KEY = "medicalMissionSiteHistoryV1";
const ROLE_HISTORY_KEY = "medicalMissionRoleHistoryV1";

const ROLE_LABELS = [
  "PHARMACIST",
  "PICKER",
  "ENCODER/PICKER",
  "ENCODER/PICKER",
  "BILLING",
  "IT SPECIALIST"
];

// Choices offered in each role field's dropdown.
const ROLE_OPTIONS = ["PHARMACIST", "PICKER", "ENCODER", "BILLING", "IT SPECIALIST"];

// Builds <option> tags for a role dropdown, making sure whatever label the
// row currently has is included (and selected) even if it's not one of the
// standard ROLE_OPTIONS (e.g. older "ENCODER/PICKER" entries).
function roleOptionsHtml(current) {
  const opts = ROLE_OPTIONS.includes(current) ? ROLE_OPTIONS : [current, ...ROLE_OPTIONS];
  return opts.map(r => `<option value="${escapeAttr(r)}" ${r === current ? "selected" : ""}>${escapeHtml(r)}</option>`).join("");
}

function blankCard() {
  return {
    id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()),
    region: "south",
    regionCustom: "",
    mission: "medical",
    location: "",
    date: "",
    time: "",
    staff: ROLE_LABELS.map(label => ({ label, name: "" })),
    photo: null,
    photoName: ""
  };
}

function migrateOld(oldCard) {
  const area = (oldCard.area || "").toUpperCase();
  const region = area.includes("NORTH") ? "north" : "south";
  const mission = area.includes("PEOPLE") ? "peoples_day" : "medical";
  return {
    id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()),
    region, regionCustom: "",
    mission,
    location: oldCard.location || "",
    date: oldCard.date || "",
    time: oldCard.time || "",
    staff: oldCard.staff || ROLE_LABELS.map(label => ({ label, name: "" })),
    photo: oldCard.photo || null,
    photoName: ""
  };
}

function loadCards() {
  const savedV2 = localStorage.getItem(STORAGE_KEY);
  if (savedV2) {
    try { return JSON.parse(savedV2); } catch (e) {}
  }
  const savedV1 = localStorage.getItem("medicalMissionCards");
  if (savedV1) {
    try { return JSON.parse(savedV1).map(migrateOld); } catch (e) {}
  }
  return Array.from({ length: 6 }, blankCard);
}

// new auto-uppercase behavior right away.
cards.forEach(c => {
  c.location = (c.location || "").toUpperCase();
  c.staff.forEach(s => { s.name = (s.name || "").toUpperCase(); });
});

function saveCards() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(cards));
}

// ---------- Site name / role name suggestion history ----------
// siteHistory: every site name ever entered (for the Site name field).
// roleHistory: names used per role label (e.g. "PHARMACIST" -> [names...]),
// so each role only suggests names that have actually been assigned to it.
let siteHistory = new Set(JSON.parse(localStorage.getItem(SITE_HISTORY_KEY) || "[]"));
let roleHistory = JSON.parse(localStorage.getItem(ROLE_HISTORY_KEY) || "{}");

// Seed history from whatever is already saved, so suggestions are
// available immediately, not just going forward.
cards.forEach(c => {
  if (c.location.trim()) siteHistory.add(c.location.trim());
  c.staff.forEach(s => {
    if (!s.name.trim()) return;
    if (!roleHistory[s.label]) roleHistory[s.label] = [];
    if (!roleHistory[s.label].includes(s.name.trim())) roleHistory[s.label].push(s.name.trim());
  });
});

function saveSiteHistory() {
  localStorage.setItem(SITE_HISTORY_KEY, JSON.stringify([...siteHistory]));
}
function saveRoleHistory() {
  localStorage.setItem(ROLE_HISTORY_KEY, JSON.stringify(roleHistory));
}
function addSiteHistory(value) {
  const val = (value || "").trim();
  if (!val || siteHistory.has(val)) return;
  siteHistory.add(val);
  saveSiteHistory();
  renderDatalists();
}
function addRoleHistory(label, value) {
  const val = (value || "").trim();
  if (!val) return;
  if (!roleHistory[label]) roleHistory[label] = [];
  if (roleHistory[label].includes(val)) return;
  roleHistory[label].push(val);
  saveRoleHistory();
  renderDatalists();
}

function slug(str) {
  return (str || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
}

function renderDatalists() {
  const container = document.getElementById("datalistContainer");
  let html = `<datalist id="siteNameList">${[...siteHistory].sort().map(v => `<option value="${escapeAttr(v)}">`).join("")}</datalist>`;
  Object.keys(roleHistory).forEach(label => {
    html += `<datalist id="roleNameList-${slug(label)}">${roleHistory[label].slice().sort().map(v => `<option value="${escapeAttr(v)}">`).join("")}</datalist>`;
  });

}

// Keeps what the user is typing uppercase without jumping the caret around.
function uppercaseInPlace(el) {
  const start = el.selectionStart, end = el.selectionEnd;
  el.value = el.value.toUpperCase();
  el.setSelectionRange(start, end);
}

// Auto-appends " - ONWARDS" to the time field as the user types, and removes
// it again if the field is cleared back to empty. Keeps the caret in place.
const TIME_SUFFIX = " - ONWARDS";
function autoSuffixOnwards(el) {
  const caret = el.selectionStart;
  let base = el.value.replace(/\s*-\s*ONWARDS\s*$/i, "");
  base = base.replace(/[^0-9]/g, "");
  el.value = base.length > 0 ? base + TIME_SUFFIX : base;
  const pos = Math.min(caret, base.length);
  el.setSelectionRange(pos, pos);
}

// ---- Date masking helpers (MMDDYYYY digits <-> "January 31, 2026") ----
function isoToDigits(iso) {
  if (!iso) return "";
  const parts = iso.split("-");
  if (parts.length !== 3) return "";
  const [y, m, d] = parts;
  if (!y || !m || !d) return "";
  return m + d + y;
}
function digitsToIso(raw) {
  if (raw.length < 8) return "";
  const mm = raw.slice(0, 2), dd = raw.slice(2, 4), yyyy = raw.slice(4, 8);
  return `${yyyy}-${mm}-${dd}`;
}
function maskDigits(raw) {
  const mm = raw.slice(0, 2), dd = raw.slice(2, 4), yyyy = raw.slice(4, 8);
  let out = mm;
  if (dd) out += "/" + dd;
  if (yyyy) out += "/" + yyyy;
  return out;
}
function formatDateDisplay(iso) {
  if (!iso) return "";
  const parts = iso.split("-").map(Number);
  if (parts.length !== 3) return "";
  const [y, m, d] = parts;
  const dt = new Date(y, m - 1, d);
  if (isNaN(dt.getTime())) return "";
  return dt.toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });
}
// Rebuilds the visible dateInput value from a raw MMDDYYYY digit buffer and
// returns the resulting ISO date (or "" while incomplete).
function renderDateField(el, raw) {
  const iso = digitsToIso(raw);
  el.value = iso ? formatDateDisplay(iso) : maskDigits(raw);
  el.dataset.raw = raw;
  return iso;
}

// Blocks any keystroke that isn't a digit or a navigation/editing key —
// used to keep TIME and DATE fields number-only.
function digitsOnlyKeydown(e) {
  if (e.metaKey || e.ctrlKey || e.key === "Tab") return;
  const allowed = ["Backspace", "Delete", "ArrowLeft", "ArrowRight", "Home", "End", "Enter", "Escape"];
  if (allowed.includes(e.key)) return;
  if (!/^[0-9]$/.test(e.key)) {
    e.preventDefault();
  }
}

// Converts a native <input type="time"> value ("HH:MM", 24h) into the
// field's display format, e.g. "07:00" -> "7:00AM".
function formatTimeFrom24(hhmm) {
  if (!hhmm) return "";
  const [hStr, mStr] = hhmm.split(":");
  let h = parseInt(hStr, 10);
  if (isNaN(h)) return "";
  const ampm = h >= 12 ? "PM" : "AM";
  h = h % 12;
  if (h === 0) h = 12;
  return `${h}:${mStr}${ampm}`;
}

// ---- Time masking helpers (typed digits -> "7:00AM", auto-completed) ----
// Splits a typed digit buffer into hour/minute digits. Only "1" followed by
// 0/1/2 is treated as a two-digit hour (10, 11, 12); any other first digit
// (2-9) is a complete hour on its own, e.g. "7" -> hour "7" immediately.
function parseTimeRaw(raw) {
  if (!raw) return { hourDigits: "", minuteDigits: "" };
  let hourDigits, rest;
  if (raw[0] === "1" && raw.length >= 2 && /[012]/.test(raw[1])) {
    hourDigits = raw.slice(0, 2);
    rest = raw.slice(2);
  } else {
    hourDigits = raw.slice(0, 1);
    rest = raw.slice(1);
  }
  const minuteDigits = rest.slice(0, 2);
  return { hourDigits, minuteDigits };
}
// Builds the "H:MMAM" text from split digit parts, defaulting minutes to
// "00" until the user types them.
function formatTimeParts(hourDigits, minuteDigits, ampm) {
  if (!hourDigits) return "";
  let h = parseInt(hourDigits, 10);
  if (h === 0) h = 12;
  if (h > 12) h = 12;
  let mDisplay;
  if (minuteDigits.length === 0) mDisplay = "00";
  else if (minuteDigits.length === 1) mDisplay = minuteDigits;
  else {
    let m = parseInt(minuteDigits, 10);
    if (m > 59) m = 59;
    mDisplay = String(m).padStart(2, "0");
  }
  return `${h}:${mDisplay}${ampm}`;
}
// Rebuilds the visible TIME input value (plus the " - ONWARDS" suffix) from
// a raw digit buffer and an AM/PM flag, e.g. raw="7" ampm="AM" ->
// "7:00AM - ONWARDS". Stores the buffer back on the element for next keystroke.
function renderTimeField(el, raw, ampm) {
  const { hourDigits, minuteDigits } = parseTimeRaw(raw);
  const base = formatTimeParts(hourDigits, minuteDigits, ampm);
  el.value = base ? base + TIME_SUFFIX : "";
  el.dataset.raw = raw;
  el.dataset.ampm = ampm;
  return el.value;
}
// Extracts a raw digit buffer + AM/PM flag back out of a previously
// formatted time string, e.g. "7:00AM - ONWARDS" -> {raw:"700", ampm:"AM"}.
function timeToRawAmpm(str) {
  const m = (str || "").match(/(\d{1,2}):(\d{2})\s*(AM|PM)/i);
  if (!m) return { raw: "", ampm: "AM" };
  return { raw: m[1] + m[2], ampm: m[3].toUpperCase() };
}
// Keydown handler for a TIME field: digits build the raw buffer (auto-
// formatting to "H:MMAM/PM" after every keystroke), A/P toggles AM-PM, and
// Backspace/Delete remove the last digit typed.
function timeInputKeydown(el, idx) {
  return e => {
    if (e.metaKey || e.ctrlKey || e.key === "Tab") return;
    let raw = el.dataset.raw || "";
    let ampm = el.dataset.ampm || "AM";
    const key = e.key;
    if (key === "Backspace" || key === "Delete") {
      e.preventDefault();
      raw = raw.slice(0, -1);
    } else if (/^[0-9]$/.test(key)) {
      e.preventDefault();
      if (raw.length < 4) raw += key;
    } else if (/^[aApP]$/.test(key)) {
      e.preventDefault();
      if (!raw) return;
      ampm = key.toLowerCase() === "a" ? "AM" : "PM";
    } else if (["ArrowLeft", "ArrowRight", "Home", "End", "Enter", "Escape"].includes(key)) {
      return;
    } else {
      e.preventDefault();
      return;
    }
    renderTimeField(el, raw, ampm);
    cards[idx].time = el.value;
    saveCards();
  };
}

function regionLabel(card) {
  if (card.region === "south") return "South Caloocan";
  if (card.region === "north") return "North Caloocan";

}
function missionLabel(card) {

}

    if (empty === 0) ready++;
  });
  document.getElementById("statUnfilled").textContent = unfilled;
  document.getElementById("statReady").textContent = ready;
}

      row.addEventListener("drop", e => {
        e.preventDefault();
        row.classList.remove("drag-over");
        const fromIdx = parseInt(e.dataTransfer.getData("text/plain"), 10);

        render();

        cardEl.querySelectorAll(".staff-row").forEach(r => r.classList.remove("dragging", "drag-over"));
      });
    });

    const fileInput = cardEl.querySelector(".hiddenFile");
    const thumb = cardEl.querySelector(".attach-thumb");
    const attachText = cardEl.querySelector(".attach-text");

        render();
      };
      reader.readAsDataURL(file);
    });

      cards[idx].photo = null;
      cards[idx].photoName = "";
      saveCards();
      render();
    });

  });

  updateStats();
}

          <div class="field">
            <label>Date</label>
            <div>${escapeHtml(formatDateDisplay(card.date) || "—")}</div>
          </div>
          <div class="field">
            <label>Time</label>
            <div>${escapeHtml(card.time || "—")}</div>
          </div>
        </div>
        <div class="perforation"></div>
        <div class="staff-grid">
          ${(card.staff || []).map(s => `
            <div class="staff-row">
              <span style="min-width:120px;color:var(--ink-muted);font-size:12px;">${escapeHtml(s.label)}</span>
              <strong>${escapeHtml(s.name) || "—"}</strong>
            </div>
          `).join("")}
        </div>
      </div>
    `;
    grid.appendChild(cardEl);
  });
}

function escapeAttr(str) {
  return (str || "").replace(/"/g, "&quot;");
}
function escapeHtml(str) {
  return (str || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

document.querySelectorAll("#regionFilter .filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    currentFilter = btn.dataset.filter;
    document.querySelectorAll("#regionFilter .filter-btn").forEach(b => b.classList.toggle("active", b === btn));
    render();
  });
});

document.getElementById("addCardBtn").addEventListener("click", () => {
  cards.push(blankCard());
  saveCards();
  render();
});

document.getElementById("saveBtn").addEventListener("click", async () => {
  saveCards();
  const sendBtn = document.getElementById("saveBtn");
  const originalLabel = sendBtn.textContent;
  sendBtn.disabled = true;
  sendBtn.textContent = "Sending…";
  try {
    // Strip photo data URLs before sending — they're large base64 blobs
    // employees don't need in order to see their site/date/time/role assignment.
    const payload = cards.map(({ photo, photoName, ...rest }) => rest);
    await setDoc(scheduleDocRef, {
      cards: payload,
      sentAt: serverTimestamp(),
      sentBy: "admin"
    });
    await showAlert("Schedule sent to employees. South will only see South, North will only see North.");
  } catch (err) {
    await showAlert("Saved to your browser, but not sent online: " + err.message);
  } finally {
    sendBtn.disabled = false;
    sendBtn.textContent = originalLabel;
  }
});

document.getElementById("printBtn").addEventListener("click", () => window.print());

document.getElementById("resetBtn").addEventListener("click", async () => {
  if (await showConfirm("Reset all data? This cannot be undone.")) {
    cards = Array.from({ length: 6 }, blankCard);
    saveCards();
    render();
  }
});

if (employeeSession) {
  // Employee mode: hide the admin editing toolbar/filters and show a
  // live, read-only view scoped to their own branch.
  document.querySelector(".toolbar").style.display = "none";
  document.getElementById("regionFilter").style.display = "none";
  onSnapshot(scheduleDocRef, snap => {
    const data = snap.exists() ? snap.data() : { cards: [] };
    renderEmployeeSchedule(data.cards || [], employeeSession.branch);
  });
} else {
  // Admin/manager mode: full editable dashboard, as before.
  renderDatalists();
  render();
}
</script>

</body>
</html>
