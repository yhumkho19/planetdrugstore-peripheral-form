// Read-only view shown to a logged-in employee: only sites matching their
// own branch (south/north), no editing controls.
function renderEmployeeSchedule(scheduleCards, branch) {
  const branchLabel = branch === "south" ? "South Caloocan" : "North Caloocan";
  const headSub = document.querySelector(".page-head p");
  if (headSub) headSub.textContent = `Deployment schedule for ${branchLabel} only.`;

  const filtered = (scheduleCards || []).filter(c => c.region === branch);

  // Find the one slot (if any) this employee currently holds, across every
  // branch/date — an employee can only hold one slot at a time, so every
  // other open slot's "Sign me up" button gets disabled until they leave it.
  let myActiveSlot = null;
  (scheduleCards || []).some(c => {
    const staff = c.staff || [];
    for (let i = 0; i < staff.length; i++) {
      if (employeeSession && staff[i].filledByStaffId === employeeSession.staffId) {
        myActiveSlot = { cardId: c.id, sIdx: i };
        return true;
      }
    }
    return false;
  });

  document.getElementById("statSites").textContent = filtered.length;
  let unfilled = 0, ready = 0;
  filtered.forEach(c => {
    const empty = (c.staff || []).filter(s => !(s.name || "").trim()).length;
    unfilled += empty;
    if (empty === 0) ready++;
  });
  document.getElementById("statUnfilled").textContent = unfilled;
  document.getElementById("statReady").textContent = ready;

  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  if (!filtered.length) {
    grid.innerHTML = `<p style="color:var(--ink-muted);font-size:13.5px;">No schedule has been sent yet for ${branchLabel}.</p>`;
    return;
  }

  // Group this employee's sites into date brackets, so they pick a date
  // up top and only see that date's available event bracket below.
  const groups = groupCardsByDate(filtered.map(card => ({ card })));

  // Keep the previously-selected date if it's still around; otherwise
  // default to the first (earliest) bracket.
  if (!groups.some(g => g.date === employeeSelectedDate)) {
    employeeSelectedDate = groups[0].date;
  }

  const tabs = document.createElement("div");
  tabs.className = "date-tabs";
  groups.forEach(group => {
    const tab = document.createElement("button");
    tab.type = "button";
    const openCount = bracketOpenCount(group.items);
    tab.className = "date-tab" + (group.date === employeeSelectedDate ? " active" : "") + (openCount > 0 ? " has-open" : "");
    const label = group.date ? formatDateDisplay(group.date) : "Unscheduled";
    tab.innerHTML = `${escapeHtml(label)} (${group.items.length})` +
      (openCount > 0
        ? `<span class="tab-badge">${openCount} open</span>`
        : `<span class="tab-badge ok">✓ full</span>`);
    tab.addEventListener("click", () => {
      employeeSelectedDate = group.date;
      renderEmployeeSchedule(scheduleCards, branch);
    });
    tabs.appendChild(tab);
  });
  grid.appendChild(tabs);

  const activeGroup = groups.find(g => g.date === employeeSelectedDate) || groups[0];
  const bracketGrid = document.createElement("div");
  bracketGrid.className = "bracket-grid";
  grid.appendChild(bracketGrid);

  activeGroup.items.forEach(({ card }, idx) => {
    const cardEl = document.createElement("div");
    cardEl.className = "site-card";
    cardEl.dataset.region = card.region;
    cardEl.innerHTML = `
      <div class="ticket-number">#${String(idx + 1).padStart(2, "0")}</div>
      <div class="accent-bar"></div>
      <div class="card-inner">
        <div class="region-line">
          <span class="sep">${escapeHtml(regionLabel(card))} · ${escapeHtml(missionLabel(card))}</span>
          ${(() => {
            const openHere = (card.staff || []).filter(s => !(s.name || "").trim()).length;
            return openHere > 0
              ? `<span class="card-status warn">${openHere} role${openHere === 1 ? "" : "s"} open</span>`
              : `<span class="card-status ok">✓ fully staffed</span>`;
          })()}
        </div>
        <div class="locationInput" style="border:none;padding:0;">${escapeHtml(card.location || "Unnamed site")}</div>
        <div class="schedule-row">
          <div class="field">
            <label>Date</label>
            <div>${escapeHtml(formatDateDisplay(card.date) || "—")}</div>
          </div>
          <div class="field">
            <label>Time</label>
            <div>${escapeHtml(card.time || "—")}</div>
          </div>
        </div>
        <div class="perforation"></div>
        <div class="staff-grid">
          ${(card.staff || []).map((s, sIdx) => {
            const filled = (s.name || "").trim().length > 0;
            const isMine = filled && employeeSession && s.filledByStaffId === employeeSession.staffId;
            const isEmergencyOpen = !filled && s.emergency;
            return `
            <div class="staff-row${isEmergencyOpen ? " emergency" : ""}">
              <span class="status-dot ${filled ? "filled" : ""}"></span>
              <span style="min-width:120px;color:var(--ink-muted);font-size:12px;">
                ${escapeHtml(s.label)}
                ${isEmergencyOpen ? `<span class="emergency-note">🚨 Previously: ${escapeHtml(s.emergencyBy || "Employee")} — unavailable</span>` : ""}
              </span>
              ${filled
                ? `<strong style="flex:1;">${escapeHtml(s.name)}</strong>` +
                  (isMine
                    ? `<button type="button" class="unavailable-btn" data-card-id="${escapeAttr(card.id)}" data-sidx="${sIdx}">🚨 Not Available</button>` +
                      `<button type="button" class="unclaim-btn" data-card-id="${escapeAttr(card.id)}" data-sidx="${sIdx}">Leave slot</button>`
                    : "")
                : (() => {
                    const allowed = isRoleAllowedForEmployee(s.label);
                    const blockedByOtherSlot = !!myActiveSlot && !(myActiveSlot.cardId === card.id && myActiveSlot.sIdx === sIdx);
                    const label = isEmergencyOpen ? "🚨 Take slot (URGENT)" : "+ Sign me up";
                    if (blockedByOtherSlot) {
                      return `<button type="button" class="claim-btn blocked" disabled title="You're already signed up for another slot — leave it first to sign up here">${label}</button>`;
                    }
                    return `<button type="button" class="claim-btn${allowed ? "" : " blocked"}${isEmergencyOpen && allowed ? " urgent" : ""}" data-card-id="${escapeAttr(card.id)}" data-sidx="${sIdx}" data-role-label="${escapeAttr(s.label)}"${allowed ? "" : ` title="This is for ${escapeAttr(roleToTeam(s.label))} only"`}>${label}</button>`;
                  })()
              }
            </div>
          `;
          }).join("")}
        </div>
      </div>
    `;
    cardEl.querySelectorAll(".claim-btn").forEach(btn => {
      btn.addEventListener("click", async () => {
        const roleLabel = btn.dataset.roleLabel;
        if (!isRoleAllowedForEmployee(roleLabel)) {
          const { team: myTeam } = employeeSession ? splitDepartmentClient(employeeSession.department) : { team: "—" };
          await showAlert(`You can't sign up here. This is a "${roleLabel}" role only, and your department is ${myTeam}.`);
          return;
        }
        claimSlot(btn.dataset.cardId, parseInt(btn.dataset.sidx, 10), btn);
      });
    });
    cardEl.querySelectorAll(".unclaim-btn").forEach(btn => {
      btn.addEventListener("click", async () => {
        const ok = await showConfirm("Remove your name from this slot?");
        if (!ok) return;
        unclaimSlot(btn.dataset.cardId, parseInt(btn.dataset.sidx, 10), btn);
      });
    });
    cardEl.querySelectorAll(".unavailable-btn").forEach(btn => {
      btn.addEventListener("click", async () => {
        const ok = await showConfirm("Mark yourself as unavailable due to an emergency?\n\nThe admin and other qualified employees will be notified right away so this slot can be filled.");
        if (!ok) return;
        markUnavailable(btn.dataset.cardId, parseInt(btn.dataset.sidx, 10), btn);
      });
    });
    bracketGrid.appendChild(cardEl);
  });
}

function escapeAttr(str) {
  return (str || "").replace(/"/g, "&quot;");
}
function escapeHtml(str) {
  return (str || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// ---------- Employee leaderboard (most-participate) ----------
// staffId (lowercase) -> { name, department } from the "employees"
// collection. Filled in by startEmployeesListener(); used to resolve each
// participant's branch (south/north) and team (IT / BILLING / Pharmacy
// Assistant) for the leaderboard cards below.
let employeesMap = new Map();
// Last full (unfiltered, both branches) schedule cards seen, so the
// leaderboard can be re-rendered whenever either the schedule or the
// employees list changes, without waiting for the other to also change.
let lastScheduleCardsForLeaderboard = [];
// Guards the "my account got deleted" check below against a slow/offline
// first read of the employees collection ever looking like a deletion for
// someone who's actually still a valid employee — only checked from the
// second snapshot onward.
let employeesSnapshotSeen = false;

// Splits a department string like "IT NORTH" or "Pharmacy Assistant SOUTH"
// into { team: "IT", branch: "NORTH" }, same convention as admin-console.html.
function splitDepartmentClient(dep) {
  const raw = String(dep || "").trim();
  const m = raw.match(/^(.*?)\s+(NORTH|SOUTH)$/i);
  if (m) return { team: m[1].trim(), branch: m[2].toUpperCase() };
  return { team: raw || "—", branch: "—" };
}

// Maps a role-slot label (e.g. "IT SPECIALIST", "PHARMACIST", "PICKER") to
// the department/team that's allowed to sign up for it. PICKER and
// ENCODER/PICKER are Pharmacy Assistant work, not PHARMACIST — keep those
// separate so a Pharmacist account can't claim a Picker slot and vice versa.
function roleToTeam(label) {
  const up = String(label || "").toUpperCase();
  if (up.includes("IT")) return "IT";
  if (up.includes("BILLING")) return "BILLING";
  if (up === "PHARMACIST") return "PHARMACIST";
  return "Pharmacy Assistant"; // PICKER, ENCODER, ENCODER/PICKER
}

// Whether the currently logged-in employee's own department matches the
// team a given role slot belongs to. Used to block signing up for roles
// outside your own department (e.g. a BILLING employee can't sign up for
// a PHARMACIST slot).
function isRoleAllowedForEmployee(label) {
  if (!employeeSession) return false;
  const { team } = splitDepartmentClient(employeeSession.department);
  return String(team).toUpperCase() === roleToTeam(label).toUpperCase();
}

function startEmployeesListener() {
  onSnapshot(employeesCollRef, snap => {
    const map = new Map();
    snap.forEach(d => map.set(d.id, d.data() || {}));
    employeesMap = map;
    renderLeaderboard(lastScheduleCardsForLeaderboard);
    // The account this map no longer contains might still be sitting in a
    // signed-up slot on the live roster (admin deleted the account, but
    // nothing ever told the schedule to let go of it). Every time the
    // employees collection changes — including a deletion — re-check every
    // claimed slot and free the ones whose staffId no longer has an account.
    clearSlotsForDeletedEmployees(map);
    // If the employee currently viewing this page is the one who just got
    // deleted, don't leave them sitting on a page for an account that no
    // longer exists — send them to the same login page/message
    // employee-login.html already shows when it's opened with ?deleted=1.
    if (employeeSession && employeesSnapshotSeen) {
      const myId = (employeeSession.staffId || "").trim().toLowerCase();
      if (myId && !map.has(myId)) {
        try {
          localStorage.removeItem("pdEmployeeSession");
          sessionStorage.removeItem("pdEmployeeSession");
        } catch (e) { /* best-effort */ }
        window.location.href = "employee-login.html?deleted=1";
        return;
      }
    }
    employeesSnapshotSeen = true;
  });
}

// Reads the live roster, clears any slot whose filledByStaffId isn't in
// currentEmployeesMap anymore (account was deleted), and pushes the fix
// straight to Firestore so every open admin/employee view updates itself —
// same as deleteSiteFromRemote/deleteDateFromRemote, no button needed.
// Slots an admin filled in by typing a plain name (no filledByStaffId)
// are untouched; only self-claimed slots tied to a real account are checked.
async function clearSlotsForDeletedEmployees(currentEmployeesMap) {
  try {
    const snap = await getDoc(scheduleDocRef);
    const data = snap.exists() ? snap.data() : { cards: [] };
    const remoteCards = Array.isArray(data.cards) ? data.cards : [];
    let changed = false;
    const nextCards = remoteCards.map(card => {
      const staffArr = (card.staff || []).map(slot => {
        const sid = (slot.filledByStaffId || "").trim();
        if (!sid || currentEmployeesMap.has(sid.toLowerCase())) return slot;
        changed = true;
        return { ...slot, name: "", filledByStaffId: null };
      });
      return { ...card, staff: staffArr };
    });
    if (!changed) return;
    await setDoc(scheduleDocRef, {
      cards: nextCards,
      sentAt: serverTimestamp(),
      sentBy: data.sentBy || "admin"
    });
  } catch (err) {
    // Best-effort — if this fails (e.g. offline), the next employees
    // snapshot or page load will simply try the cleanup again.
    console.error("Failed to clear deleted employees' slots:", err);
  }
}

// Counts, per staffId, how many role slots (across every site/date, both
// branches) that person has personally signed themselves up for. Only
// self-claimed slots count (slot.filledByStaffId) — names an admin typed in
// manually don't have a staffId and aren't attributable to a participant.
function computeParticipation(allCards) {
  const counts = new Map(); // staffId(lowercase) -> { count, name }
  (allCards || []).forEach(card => {
    (card.staff || []).forEach(s => {
      const sid = (s.filledByStaffId || "").trim();
      if (!sid) return;
      const key = sid.toLowerCase();
      const entry = counts.get(key) || { count: 0, name: s.name || "" };
      entry.count += 1;
      if ((s.name || "").trim()) entry.name = s.name;
      counts.set(key, entry);
    });
  });
  return counts;
}

function leaderboardBranchTag(branch) {
  const upper = String(branch || "").toUpperCase();
  if (upper === "SOUTH") return `<span class="tag tag-south">South</span>`;
  if (upper === "NORTH") return `<span class="tag tag-north">North</span>`;
  return `<span class="tag tag-other">—</span>`;
}

function podiumCardHtml(row, place) {
  const badge = place === 1 ? "🥇" : place === 2 ? "🥈" : "🥉";
  return `
    <div class="podium-card place-${place}">
      <div class="podium-badge">${badge}</div>
      <div class="podium-name">${escapeHtml(row.name)}</div>
      <div class="podium-meta">
        ${leaderboardBranchTag(row.branch)}
        <span class="tag tag-role">${escapeHtml(row.team)}</span>
      </div>
      <div class="podium-count">${row.count} sign-up${row.count === 1 ? "" : "s"}</div>
    </div>
  `;
}

function deptBoardHtml(deptLabel, rows) {
  const items = rows.length
    ? rows.map((row, i) => `
        <li class="dept-row">
          <span class="dept-rank">#${i + 1}</span>
          <span class="dept-name">${escapeHtml(row.name)}</span>
          ${leaderboardBranchTag(row.branch)}
          <span class="dept-count">${row.count}</span>
        </li>
      `).join("")
    : `<li class="dept-empty">No data yet.</li>`;
  return `
    <div class="dept-board">
      <div class="dept-board-title">${escapeHtml(deptLabel)}</div>
      <ul class="dept-list">${items}</ul>
    </div>
  `;
}

function renderLeaderboard(allCards) {
  lastScheduleCardsForLeaderboard = allCards || [];
  const section = document.getElementById("leaderboardSection");
  if (!section || !employeeSession) return;
  section.style.display = "";

  const counts = computeParticipation(lastScheduleCardsForLeaderboard);
  const rows = [...counts.entries()].map(([staffId, info]) => {
    const emp = employeesMap.get(staffId);
    const { team, branch } = emp ? splitDepartmentClient(emp.department) : { team: "—", branch: "—" };
    return {
      staffId,
      name: (emp && emp.name) || info.name || staffId.toUpperCase(),
      count: info.count,
      team,
      branch
    };
  }).sort((a, b) => b.count - a.count);

  if (!rows.length) {
    section.innerHTML = `
      <div class="leaderboard-wrap">
        <h2 class="leaderboard-title">🏆 Most Participate Employee</h2>
        <p class="leaderboard-empty">No one has signed up yet. Be the first — sign up for an open slot below!</p>
      </div>
    `;
    return;
  }

  const top3 = rows.slice(0, 3);
  const podiumHtml = top3.map((row, i) => podiumCardHtml(row, i + 1)).join("");

  const DEPTS = ["IT", "BILLING", "PHARMACIST", "Pharmacy Assistant"];
  const deptBoardsHtml = DEPTS.map(dept => {
    const deptRows = rows.filter(r => r.team.toUpperCase() === dept.toUpperCase()).slice(0, 3);
    return deptBoardHtml(dept, deptRows);
  }).join("");

  section.innerHTML = `
    <div class="leaderboard-wrap">
      <h2 class="leaderboard-title">🏆 Most Participate Employee</h2>
      <p class="leaderboard-sub">Based on the number of slots personally signed up for, South &amp; North Caloocan.</p>
      <div class="podium">${podiumHtml}</div>
      <div class="dept-boards">${deptBoardsHtml}</div>
    </div>
  `;
}

document.querySelectorAll("#regionFilter .filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    currentFilter = btn.dataset.filter;
    document.querySelectorAll("#regionFilter .filter-btn").forEach(b => b.classList.toggle("active", b === btn));
    render();
  });
});

document.getElementById("addDateBtn").addEventListener("click", async () => {
  const iso = await showDatePrompt("Choose the date for the new event bracket:");
  if (!iso) return;
  const newCard = blankCard();
  newCard.date = iso;
  cards.push(newCard);
  adminSelectedDate = iso;
  saveCards();
  render();
  pushNewCardToRemote(newCard);
});

document.getElementById("addCardBtn").addEventListener("click", () => {
  const newCard = blankCard();
  cards.push(newCard);
  adminSelectedDate = ""; // new site has no date yet -> lands in "Unscheduled"
  saveCards();
  render();
  pushNewCardToRemote(newCard);
});

// Strips fields that should never be pushed to the remote doc: photo data
// (too large, employees don't need it) and the local-only _touched marker
// used by mergeRemoteClaims below.
function stripForRemote(cardsArr) {
  return cardsArr.map(({ photo, photoName, staff, ...rest }) => ({
    ...rest,
    staff: (staff || []).map(({ _touched, ...s }) => s)
  }));
}

// Admin edits happen on a local copy that isn't live-synced with Firestore,
// so if an employee signs herself up for an open slot after the admin last
// loaded the page, a plain overwrite (Send / Update) would silently erase
// that signup. Before pushing, for every slot the admin did NOT touch this
// session, if it's blank locally but remote shows an employee already
// claimed it, keep the remote value instead of blanking it out.
function mergeRemoteClaims(localCards, remoteCards) {
  const remoteById = new Map(remoteCards.map(c => [c.id, c]));
  return localCards.map(card => {
    const remoteCard = remoteById.get(card.id);
    if (!remoteCard) return card;
    const mergedStaff = (card.staff || []).map((slot, sIdx) => {
      if (slot._touched) return slot;
      const remoteSlot = (remoteCard.staff || [])[sIdx];
      if (!remoteSlot) return slot;
      if (!(slot.name || "").trim() && remoteSlot.filledByStaffId && (remoteSlot.name || "").trim()) {
        return { ...slot, name: remoteSlot.name, filledByStaffId: remoteSlot.filledByStaffId };
      }
      return slot;
    });
    return { ...card, staff: mergedStaff };
  });
}

// Lets a logged-in employee claim one open role slot directly, as a single
// Firestore transaction — so two employees tapping the same open slot at
// the same moment can't both "win" it.
async function claimSlot(cardId, staffIdx, btn) {
  const originalLabel = btn.textContent;
  btn.disabled = true;
  btn.textContent = "Sending…";
  try {
    await runTransaction(db, async (tx) => {
      const snap = await tx.get(scheduleDocRef);
      const data = snap.exists() ? snap.data() : { cards: [] };
      const remoteCards = Array.isArray(data.cards) ? data.cards : [];
      const cIdx = remoteCards.findIndex(c => c.id === cardId);
      if (cIdx === -1) throw new Error("Site not found — try refreshing.");
      const staffArr = (remoteCards[cIdx].staff || []).slice();
      const slot = staffArr[staffIdx];
      if (!slot) throw new Error("Role slot not found — try refreshing.");
      if ((slot.name || "").trim()) throw new Error("Someone already signed up here before you. Try refreshing.");
      if (!isRoleAllowedForEmployee(slot.label)) throw new Error(`You can't sign up here. This is a "${slot.label}" role only.`);
      const alreadyHasSlot = remoteCards.some(c =>
        (c.staff || []).some(s => s.filledByStaffId === employeeSession.staffId)
      );
      if (alreadyHasSlot) throw new Error("You're already signed up for another slot. Leave that one first before signing up here.");
      staffArr[staffIdx] = {
        ...slot,
        name: (employeeSession.name || "").toUpperCase(),
        filledByStaffId: employeeSession.staffId,
        emergency: false,
        emergencyBy: null,
        emergencyByStaffId: null,
        emergencyAt: null
      };
      remoteCards[cIdx] = { ...remoteCards[cIdx], staff: staffArr };
      tx.set(scheduleDocRef, { cards: remoteCards, sentAt: serverTimestamp(), sentBy: data.sentBy || "admin" });
    });
    // The slot may have been an emergency vacancy — clear any matching
    // open notification now that someone has covered it.
    resolveNotificationsFor(cardId, staffIdx);
  } catch (err) {
    await showAlert(err.message || "Failed to save. Please try again.");
    btn.disabled = false;
    btn.textContent = originalLabel;
  }
  // On success the onSnapshot listener re-renders with the live result —
  // no local re-render needed here.
}

// Lets a logged-in employee mark herself unavailable for a slot she already
// owns, due to an emergency. This frees the slot back up (like unclaimSlot)
// but tags it "emergency" so admin and other employees see it as urgent —
// and files a notification doc so the admin bell + matching employees'
// banners light up immediately, without anyone needing to refresh.
async function markUnavailable(cardId, staffIdx, btn) {
  const originalLabel = btn.textContent;
  btn.disabled = true;
  btn.textContent = "Sending…";
  let notifyPayload = null;
  try {
    await runTransaction(db, async (tx) => {
      const snap = await tx.get(scheduleDocRef);
      const data = snap.exists() ? snap.data() : { cards: [] };
      const remoteCards = Array.isArray(data.cards) ? data.cards : [];
      const cIdx = remoteCards.findIndex(c => c.id === cardId);
      if (cIdx === -1) throw new Error("Site not found — try refreshing.");
      const card = remoteCards[cIdx];
      const staffArr = (card.staff || []).slice();
      const slot = staffArr[staffIdx];
      if (!slot) throw new Error("Role slot not found — try refreshing.");
      if (!employeeSession || slot.filledByStaffId !== employeeSession.staffId) {
        throw new Error("This is not your slot.");
      }
      const prevName = slot.name || employeeSession.name || "";
      staffArr[staffIdx] = {
        ...slot,
        name: "",
        filledByStaffId: null,
        emergency: true,
        emergencyBy: prevName,
        emergencyByStaffId: employeeSession.staffId,
        emergencyAt: Date.now()
      };
      remoteCards[cIdx] = { ...card, staff: staffArr };
      tx.set(scheduleDocRef, { cards: remoteCards, sentAt: serverTimestamp(), sentBy: data.sentBy || "admin" });
      notifyPayload = {
        cardId,
        staffIdx,
        role: slot.label || "",
        location: card.location || "Unnamed site",
        date: card.date || "",
        time: card.time || "",
        region: card.region || "",
        employeeName: prevName,
        staffId: employeeSession.staffId,
        createdAt: serverTimestamp(),
        resolved: false,
        backupName: null,
        backupStaffId: null
      };
    });
    if (notifyPayload) {
      try {
        await addDoc(notificationsCollRef, notifyPayload);
      } catch (notifyErr) {
        // Slot is already freed at this point, so don't block that — but do
        // surface the failure instead of hiding it, since a silent failure
        // here means admin/other employees never get notified.
        console.error("Failed to file emergency notification:", notifyErr);
        await showAlert(
          "You've been marked unavailable and your slot is open again, BUT the alert to the admin/other employees was not sent.\n\n" +
          "Error: " + (notifyErr && notifyErr.message ? notifyErr.message : notifyErr) +
          "\n\nThe \"emergencyNotifications\" collection likely needs to be added to the Firestore Security Rules. Please message the admin right away."
        );
      }
    }
  } catch (err) {
    await showAlert(err.message || "Failed to save. Please try again.");
    btn.disabled = false;
    btn.textContent = originalLabel;
  }
  // On success the onSnapshot listener re-renders with the live result —
  // no local re-render needed here.
}

// Lets an employee back out of a slot she signed up for herself. Admin-
// assigned slots (no filledByStaffId, or a different employee's id) can't
// be removed this way — only the admin dashboard can change those.
async function unclaimSlot(cardId, staffIdx, btn) {
  const originalLabel = btn.textContent;
  btn.disabled = true;
  btn.textContent = "Removing…";
  try {
    await runTransaction(db, async (tx) => {
      const snap = await tx.get(scheduleDocRef);
      const data = snap.exists() ? snap.data() : { cards: [] };
      const remoteCards = Array.isArray(data.cards) ? data.cards : [];
      const cIdx = remoteCards.findIndex(c => c.id === cardId);
      if (cIdx === -1) throw new Error("Site not found — try refreshing.");
      const staffArr = (remoteCards[cIdx].staff || []).slice();
      const slot = staffArr[staffIdx];
      if (!slot) throw new Error("Role slot not found — try refreshing.");
      if (!employeeSession || slot.filledByStaffId !== employeeSession.staffId) {
        throw new Error("This is not your slot.");
      }
      staffArr[staffIdx] = { ...slot, name: "", filledByStaffId: null };
      remoteCards[cIdx] = { ...remoteCards[cIdx], staff: staffArr };
      tx.set(scheduleDocRef, { cards: remoteCards, sentAt: serverTimestamp(), sentBy: data.sentBy || "admin" });
    });
  } catch (err) {
    await showAlert(err.message || "Failed to save. Please try again.");
    btn.disabled = false;
    btn.textContent = originalLabel;
  }
}

async function sendAllToEmployees(btn) {
  const originalLabel = btn.textContent;
  btn.disabled = true;
  btn.textContent = "Sending…";
  try {
    const snap = await getDoc(scheduleDocRef);
    const remoteCards = (snap.exists() && Array.isArray(snap.data().cards)) ? snap.data().cards : [];
    const merged = mergeRemoteClaims(cards, remoteCards);
    await setDoc(scheduleDocRef, {
      cards: stripForRemote(merged),
      sentAt: serverTimestamp(),
      sentBy: "admin"
    });
    await showAlert("Schedule sent to employees. South will only see South, North will only see North.");
  } catch (err) {
    await showAlert("Saved to your browser, but not sent online: " + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = originalLabel;
  }
}

// Pushes only one date bracket's cards to the remote doc, leaving whatever
// the remote already has for every other date completely untouched — so an
// edit to one event doesn't clobber another admin's edits on a different
// date.
async function updateDateOnRemote(dateKey, dateLabelForMsg, btn) {
  const originalLabel = btn.textContent;
  btn.disabled = true;
  btn.textContent = "Updating…";
  try {
    const snap = await getDoc(scheduleDocRef);
    const remoteCards = (snap.exists() && Array.isArray(snap.data().cards)) ? snap.data().cards : [];
    const kept = remoteCards.filter(c => (c.date || "") !== (dateKey || ""));
    const thisDateLocal = cards.filter(c => (c.date || "") === (dateKey || ""));
    const mergedThisDate = mergeRemoteClaims(thisDateLocal, remoteCards);
    const merged = [...kept, ...stripForRemote(mergedThisDate)];
    await setDoc(scheduleDocRef, {
      cards: merged,
      sentAt: serverTimestamp(),
      sentBy: "admin"
    });
    await showAlert(`"${dateLabelForMsg}" updated for employees. Other event dates were left as they were.`);
  } catch (err) {
    await showAlert("Failed to update online: " + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = originalLabel;
  }
}

// Deletion needs to sync out right away too — otherwise employees keep
// seeing a bracket/site the admin already removed until the next
// Send/Update. These push straight to Firestore, no button needed.
async function deleteDateFromRemote(dateKey) {
  try {
    const snap = await getDoc(scheduleDocRef);
    const remoteCards = (snap.exists() && Array.isArray(snap.data().cards)) ? snap.data().cards : [];
    const kept = remoteCards.filter(c => (c.date || "") !== (dateKey || ""));
    if (kept.length === remoteCards.length) return; // wasn't live yet, nothing to remove
    await setDoc(scheduleDocRef, {
      cards: kept,
      sentAt: serverTimestamp(),
      sentBy: "admin"
    });
  } catch (err) {
    await showAlert("Deleted in your browser, but failed to sync online: " + err.message);
  }
}

async function deleteSiteFromRemote(cardId) {
  try {
    const snap = await getDoc(scheduleDocRef);
    const remoteCards = (snap.exists() && Array.isArray(snap.data().cards)) ? snap.data().cards : [];
    const kept = remoteCards.filter(c => c.id !== cardId);
    if (kept.length === remoteCards.length) return; // wasn't live yet, nothing to remove
    await setDoc(scheduleDocRef, {
      cards: kept,
      sentAt: serverTimestamp(),
      sentBy: "admin"
    });
  } catch (err) {
    await showAlert("Deleted in your browser, but failed to sync online: " + err.message);
  }
}

// New site/date-event cards need to sync out immediately too, same as the
// deletes above — otherwise another admin device (or an employee) won't
// see a newly added site until someone remembers to click Update/Send.
// This only appends the one new card; it never touches anything else
// already on the remote doc, so it can't clobber concurrent edits.
async function pushNewCardToRemote(card) {
  try {
    const snap = await getDoc(scheduleDocRef);
    const data = snap.exists() ? snap.data() : { cards: [] };
    const remoteCards = Array.isArray(data.cards) ? data.cards : [];
    if (remoteCards.some(c => c.id === card.id)) return; // already synced somehow
    const merged = [...remoteCards, ...stripForRemote([card])];
    await setDoc(scheduleDocRef, {
      cards: merged,
      sentAt: serverTimestamp(),
      sentBy: data.sentBy || "admin"
    });
  } catch (err) {
    await showAlert("Saved in your browser, but failed to sync online: " + err.message);
  }
}

// ---------- Emergency notifications (admin bell + employee banner) ----------
// Local cache of ALL emergency notifications (both open and resolved), kept
// in sync by the onSnapshot listener below. Used both to render the
// bell/banner and to find & update the right doc(s) once a slot is refilled.
let latestNotifications = [];

// Instead of deleting the notification once someone signs up to cover the
// slot, mark it resolved and record who backed it up — so the bell panel
// turns it green ("<name> — FOR BACKUP") instead of just vanishing. Admin
// can still permanently dismiss it afterwards via the "Clear" button.
async function resolveNotificationsFor(cardId, staffIdx) {
  const matches = latestNotifications.filter(n => !n.resolved && n.cardId === cardId && n.staffIdx === staffIdx);
  for (const n of matches) {
    try {
      await updateDoc(doc(db, "emergencyNotifications", n.id), {
        resolved: true,
        backupName: (employeeSession && employeeSession.name) ? employeeSession.name.toUpperCase() : "",
        backupStaffId: employeeSession ? employeeSession.staffId : null,
        resolvedAt: serverTimestamp()
      });
    } catch (e) { /* best-effort */ }
  }
}

// Manual "Resolved"/"Clear" button in the panel — permanently removes the
// notification doc, whether it's still red (admin handling it outside the
// system) or already green (dismissing it after seeing the backup).
async function resolveNotification(notifId) {
  try {
    await deleteDoc(doc(db, "emergencyNotifications", notifId));
  } catch (err) {
    await showAlert("Failed to clear the notification: " + err.message);
  }
}

function regionLabelFromValue(region) {
  if (region === "south") return "South Caloocan";
  if (region === "north") return "North Caloocan";
  return region || "—";
}

// Shared by admin and employees: bell + badge count + dropdown list of
// emergency vacancies. Unresolved items render red with a "Resolved"
// button; once someone backs up the slot the item turns green and shows
// who covered it, with a "Clear" button to dismiss it for good. Admins get
// every item; employees get only the pre-filtered subset for their own
// branch + team (see getRelevantNotifications below). Badge count only
// tallies still-open (unresolved) items — resolved ones stay visible in
// the panel but don't need action.
function renderNotifPanel(items) {
  const badge = document.getElementById("notifBadge");
  const wrap = document.getElementById("notifWrap");
  const panel = document.getElementById("notifPanel");
  if (!badge || !wrap || !panel) return;
  wrap.style.display = "inline-block";
  const openCount = items.filter(n => !n.resolved).length;
  badge.textContent = String(openCount);
  badge.classList.toggle("show", openCount > 0);
  if (!items.length) {
    panel.innerHTML = `<div class="notif-panel-empty">No emergency notifications.</div>`;
    return;
  }
  panel.innerHTML = items.map(n => {
    const isResolved = !!n.resolved;
    const title = isResolved
      ? `✅ ${escapeHtml(n.backupName || "A teammate")} — FOR BACKUP`
      : `🚨 ${escapeHtml(n.employeeName || "Employee")} — UNAVAILABLE`;
    const statusLine = isResolved
      ? `Backing up for ${escapeHtml(n.employeeName || "the previous employee")}.`
      : `Needs a replacement.`;
    const btnClass = isResolved ? "notif-clear-btn" : "notif-resolve-btn";
    const btnLabel = isResolved ? "Clear" : "Resolved";
    return `
    <div class="notif-item ${isResolved ? "is-resolved" : ""}">
      <div class="notif-item-title">${title}</div>
      <div class="notif-item-body">
        ${escapeHtml(n.role || "")} at ${escapeHtml(n.location || "site")}${n.date ? " — " + escapeHtml(formatDateDisplay(n.date)) : ""}${n.time ? ", " + escapeHtml(n.time) : ""}<br>
        Region: ${escapeHtml(regionLabelFromValue(n.region))}. ${statusLine}
      </div>
      <button type="button" class="${btnClass}" data-id="${escapeAttr(n.id)}">${btnLabel}</button>
    </div>`;
  }).join("");
  panel.querySelectorAll(".notif-resolve-btn, .notif-clear-btn").forEach(btn => {
    btn.addEventListener("click", () => resolveNotification(btn.dataset.id));
  });
}

// Admin-only: banner above the schedule listing open emergency vacancies
// across all branches/teams. Employees no longer see this banner — they
// still get the bell — so this bails out immediately on the employee view.
function renderUrgentBanner(items) {
  const banner = document.getElementById("urgentBanner");
  if (!banner) return;
  if (employeeSession) { banner.style.display = "none"; banner.innerHTML = ""; return; }
  const openItems = items.filter(n => !n.resolved);
  if (!openItems.length) { banner.style.display = "none"; banner.innerHTML = ""; return; }
  banner.style.display = "block";
  banner.innerHTML = `<p class="urgent-banner-title">🚨 Emergency — needs replacement now</p>` +
    openItems.map(n => `
      <div class="urgent-banner-item">
        <strong>${escapeHtml(n.role || "")}</strong> at ${escapeHtml(n.location || "site")}${n.date ? " — " + escapeHtml(formatDateDisplay(n.date)) : ""}${n.time ? ", " + escapeHtml(n.time) : ""}.
        ${escapeHtml(n.employeeName || "An employee")} became unavailable. Sign up below if you can cover.
      </div>
    `).join("");
}

// Admins see every notification (open or resolved). Employees only see the
// ones that match their own branch + team, same as the old employee-only
// banner used to filter — now shared by both the bell panel and the (now
// admin-only) banner. An employee never sees the notification generated by
// their own "Unavailable" click; only other employees (and the admin) are
// notified.
function getRelevantNotifications(items) {
  if (!employeeSession) return items;
  const myTeam = splitDepartmentClient(employeeSession.department).team;
  return items.filter(n =>
    n.staffId !== employeeSession.staffId &&
    n.region === employeeSession.branch &&
    roleToTeam(n.role).toUpperCase() === String(myTeam).toUpperCase()
  );
}

onSnapshot(
  query(notificationsCollRef, orderBy("createdAt", "desc")),
  snap => {
    const all = [];
    snap.forEach(d => all.push({ id: d.id, ...d.data() }));
    // Keep resolved items too now (they're no longer deleted on cover) so
    // the panel can still show the green "FOR BACKUP" state.
    latestNotifications = all;
    const relevant = getRelevantNotifications(latestNotifications);
    renderNotifPanel(relevant);
    renderUrgentBanner(relevant);
  },
  err => {
    // Most likely cause: Firestore Security Rules don't yet allow read
    // access to the "emergencyNotifications" collection (it's new — the
    // rest of the app's rules won't automatically cover it). Surface this
    // loudly instead of leaving the bell/banner silently empty forever.
    // The bell + panel are shared elements, so both admin and employees
    // will see this if it happens.
    console.error("emergencyNotifications listener failed:", err);
    const wrap = document.getElementById("notifWrap");
    const panel = document.getElementById("notifPanel");
    if (wrap) wrap.style.display = "inline-block";
    if (panel) {
      panel.classList.add("open");
      panel.innerHTML = `<div class="notif-panel-empty" style="color:var(--danger);font-style:normal;">
        ⚠ Failed to load notifications.<br><br>
        <span style="font-size:11px;">${escapeHtml(err.message || String(err))}</span><br><br>
        The "emergencyNotifications" collection needs to be allowed in the Firestore Security Rules.
      </div>`;
    }
  }
);

const notifBellBtn = document.getElementById("notifBell");
if (notifBellBtn) {
  notifBellBtn.addEventListener("click", () => {
    document.getElementById("notifPanel").classList.toggle("open");
  });
  document.addEventListener("click", e => {
    const wrap = document.getElementById("notifWrap");
    if (wrap && !wrap.contains(e.target)) {
      const panel = document.getElementById("notifPanel");
      if (panel) panel.classList.remove("open");
    }
  });
}

document.getElementById("saveBtn").addEventListener("click", async () => {
  saveCards();
  await sendAllToEmployees(document.getElementById("saveBtn"));
});

document.getElementById("updateAllBtn").addEventListener("click", async () => {
  saveCards();
  await sendAllToEmployees(document.getElementById("updateAllBtn"));
});

document.getElementById("printBtn").addEventListener("click", () => window.print());

document.getElementById("resetBtn").addEventListener("click", async () => {
  if (await showConfirm("Reset all data? This cannot be undone.")) {
    cards = Array.from({ length: 6 }, blankCard);
    saveCards();
    render();
  }
});

// Needed in both modes now: this is what notices when the admin deletes an
// employee's account and clears any slot that employee had signed up for
// (see clearSlotsForDeletedEmployees above). Previously this only ran for
// employees, so a deleted account's slot only got cleared if some employee
// happened to have the page open — the admin's own dashboard never noticed.
startEmployeesListener();

if (employeeSession) {
  // Employee mode: hide the admin editing toolbar/filters and show a
  // live, read-only view scoped to their own branch.
  document.querySelector(".toolbar").style.display = "none";
  document.getElementById("regionFilter").style.display = "none";
  onSnapshot(scheduleDocRef, snap => {
    const data = snap.exists() ? snap.data() : { cards: [] };
    const allCards = data.cards || [];
    renderEmployeeSchedule(allCards, employeeSession.branch);
    renderLeaderboard(allCards);
  });
} else {
  // Admin/manager mode: full editable dashboard, as before.
  renderDatalists();
  render();

  // Tracks which card ids we've actually seen confirmed on the server, so
  // the "another device deleted this" check below never mistakes a
  // brand-new card THIS device just added (and hasn't Sent/Updated yet)
  // for something that needs to be swept away. Stays null until the first
  // snapshot arrives — nothing is ever removed on that very first check.
  let lastKnownRemoteCardIds = null;

  // Live sign-up feed: merges employee self-signups into the local view
  // in real time, the same way employees see the roster update live.
  // Only slots the admin hasn't touched this session are updated, and if
  // the admin is actively typing somewhere, the visual refresh is held
  // back (data still merges underneath) so it doesn't yank their cursor
  // away mid-edit — it catches up as soon as they click elsewhere or the
  // next signup comes in.
  //
  // This also picks up whole new site/date-event cards (or removals) that
  // another admin device Sent/Updated — previously this only diffed staff
  // fields on cards that already matched an existing local id, so a new
  // site added on Device A and pushed to Firestore would never show up on
  // Device B's dashboard at all, live or even after refresh, since Device
  // B's local `cards` only ever grows from Device B's own edits.
  onSnapshot(scheduleDocRef, snap => {
    const data = snap.exists() ? snap.data() : { cards: [] };
    const remoteCards = Array.isArray(data.cards) ? data.cards : [];
    const remoteById = new Map(remoteCards.map(c => [c.id, c]));
    const activeEl = document.activeElement;
    const isNameField = activeEl && activeEl.classList && activeEl.classList.contains("nameInput");
    const activeCardId = isNameField ? activeEl.dataset.cardId : null;
    const activeSIdx = isNameField ? parseInt(activeEl.dataset.sidx, 10) : null;
    let changed = false;
    let structuralChange = false;
    const affectedDates = new Set();
    cards.forEach(card => {
      const remoteCard = remoteById.get(card.id);
      if (!remoteCard) return;
      (card.staff || []).forEach((slot, sIdx) => {
        // Only skip the exact field being typed into right now — a field
        // that was edited earlier and later cleared should still receive
        // live signups going forward, not stay locked out forever.
        if (card.id === activeCardId && sIdx === activeSIdx) return;
        const remoteSlot = (remoteCard.staff || [])[sIdx];
        if (!remoteSlot) return;
        const remoteName = (remoteSlot.name || "").trim();
        const localName = (slot.name || "").trim();
        if (remoteName !== localName || (remoteSlot.filledByStaffId || null) !== (slot.filledByStaffId || null)) {
          slot.name = remoteSlot.name || "";
          slot.filledByStaffId = remoteSlot.filledByStaffId || null;
          changed = true;
          affectedDates.add(card.date || "");
        }
      });
    });
    // Pick up brand-new cards another device already Sent/Updated.
    remoteCards.forEach(remoteCard => {
      if (cards.some(c => c.id === remoteCard.id)) return;
      cards.push({ ...remoteCard, staff: (remoteCard.staff || []).map(s => ({ ...s })) });
      structuralChange = true;
      affectedDates.add(remoteCard.date || "");
    });
    // Drop cards another device deleted — but only ones we'd previously
    // confirmed were live, never a just-added local card still waiting on
    // its first Send/Update.
    if (lastKnownRemoteCardIds) {
      const removeIds = new Set(
        cards.filter(c => lastKnownRemoteCardIds.has(c.id) && !remoteById.has(c.id)).map(c => c.id)
      );
      if (removeIds.size) {
        cards.forEach(c => { if (removeIds.has(c.id)) affectedDates.add(c.date || ""); });
        cards = cards.filter(c => !removeIds.has(c.id));
        structuralChange = true;
      }
    }
    lastKnownRemoteCardIds = new Set(remoteCards.map(c => c.id));
    if (structuralChange) {
      // New/removed cards change the DOM structure itself (new site cards,
      // new date tabs) — always do a full re-render for these, even if the
      // admin is mid-edit elsewhere, rather than leave the dashboard
      // showing a stale set of sites.
      saveCards();
      render();
      return;
    }
    if (!changed) return;
    saveCards();
    const isTypingInCard = activeEl && activeEl.closest && activeEl.closest(".site-card");
    if (isTypingInCard) {
      updateStats();
      affectedDates.forEach(d => updateTabBadge(d));
    } else {
      render();
    }
  });
}
</script>
