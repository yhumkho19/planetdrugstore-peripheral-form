<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page Not Found — Planet Drugstore</title>
    <link rel="icon" type="image/x-icon" href="logo-transparent.png">
    <style media="screen">
      :root{
        --maroon:#6E1620;
        --maroon-dark:#3D0A10;
        --red:#d61f2c;
        --red-dark:#a5151f;
        --paper:#FAF6F5;
        --line:#E6D5D6;
        --ink:#2A1416;
        --muted:#7A5B5D;
      }
      *{box-sizing:border-box;}
      body{
        background:var(--paper);
        color:var(--ink);
        font-family:'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
        margin:0;
        padding:0;
        min-height:100vh;
      }
      #message{
        background:#fff;
        max-width:380px;
        margin:90px auto 16px;
        padding:36px 28px 28px;
        border-radius:12px;
        text-align:center;
        border:1px solid var(--line);
        box-shadow:0 4px 18px rgba(110,22,32,0.10);
      }
      #message .logo{
        width:64px;height:64px;object-fit:contain;margin:0 auto 18px;display:block;
      }
      #message .brand{
        font-size:13px;font-weight:800;letter-spacing:0.6px;text-transform:uppercase;
        color:var(--maroon);margin:0 0 22px;
      }
      #message h2{
        display:inline-block;color:#fff;background:var(--red);font-weight:800;
        font-size:14px;letter-spacing:0.5px;margin:0 0 14px;padding:4px 12px;border-radius:20px;
      }
      #message h1{
        font-size:21px;font-weight:800;color:var(--maroon-dark);margin:0 0 14px;letter-spacing:0.2px;
      }
      #message p{
        line-height:150%;margin:0 0 26px;font-size:14px;color:var(--muted);
      }
      #message a{
        display:block;text-align:center;background:var(--red);text-transform:uppercase;
        text-decoration:none;color:#fff;padding:14px;border-radius:8px;font-weight:700;
        font-size:13.5px;letter-spacing:0.4px;transition:background .15s;
      }
      #message a:hover{background:var(--red-dark);}
      @media (max-width:600px){
        body, #message{margin-top:0;box-shadow:none;}
        body{border-top:6px solid var(--red);}
        #message{border-radius:0;border:none;box-shadow:none;margin-top:0;padding-top:44px;}
      }
    </style>
  </head>
  <body>
    <div id="message">
      <img class="logo" src="logo-transparent.png" alt="Planet Drugstore">
      <p class="brand">Planet Drugstore</p>
      <h3>Why am i seeing this?</h3>
<p>The specified file was not found on this website. Please check the URL for mistakes and try again.</p>
      <a href="/">← Back to Home</a>
    </div>
  </body>
</html>
