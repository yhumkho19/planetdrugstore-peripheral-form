<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Updating — Planet Drugstore</title>
  <style>
    :root { color-scheme: light; --maroon:#6E1620; --red:#D61F2C; --paper:#FBF5F4; --muted:#8C6B6E; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--paper);
      color: var(--maroon);
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      text-align: center;
    }
    .card {
      width: min(420px, 100%);
      padding: 38px 30px;
      background: #fff;
      border: 1px solid #E8D7D8;
      border-radius: 16px;
      box-shadow: 0 18px 44px rgba(61,10,16,.12);
    }
    .logo { width: 64px; height: 64px; object-fit: cover; border-radius: 14px; }
    h1 { margin: 22px 0 10px; font-size: 24px; }
    p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.6; }
    .spinner {
      width: 28px; height: 28px; margin: 24px auto 0;
      border: 3px solid #F3C2C6; border-top-color: var(--red);
      border-radius: 50%; animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="logo.png" alt="Planet Drugstore">
    <h1>May bagong update</h1>
    <p>Ina-update ang system. Sandali lang, ibabalik ka namin kapag ready na ang bagong version.</p>
    <div class="spinner" aria-label="Updating"></div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAD6rm7RPOObiSw3Pz0wsQJZNaxrO0TRQ",
      authDomain: "planetdrugstore-peripher-d24c0.firebaseapp.com",
      projectId: "planetdrugstore-peripher-d24c0",
      storageBucket: "planetdrugstore-peripher-d24c0.firebasestorage.app",
      messagingSenderId: "115454971026",
      appId: "1:115454971026:web:0357eaa6bfb171e86cea4b"
    };

    const params = new URLSearchParams(location.search);
    const next = params.get("next") || "landing-page.html";
    const targetVersion = params.get("version") || "";
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    localStorage.removeItem("pdEmployeeSession");
    sessionStorage.removeItem("pdEmployeeSession");
    signOut(auth).catch(err => console.error("Automatic sign-out failed:", err));

    async function waitForUpdate() {
      try {
        const res = await fetch(next + (next.includes("?") ? "&" : "?") + "v=" + Date.now(), { cache: "no-store" });
        if (!res.ok) throw new Error("Update check returned HTTP " + res.status);
        const text = await res.text();
        const match = text.match(/const APP_VERSION = "([^"]+)"/);
        if (match && (!targetVersion || match[1] === targetVersion)) {
          window.location.replace(next);
          return;
        }
      } catch (err) {
        console.warn("Waiting for deployed update:", err);
      }
      window.setTimeout(waitForUpdate, 3000);
    }

    waitForUpdate();
  </script>
</body>
</html>
