<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock Request — Planet Drugstore</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--maroon:#6E1620;--dark:#3D0A10;--red:#d61f2c;--red-dark:#a5151f;--paper:#FBF5F4;--line:#E8D7D8;--ink:#2A1416;--muted:#8C6B6E;--good:#1f8a4c;--amber:#9A4B08;--amber-bg:#FFF6E5;--amber-line:#F0D9A8}
*{box-sizing:border-box}
body{margin:0;font-family:'Figtree','Segoe UI',Roboto,Arial,sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh}
.appbar{background:var(--maroon);color:#fff;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:3px solid var(--red)}
.appbar-actions{display:flex;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:14px;letter-spacing:.4px}
.brand img{width:38px;height:38px;border-radius:9px;object-fit:cover}
.brand span{color:#ffb3b8}
.out{color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:8px 15px;font-size:13px;font-weight:600}
.out-btn{background:transparent;font-family:inherit;cursor:pointer}
.out:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.65)}
:is(a,button,input,textarea):focus-visible{outline:2px solid var(--red);outline-offset:2px}
.wrap{max-width:1280px;margin:22px auto;padding:0 20px 40px}
.request-shell{display:grid;grid-template-columns:minmax(0,1fr);overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 36px rgba(61,10,16,.08)}
.request-heading{grid-column:1;position:relative;display:flex;align-items:center;gap:17px;min-height:108px;padding:18px 28px;border-bottom:3px solid var(--red);background:var(--maroon)}
.request-heading::after{content:"";position:absolute;right:24px;top:0;width:150px;height:100%;opacity:.28;background:linear-gradient(135deg,transparent 48%,rgba(255,179,184,.28) 48%,rgba(255,179,184,.28) 70%,transparent 70%);pointer-events:none}
.heading-mark{display:flex;align-items:center;justify-content:center;flex:none;width:54px;height:54px;border:1px solid rgba(255,255,255,.5);border-radius:50%;background:#fff;color:var(--maroon);font-size:19px;font-weight:800}
.request-heading h1{margin:0;color:#fff;font-size:27px;font-weight:800;line-height:1.15}
.heading-kicker{margin:0 0 5px;color:#ffb3b8;font-size:11px;font-weight:700;text-transform:uppercase}
.heading-subtitle{margin:5px 0 0;color:rgba(255,255,255,.78);font-size:13px}
.body{display:grid;grid-template-columns:minmax(0,1fr)}
.day-rail{grid-column:1;padding:20px 22px 8px;background:#fff}
.rail-label{margin:0 0 11px;color:var(--maroon);font-size:13px;font-weight:800;text-transform:uppercase}
.days{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.days button{position:relative;display:flex;min-width:0;min-height:78px;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:11px 8px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--maroon);font-family:inherit;font-weight:700;font-size:13px;text-align:center;cursor:pointer;text-transform:lowercase;transition:border-color .15s,background .15s,color .15s}
.days button svg{width:21px;height:21px;fill:none;stroke:#9d686e;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.days button:hover{border-color:#c99398;background:#fffafa}
.days button.on{border:2px solid var(--maroon);background:var(--maroon);color:#fff}
.days button.on svg{stroke:#fff}
.days button.on::before{content:"✓";position:absolute;top:6px;right:7px;display:flex;width:18px;height:18px;align-items:center;justify-content:center;border-radius:50%;background:#ff637b;color:#fff;font-size:11px}
.days button::first-letter{text-transform:uppercase}
.days button.off{opacity:.55}
.days button.mine::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--red);position:absolute;bottom:7px;left:9px}
.days button.on.mine::after{background:#fff}
.request-main{grid-column:1;min-width:0;padding:10px 22px 22px}
.date{font-size:21px;font-weight:800;margin:3px 0 12px;color:var(--maroon)}
.who{display:flex;align-items:center;gap:13px;margin-bottom:14px;padding:12px 14px;border:1px solid var(--line);border-radius:9px;background:var(--paper)}
.av{flex:none;width:48px;height:48px;border-radius:50%;background:var(--maroon);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:19px}
.wn{font-weight:800;font-size:15px;line-height:1.2}
.ws{font-size:13px;color:var(--muted);margin-top:3px}
form.locked .hint,form.locked #saveBtn,form.locked #delBtn{display:none!important}
form.locked #fSr{opacity:.75}
form.locked.noreq .field-sr{display:none}
.lockbar{position:relative;display:flex;align-items:center;gap:10px;min-height:46px;padding:10px 13px;border:1px solid #bfe6cb;border-radius:8px;font-size:13px;font-weight:600;margin-bottom:14px;background:#eaf7ef;color:#1f8a4c}
.lockbar.wait{background:var(--amber-bg);border-color:var(--amber-line);color:var(--amber)}
.lockbar.off{background:#f2eeee;border-color:#ddd2d3;color:#6b5a5c}
.lock-state{flex:none;width:9px;height:9px;border-radius:50%;background:currentColor}
.lock-clock{width:21px;height:21px;margin-left:auto;fill:none;stroke:var(--red);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lockbar.closed{background:#fdecec;border-color:#f3c2c6;color:var(--red-dark)}
.contact-admin-link{display:inline-flex;align-items:center;margin:-4px 0 14px;padding:8px 11px;border:1px solid var(--maroon);border-radius:7px;color:var(--maroon);font-size:13px;font-weight:700;text-decoration:none}
.contact-admin-link:hover{background:#fff4f3}
.contact-admin-link[hidden]{display:none}
.field{margin-bottom:15px;padding:0;border:0;border-radius:0;background:transparent}
label{display:block;font-size:14px;font-weight:700;color:var(--maroon);margin-bottom:7px}
input,textarea,select{width:100%;padding:12px 14px;font-size:16px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font-family:inherit}
input:focus,textarea:focus{outline:2px solid #bdcceb;outline-offset:0;background:#fff}
input[readonly]{background:#f3ecea;color:#5a4547}
.request-type-field{margin-bottom:15px}
#fSr{font-size:20px;font-weight:700;padding:12px 14px}
.sr-input-row{display:flex;align-items:center;gap:8px}
.sr-field-control{position:relative;flex:1;min-width:0}
.sr-input-row #fSr{width:100%;min-width:0;padding-right:112px}
.request-status-badge{position:absolute;top:50%;right:12px;transform:translateY(-50%);padding:5px 9px;border:1px solid #f0d7d8;border-radius:999px;background:#f8eceb;color:var(--maroon);font-size:11px;font-weight:700;line-height:1;pointer-events:none}
.request-status-badge.completed{border-color:#bfe6cb;background:#e6f5ea;color:#1f7040}
.request-status-badge.no-status{border-color:#d8dde5;background:#f1f3f6;color:#5c6675}
.request-status-badge[hidden]{display:none}
.edit-sr-btn{display:inline-flex;flex:none;width:46px;height:46px;align-items:center;justify-content:center;padding:0;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--maroon);cursor:pointer}
.edit-sr-btn:hover{border-color:var(--maroon);background:#fffafa}
.edit-sr-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.edit-sr-btn .icon-close{display:none}
.edit-sr-btn.is-editing .icon-pencil{display:none}
.edit-sr-btn.is-editing .icon-close{display:block}
.edit-sr-btn:disabled{opacity:.45;cursor:default}
.hint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.45}
.btn{width:100%;border:none;border-radius:8px;padding:13px 18px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;background:var(--red);color:#fff}
.btn:hover{background:var(--red-dark)}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:#fff;color:var(--red-dark);border:1px solid #f3c2c6;margin-top:8px}
.btn.ghost:hover{background:#fdecec}
.modal{position:fixed;inset:0;background:rgba(42,20,22,.58);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal.show{display:flex}
.mbox{background:#fff;border:1px solid var(--line);border-radius:12px;max-width:440px;width:100%;padding:22px;color:var(--ink);box-shadow:0 20px 50px rgba(0,0,0,.25)}
.mbox h2{margin:0 0 6px;font-size:19px;color:var(--maroon)}
.mbox p{margin:0 0 14px;font-size:14px;color:var(--muted);line-height:1.5}
.chgline{font-size:18px;font-weight:800;background:var(--amber-bg);border:1px solid var(--amber-line);border-radius:8px;padding:10px 12px;margin-bottom:14px;word-break:break-word;color:var(--ink)}
textarea{min-height:90px;resize:vertical}
.mact{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.mact .btn{width:auto;padding:12px 18px;font-size:15px}
.mact .btn.ghost{margin-top:0}
.merr{color:var(--red-dark);font-size:13px;margin-top:6px;min-height:16px}
.msg{margin-top:14px;font-size:14px;font-weight:600;padding:11px 14px;border-radius:10px;display:none}
.msg.err{background:#fdecec;border:1px solid #f3c2c6;color:var(--red-dark)}
.msg.ok{background:#e6f5ea;border:1px solid #bfe6cb;color:var(--good)}
@media(max-width:700px){
  .appbar{padding:10px 13px;flex-wrap:wrap}
  .brand{font-size:12px}
  .brand img{width:34px;height:34px}
  .out{padding:7px 10px;font-size:12px}
  .appbar-actions{width:100%;justify-content:flex-end;flex-wrap:wrap;gap:6px}
  #pushToggleButton{max-width:100%;white-space:normal}
  .wrap{margin:14px auto;padding:0 10px 26px}
  .request-shell{grid-template-columns:minmax(0,1fr)}
  .request-heading{min-height:94px;padding:14px 16px}
  .heading-mark{width:48px;height:48px}
  .request-heading h1{font-size:23px}
  .heading-subtitle{font-size:12px}
  .request-heading::after{right:8px;width:100px}
  .day-rail{grid-column:1;padding:14px 12px 6px;border-right:0;border-bottom:0}
  .rail-label{margin-bottom:8px}
  .days{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;overflow:visible;padding-bottom:2px}
  .days button{width:100%;min-height:72px;padding:9px 3px;font-size:11px;gap:7px}
  .days button svg{width:19px;height:19px}
  .request-main{grid-column:1;padding:10px 12px 16px}
  .date{font-size:19px}
  .who{padding:11px 12px}
  .field{padding:12px}
}
</style>
</head>
<body>
<div class="appbar">
  <div class="brand"><img src="logo.png" alt="" onerror="this.style.display='none'"><div>PLANET<span> DRUGSTORE</span></div></div>
  <div class="appbar-actions"><button class="push-toggle-button" id="pushToggleButton" type="button" aria-live="polite">Enable phone notifications</button><a class="out" href="/ed3od6ldsq">&larr; Back to Home</a></div>
</div>

<div class="wrap">
  <div class="request-shell" id="formView" style="display:none">
    <header class="request-heading">
      <span class="heading-mark" aria-hidden="true">SR</span>
      <div><p class="heading-kicker">Employee Stock Request</p><h1>Stock Request</h1><p class="heading-subtitle">Submit a medicine or supplies SR#.</p></div>
    </header>
    <div class="body">
      <aside class="day-rail" aria-label="Request day">
        <p class="rail-label">Request day</p>
        <div class="days" id="days"></div>
      </aside>
      <main class="request-main">
        <div class="date" id="dateLbl"></div>
        <div class="lockbar" id="lockbar"><span class="lock-state" aria-hidden="true"></span><span id="lockText"></span><svg class="lock-clock" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>
        <a class="contact-admin-link" id="contactAdminLink" href="#" target="_blank" rel="noopener noreferrer" hidden>Contact Stock Request Admin</a>
        <form id="reqForm">
          <div class="who"><div class="av" id="fAv"></div><div><div class="wn" id="fName"></div><div class="ws" id="fSite"></div></div></div>
          <div class="request-type-field">
            <label for="requestType">Request type</label>
            <select id="requestType" name="requestType">
              <option value="medicine">Medicine</option>
              <option value="supplies">Supplies</option>
            </select>
          </div>
          <div class="field field-sr">
            <label for="fSr">SR#</label>
            <div class="sr-input-row">
              <div class="sr-field-control">
                <input id="fSr" maxlength="100" required autocomplete="off" inputmode="numeric" placeholder="e.g. 12345">
                <span class="request-status-badge" id="requestStatus" aria-live="polite" hidden></span>
              </div>
              <button class="edit-sr-btn" id="editSrBtn" type="button" aria-label="Edit SR#" title="Edit SR#" style="display:none">
                <svg class="icon-pencil" viewBox="0 0 24 24" aria-hidden="true"><path d="m16 4 4 4L8 20l-4 1 1-4L16 4Z"/><path d="m14.5 5.5 4 4"/></svg>
                <svg class="icon-close" viewBox="0 0 24 24" aria-hidden="true"><path d="m18 6-12 12M6 6l12 12"/></svg>
              </button>
            </div>
            <div class="hint">Multiple SR#s? Separate with commas. You can edit an existing SR# until the daily cutoff.</div>
          </div>
          <button class="btn" id="saveBtn">Submit request</button>
          <button class="btn ghost" id="delBtn" type="button" style="display:none">Remove</button>
          <div class="msg" id="msg"></div>
        </form>
      </main>
    </div>
  </div>
</div>

<div class="modal" id="removeConfirmModal" role="dialog" aria-modal="true" aria-labelledby="removeConfirmTitle">
  <div class="mbox">
    <h2 id="removeConfirmTitle">Remove SR#?</h2>
    <p id="removeConfirmText"></p>
    <div class="mact">
      <button type="button" class="btn ghost" id="removeConfirmCancel">Cancel</button>
      <button type="button" class="btn" id="removeConfirmOk">Confirm removal</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirebaseConfigForHost, connectLocalFirebaseEmulators } from "../assets/js/firebase-emulators.js";
import { initializeFirestore, collection, doc, getDoc, setDoc, addDoc, updateDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp(getFirebaseConfigForHost({
  apiKey: "AIzaSyAD6rm7RPOObiSw3Pz0wsQJZNaxr0O0TRQ",
  authDomain: "planetdrugstore-peripher-d24c0.firebaseapp.com",
  projectId: "planetdrugstore-peripher-d24c0",
  storageBucket: "planetdrugstore-peripher-d24c0.firebasestorage.app",
  messagingSenderId: "115454971026",
  appId: "1:115454971026:web:0357eaa6bfb171e86cea4b"
}));
const db = initializeFirestore(app, { experimentalForceLongPolling: true, useFetchStreams: false });
connectLocalFirebaseEmulators({ db });

const STOCK_REQUEST_ADMIN_TEAMS_URL = 'https://teams.microsoft.com/l/channel/19%3Ad306729cf93a4d0bb3970490db04752e%40thread.tacv2/CALOOCAN?groupId=64a1d61d-5681-4a79-ae96-a838a1a32560&tenantId=a5906354-ebe5-419d-b024-6c7db90917b0&ngc=true';
const DAYS = ['MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY'];
let cutoffMin = 840; // Default cutoff is 2 PM; the admin sets the actual cutoff for each day.
function canRequestStock(department){
  if(/^billing\s+manila$/i.test(String(department || '').trim())) return false;
  const team = String(department || '').trim().toLowerCase().replace(/\s+(north|south|manila)$/i, '').trim();
  return ['billing', 'pharmacist', 'pharmacy assistant'].includes(team);
}
const fmtCut = () => new Date(2000,0,1,Math.floor(cutoffMin/60),cutoffMin%60).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
function manilaDateAndMinutes(now = new Date()){
  const parts = Object.fromEntries(new Intl.DateTimeFormat('en-US', {
    timeZone:'Asia/Manila', year:'numeric', month:'2-digit', day:'2-digit',
    hour:'2-digit', minute:'2-digit', hourCycle:'h23'
  }).formatToParts(now).map(part=>[part.type, part.value]));
  return {
    date:parts.year + '-' + parts.month + '-' + parts.day,
    minutes:Number(parts.hour) * 60 + Number(parts.minute)
  };
}
function dateForDay(i){
  const now = manilaDateAndMinutes();
  const [year, month, day] = now.date.split('-').map(Number);
  const target = new Date(Date.UTC(year, month - 1, day));
  target.setUTCDate(target.getUTCDate() + ((i + 1 - target.getUTCDay() + 7) % 7));
  return new Date(target.getUTCFullYear(), target.getUTCMonth(), target.getUTCDate(), 12);
}
const iso = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const dayAllowed = i => !emp || !Array.isArray(emp.requestDays) || emp.requestDays.includes(DAYS[i]);
const blocked = d => isLocked(d) || !!existing?.adminCompleted || adminRemoved || !dayAllowed(current) || (dayRecordExists && !dayActive) || (!existing && !dayActive);
const isLocked = d => {
  const now = manilaDateAndMinutes();
  const date = iso(d);
  return date < now.date || (date === now.date && now.minutes >= cutoffMin);
};
const $ = id => document.getElementById(id);

function readSession(){
  try{
    const raw = localStorage.getItem('pdEmployeeSession') || sessionStorage.getItem('pdEmployeeSession');
    const s = raw ? JSON.parse(raw) : null;
    if(s && s.staffId){
      localStorage.removeItem('pdStockRequestSessionHandoff');
      return s;
    }
    const handoffRaw = localStorage.getItem('pdStockRequestSessionHandoff');
    localStorage.removeItem('pdStockRequestSessionHandoff');
    const handoff = handoffRaw ? JSON.parse(handoffRaw) : null;
    return handoff && handoff.expiresAt > Date.now() && handoff.session && handoff.session.staffId
      ? handoff.session
      : null;
  }catch(e){ return null; }
}
function kickToLogin(deleted){
  try{
    localStorage.removeItem('pdEmployeeSession');
    sessionStorage.removeItem('pdEmployeeSession');
    localStorage.removeItem('pdStockRequestSessionHandoff');
  }catch(e){}
  location.replace('/fu3hriaj0m' + (deleted ? '?deleted=1' : ''));
}

let emp = null, current = -1, unsub = null, unsubDay = null, selectedDateKey = '', dayActive = false, dayRecordExists = false, dayClosedEarly = false, adminRemoved = false, existing = null, editingRequest = false;
let requestType = 'medicine';
let lastAdminRemovalNotice = '';
const esc = s => String(s ?? '').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const SR_NUMBER_PATTERN = /^\d+(?:\s*,\s*\d+)*$/;
const srInput = $('fSr');
function validSrNumbers(value){ return SR_NUMBER_PATTERN.test(String(value || '').trim()); }
function buildSrSearchTerms(sr, history=[], previousTerms=[]){
  const terms = new Set();
  const add = value=>String(value || '').split(',').map(term=>term.trim()).filter(Boolean).forEach(term=>terms.add(term));
  previousTerms.forEach(add);
  history.forEach(change=>{ add(change.oldSr); add(change.newSr); });
  add(sr);
  return [...terms].slice(-30);
}
function showSrNumberError(){
  showMsg('SR# must contain numbers only. Separate multiple SR#s with commas.', false);
}

srInput.addEventListener('beforeinput', event=>{
  if(event.inputType.startsWith('delete') || !event.data) return;
  if(/[^\d,\s]/.test(event.data)){
    event.preventDefault();
    showSrNumberError();
  }
});
srInput.addEventListener('paste', event=>{
  const pasted = event.clipboardData && event.clipboardData.getData('text');
  if(pasted && /[^\d,\s]/.test(pasted)){
    event.preventDefault();
    showSrNumberError();
  }
});
srInput.addEventListener('input', ()=>{
  if(/[^\d,\s]/.test(srInput.value)){
    srInput.value = srInput.value.replace(/[^\d,\s]/g, '');
    showSrNumberError();
  }
});

let msgTimer = null;
function showMsg(text, ok){
  const m = $('msg'); m.textContent = text; m.className = 'msg ' + (ok ? 'ok' : 'err'); m.style.display = 'block';
  clearTimeout(msgTimer); msgTimer = setTimeout(()=>{ m.style.display = 'none'; }, 5000);
}

async function loadEmployee(id){
  const snap = await getDoc(doc(db,'employees',id));
  return snap.exists() ? snap.data() : null;
}

function requestStatusLabel(request, closedEarly=false){
  if(request.adminCompleted === true) return 'Completed';
  if(request.status === 'removed') return 'Removed by ' + (request.removedBy === 'admin' ? 'admin' : 'employee');
  if(closedEarly) return 'No Status';
  return 'Pending';
}

async function init(){
  const sess = readSession();
  if(!sess) return kickToLogin(false);
  const requestedType = new URLSearchParams(location.search).get('requestType');
  if(requestedType === 'medicine' || requestedType === 'supplies'){
    requestType = requestedType;
    $('requestType').value = requestType;
  }
  const id = String(sess.staffId).toLowerCase();
  let data;
  try{ data = await loadEmployee(id); }
  catch(ex){ document.body.insertAdjacentHTML('beforeend','<p style="text-align:center;color:#a5151f">Unable to load ('+(ex.code||ex.message)+'). Please refresh the page.</p>'); return; }
  if(!data) return kickToLogin(true);
  emp = { ...data, id };
  if(!canRequestStock(emp.department)) return location.replace('/ed3od6ldsq');
  $('fName').textContent = emp.name || '';
  $('fSite').textContent = emp.siteName || '';
  $('fAv').textContent = (emp.name || '?').trim().charAt(0).toUpperCase();
  $('formView').style.display = 'block';
  onSnapshot(doc(db,'employees',id), snap=>{
    if(!snap.exists()) return kickToLogin(true);
    emp = { ...snap.data(), id };
    if(!canRequestStock(emp.department)) return location.replace('/ed3od6ldsq');
    if(current >= 0){ paintDays(); paintLock(); }
  }, ()=>{});
  const requestedDay = new URLSearchParams(location.search).get('day');
  const requestedIndex = DAYS.indexOf(String(requestedDay || '').toUpperCase());
  const g = new Date().getDay();
  let start = requestedIndex >= 0 ? requestedIndex : g>=1 && g<=5 ? g-1 : 0;
  if(requestedIndex < 0 && !dayAllowed(start)){ const f = DAYS.findIndex((_,k)=>dayAllowed(k)); if(f >= 0) start = f; }
  paintDays();
  select(start);
}

const daysEl = $('days');
function stockRequestDocumentId(date, staffId, type){
  return date + '_' + String(staffId).toLowerCase() + (type === 'supplies' ? '_supplies' : '');
}
function stockRequestsCollection(type){
  return collection(db, type === 'supplies' ? 'suppliesStockRequests' : 'stockRequests');
}
function stockDayDocument(date, type){
  return doc(db, 'stockDays', String(date) + (type === 'supplies' ? '_supplies' : ''));
}
$('requestType').addEventListener('change', event=>{
  requestType = event.currentTarget.value === 'supplies' ? 'supplies' : 'medicine';
  if(current >= 0) select(current);
});
const DAY_CALENDAR_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>';
DAYS.forEach((n,i)=>{
  const b = document.createElement('button');
  b.type='button'; b.innerHTML='<span>'+n.charAt(0)+n.slice(1).toLowerCase()+'</span>'+DAY_CALENDAR_SVG; b.dataset.i=i; b.onclick=()=>select(i);
  daysEl.appendChild(b);
});

function paintDays(){
  const scheduled = emp && Array.isArray(emp.requestDays);
  daysEl.querySelectorAll('button').forEach(b=>{
    const ok = dayAllowed(+b.dataset.i);
    b.classList.toggle('off', !ok);
    b.classList.toggle('mine', ok && scheduled);
  });
}
function paintLock(){
  const d = dateForDay(current), hasRequest = !!existing, adminCompleted = !!existing?.adminCompleted;
  const dayDeactivated = dayRecordExists && !dayActive;
  const timeUp = isLocked(d) || adminCompleted || adminRemoved || dayDeactivated;
  const notMine = !dayAllowed(current), locked = timeUp || notMine || (!dayActive && !hasRequest);
  $('dateLbl').textContent = d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
  const lb = $('lockbar');
  $('lockText').textContent = adminRemoved ? 'The admin removed your SR#. You can no longer submit another request for this day. Contact the Stock Request Admin for more details.' : adminCompleted ? 'The admin marked this SR# as Completed — it can no longer be edited.' : dayDeactivated ? 'The admin deactivated ' + requestType + ' stock requests for this day. You can no longer submit or edit an SR#.' : notMine ? 'You are not scheduled to send a stock request on this day.' : timeUp ? 'This order is locked — you can no longer submit or edit.' : (!dayActive && !hasRequest ? requestType.charAt(0).toUpperCase() + requestType.slice(1) + ' stock requests are not open yet — waiting for the admin to activate them.' : 'You can edit this request until ' + fmtCut() + '.');
  lb.className = 'lockbar' + (timeUp ? ' closed' : notMine ? ' off' : !dayActive && !hasRequest ? ' wait' : '');
  $('reqForm').classList.toggle('locked', locked);
  $('reqForm').classList.toggle('noreq', !existing);
  const statusBadge = $('requestStatus');
  const status = hasRequest ? requestStatusLabel(existing, dayClosedEarly) : '';
  statusBadge.textContent = status;
  statusBadge.classList.toggle('completed', status === 'Completed');
  statusBadge.classList.toggle('no-status', status === 'No Status');
  statusBadge.hidden = !hasRequest;
  $('fSr').disabled = locked || (hasRequest && !editingRequest);
  $('editSrBtn').style.display = hasRequest ? 'inline-flex' : 'none';
  $('editSrBtn').disabled = locked || !hasRequest;
  $('editSrBtn').classList.toggle('is-editing', editingRequest);
  $('editSrBtn').title = editingRequest
    ? 'Cancel editing'
    : locked ? 'Editing unavailable: ' + $('lockText').textContent : 'Edit SR#';
  $('editSrBtn').setAttribute('aria-label', $('editSrBtn').title);
  $('saveBtn').style.display = hasRequest && !editingRequest ? 'none' : '';
  $('saveBtn').disabled = locked || (hasRequest && !editingRequest);
  $('delBtn').disabled = locked || !hasRequest;
}

function select(i){
  current = i;
  const selectedDate = iso(dateForDay(i));
  selectedDateKey = selectedDate;
  existing = null;
  adminRemoved = false;
  editingRequest = false;
  dayActive = false; dayRecordExists = false; dayClosedEarly = false; cutoffMin = 840;
  daysEl.querySelectorAll('button').forEach(b=>b.classList.toggle('on', +b.dataset.i===i));
  $('msg').style.display = 'none';
  paintLock();
  if(unsub) unsub();
  if(unsubDay) unsubDay();
  unsubDay = onSnapshot(stockDayDocument(selectedDate, requestType), snap=>{
    const dd = snap.exists() ? snap.data() : null;
    dayRecordExists = !!dd;
    dayActive = !!dd && dd.active === true;
    dayClosedEarly = !!dd?.closedEarly;
    cutoffMin = dd && Number.isInteger(dd.cutoffMin) ? dd.cutoffMin : 840;
    paintLock();
  }, ()=>{});
  unsub = onSnapshot(doc(stockRequestsCollection(requestType), stockRequestDocumentId(selectedDate, emp.id, requestType)), snap=>{
    const request = snap.exists() ? snap.data() : null;
    const removed = request && request.status === 'removed';
    const removedByAdmin = removed && request.removedBy === 'admin';
    adminRemoved = !!removedByAdmin;
    const contactAdminLink = $('contactAdminLink');
    contactAdminLink.href = STOCK_REQUEST_ADMIN_TEAMS_URL;
    contactAdminLink.hidden = !removedByAdmin;
    const has = !!request && !removed;
    existing = has ? request : null;
    editingRequest = false;
    if(document.activeElement !== $('fSr')) $('fSr').value = has ? (request.sr || '') : '';
    $('delBtn').style.display = has ? 'inline-block' : 'none';
    $('saveBtn').textContent = has ? 'Update request' : 'Submit request';
    paintLock();
    if(removed && request.removedBy === 'admin'){
      const removalKey = request.removedAt && typeof request.removedAt.toMillis === 'function'
        ? String(request.removedAt.toMillis())
        : String(request.removalReason || 'removed');
      if(removalKey !== lastAdminRemovalNotice){
        lastAdminRemovalNotice = removalKey;
        showMsg('The admin removed your SR#. Reason: ' + (request.removalReason || 'No reason provided.'), false);
      }
    }else if(removed){
      showMsg('Request removed. The admin can see your reason.', true);
    }
  }, ex=>showMsg('Failed to load (' + (ex.code || ex.message) + ').', false));
}

$('editSrBtn').addEventListener('click', ()=>{
  if(!existing || blocked(dateForDay(current))) return;
  if(editingRequest){
    editingRequest = false;
    $('fSr').value = existing.sr || '';
  }else{
    editingRequest = true;
  }
  paintLock();
  if(editingRequest) $('fSr').focus();
});

function confirmRemoveRequest(sr){
  return new Promise(resolve=>{
    const modal = $('removeConfirmModal');
    $('removeConfirmText').textContent = 'Remove SR# ' + sr + '? The admin will be notified.';
    modal.classList.add('show');
    $('removeConfirmCancel').focus();
    function done(v){
      modal.classList.remove('show');
      $('removeConfirmOk').onclick = $('removeConfirmCancel').onclick = modal.onclick = null;
      document.removeEventListener('keydown', onKey);
      resolve(v);
    }
    function onKey(e){ if(e.key === 'Escape') done(null); }
    document.addEventListener('keydown', onKey);
    $('removeConfirmCancel').onclick = ()=>done(false);
    modal.onclick = e=>{ if(e.target === modal) done(false); };
    $('removeConfirmOk').onclick = ()=>done(true);
  });
}

async function saveRequest(sr){
  const d = dateForDay(current);
  $('saveBtn').disabled = true;
  try{
    const fresh = await loadEmployee(emp.id); if(fresh) emp = { ...fresh, id: emp.id };
    const requestRef = doc(stockRequestsCollection(requestType), stockRequestDocumentId(iso(d), emp.id, requestType));
    const latestRequest = await getDoc(requestRef);
    if(latestRequest.exists() && latestRequest.data().status === 'removed' && latestRequest.data().removedBy === 'admin'){
      adminRemoved = true;
      existing = null;
      paintLock();
      return showMsg('The admin removed your SR#. Contact the Stock Request Admin for more details.', false);
    }
    if(!dayAllowed(current)) return showMsg('You are not scheduled to send a stock request on this day.', false);
    const data = {
      staffId: emp.staffId || emp.id, name: emp.name || '', siteName: emp.siteName || '',
      sr, date: iso(d), day: DAYS[current], requestType, updatedAt: serverTimestamp()
    };
    const branch = String(emp.branch || '').trim().toLowerCase();
    const departmentBranch = String(emp.department || '').trim().match(/\s+(north|south|manila)$/i);
    if(branch.includes('north')) data.branch = 'north';
    else if(branch.includes('south')) data.branch = 'south';
    else if(branch.includes('manila')) data.branch = 'manila';
    else if(departmentBranch) data.branch = departmentBranch[1].toLowerCase();
    const latestData = latestRequest.exists() ? latestRequest.data() : null;
    const isUpdate = !!existing;
    if(isUpdate && (!latestData || latestData.sr !== existing.sr)){
      return showMsg('This SR# changed in another session. Refresh the page and review the latest request before editing.', false);
    }
    const history = latestData && Array.isArray(latestData.history) ? latestData.history.slice() : [];
    if(history.length) data.history = history;
    data.srSearchTerms = buildSrSearchTerms(
      sr,
      [...history, ...(isUpdate ? [{ oldSr:latestData.sr }] : [])],
      latestData?.srSearchTerms || []
    );
    if(isUpdate && latestRequest.exists()) await updateDoc(requestRef, data);
    else await setDoc(requestRef, data);
    try{
      await addDoc(collection(db,'emergencyNotifications'), {
        type:'stockRequestSubmitted',
        requestType,
        updated:isUpdate,
        ...(isUpdate ? { previousSr:latestData.sr } : {}),
        targetRoles:['stock'],
        employeeOnly:false,
        visibleToEmployees:false,
        employeeName:emp.name || 'Employee',
        staffId:emp.staffId || emp.id,
        location:emp.siteName || '',
        branch:data.branch || '',
        sr,
        date:iso(d),
        day:DAYS[current],
        createdAt:serverTimestamp()
      });
      void window.pdWakePushDelivery?.();
    }catch(notificationError){
      console.error('Stock request was saved, but its admin push notification failed:', notificationError);
      showMsg(isUpdate
        ? 'Updated. The admin can see the new SR#, but their phone notification could not be sent.'
        : 'Submitted. The admin can see it, but their phone notification could not be sent.', false);
      return;
    }
    if(isUpdate){
      editingRequest = false;
      $('fSr').value = sr;
      paintLock();
    }
    showMsg(isUpdate ? 'Updated. The admin has been notified and can see the new SR#.' : 'Submitted. The admin can now see it.', true);
  }catch(ex){
    showMsg('Could not save (' + (ex.code || ex.message) + ').', false);
  }finally{ paintLock(); }
}

$('reqForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const d = dateForDay(current);
  if(blocked(d)){ paintLock(); return showMsg(adminRemoved ? 'The admin removed your SR#. Contact the Stock Request Admin for more details.' : isLocked(d) ? 'The order for this day is already locked.' : 'This day has not been activated by the admin yet.', false); }
  const sr = $('fSr').value.trim();
  if(!sr) return showMsg('Please enter the SR#.', false);
  if(!validSrNumbers(sr)){ $('fSr').focus(); return showSrNumberError(); }
  if(existing){
    if(!editingRequest) return;
    if(sr === existing.sr) return showMsg('The SR# has not changed.', false);
    $('saveBtn').disabled = true;
    if(blocked(d)){
      editingRequest = false;
      paintLock();
      return showMsg(isLocked(d) ? 'The order for this day is already locked.' : 'This day is no longer active.', false);
    }
    return saveRequest(sr);
  }
  saveRequest(sr);
});

$('delBtn').addEventListener('click', async ()=>{
  const d = dateForDay(current);
  if(!existing || blocked(d)) return;
  if(!await confirmRemoveRequest(existing.sr)) return;
  if(blocked(d)) return showMsg(isLocked(d) ? 'The order for this day is already locked.' : 'This day is no longer active.', false);
  try{
    await updateDoc(doc(stockRequestsCollection(requestType), stockRequestDocumentId(iso(d), emp.id, requestType)), {
      sr: '',
      removedSr: existing.sr,
      srSearchTerms: buildSrSearchTerms(
        existing.sr,
        Array.isArray(existing.history) ? existing.history : [],
        existing.srSearchTerms || []
      ),
      status: 'removed',
      removedAt: serverTimestamp(),
      removedBy: 'employee',
      updatedAt: serverTimestamp()
    });
    editingRequest = false;
    existing = null;
    $('fSr').value='';
    paintLock();
    showMsg('Request removed. The admin has been notified.', true);
  }
  catch(ex){ showMsg('Could not remove (' + (ex.code || ex.message) + ').', false); }
});

setInterval(()=>{
  if(!emp || current < 0) return;
  if(iso(dateForDay(current)) !== selectedDateKey) select(current);
  else paintLock();
}, 1000);
init();
</script>
