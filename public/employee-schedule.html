        ${listKey === "relievers" ? `<input type="text" class="siteInput" list="siteNameList" data-card-id="${escapeAttr(card.id)}" data-list="${listKey}" data-sidx="${sIdx}" placeholder="Store to relieve — e.g. Branch X" value="${escapeAttr(s.site || "")}">` : ""}
        ${s.emergency ? `<span class="emergency-note">🚨 ${escapeHtml(s.emergencyBy || "Employee")} reported unavailable (emergency) — needs replacement</span>` : ""}
      </div>
      ${s.emergency ? `<span class="emergency-tag">Urgent</span>` : ""}
      <span class="status-dot ${s.name.trim() ? "filled" : ""}"></span>
      ${s.filledByStaffId ? `<button type="button" class="kickBtn" data-card-id="${escapeAttr(card.id)}" data-list="${listKey}" data-sidx="${sIdx}" title="Remove this employee from the slot and notify them" aria-label="Remove employee from slot">Remove</button>` : ""}
      <button type="button" class="removeFieldBtn" data-list="${listKey}" data-sidx="${sIdx}" title="Remove field" aria-label="Remove field">×</button>
    </div>
  `;
}

function blankCard() {
  return {
    id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()),
    region: "south",
    regionCustom: "",
    mission: "medical",
    location: "",
    date: "",
    time: "7:00PM - ONWARDS",
    staff: ROLE_LABELS.map(label => ({ label, name: "" })),
    relievers: [],
    photo: null,
    photoName: "",
    cancelled: false
  };
}

function migrateOld(oldCard) {
  const area = (oldCard.area || "").toUpperCase();
  const region = area.includes("NORTH") ? "north" : "south";
  const mission = area.includes("PEOPLE") ? "peoples_day" : "medical";
  return {
    id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()),
    region, regionCustom: "",
    mission,
    location: oldCard.location || "",
    date: oldCard.date || "",
    time: oldCard.time || "",
    staff: oldCard.staff || ROLE_LABELS.map(label => ({ label, name: "" })),
    relievers: oldCard.relievers || [],
    photo: oldCard.photo || null,
    photoName: "",
    cancelled: oldCard.cancelled || false
  };
}

function loadCards() {
  const savedV2 = localStorage.getItem(STORAGE_KEY);
  if (savedV2) {
    try { return JSON.parse(savedV2); } catch (e) {}
  }
  const savedV1 = localStorage.getItem("medicalMissionCards");
  if (savedV1) {
    try { return JSON.parse(savedV1).map(migrateOld); } catch (e) {}
  }
  return Array.from({ length: 6 }, blankCard);
}

let cards = loadCards();
// Card ids THIS device has just created locally and is still in the middle
// of pushing to Firestore for the very first time (see pushNewCardToRemote
// below). The live-sync listener won't treat these as orphans just because
// they don't exist on the server yet — everything else that's missing from
// the server is trusted to really be gone.
let pendingLocalCardIds = new Set();
let currentFilter = "all";
// Which date bracket the logged-in employee currently has selected.
let employeeSelectedDate = null;
// Which date bracket the admin currently has open. undefined = not yet
// chosen (defaults to the first/earliest bracket once render() runs).
let adminSelectedDate;

// Normalize any pre-existing entries to uppercase so old data matches the
// new auto-uppercase behavior right away. Also backfills the "relievers"
// list onto cards saved before the Store Reliever section existed.
cards.forEach(c => {
  c.location = (c.location || "").toUpperCase();
  if (!Array.isArray(c.relievers)) {
    c.relievers = [];
  }
  if (c.cancelled === undefined) c.cancelled = false;
  c.staff.forEach(s => { s.name = (s.name || "").toUpperCase(); });
  c.relievers.forEach(s => {
    s.name = (s.name || "").toUpperCase();
    if (s.site === undefined) s.site = "";
  });
  // Store Reliever rows display as Pharmacy Assistant duty — drop any leftover
  // PHARMACIST/BILLING/IT SPECIALIST reliever rows from older cards, and
  // relabel whatever's left (old PICKER/ENCODER entries) to a single
  // "PHARMACY ASSISTANT" role, since there's no longer a Picker/Encoder
  // distinction for relievers. Also drop empty leftover placeholder rows
  // (no name AND no site) from before Store Reliever rows were auto-added
  // per Picker/Encoder signup — a blank, site-less row is meaningless now.
  c.relievers = c.relievers
    .filter(s => ["PHARMACY ASSISTANT", "BILLING"].includes(roleToTeam(s.label).toUpperCase()))
    .filter(s => (s.name || "").trim() || (s.site || "").trim())
    .map(s => ({
      ...s,
      label: (s.name || "").trim()
        ? (roleToTeam(s.label).toUpperCase() === "BILLING" ? "BILLING" : "PHARMACY ASSISTANT")
        : ""
    }));
});

function saveCards() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(cards));
}

// ---------- Site name / role name suggestion history ----------
// siteHistory: every site name ever entered (for the Site name field).
// roleHistory: names used per role label (e.g. "PHARMACIST" -> [names...]),
// so each role only suggests names that have actually been assigned to it.
let siteHistory = new Set(JSON.parse(localStorage.getItem(SITE_HISTORY_KEY) || "[]"));
let roleHistory = JSON.parse(localStorage.getItem(ROLE_HISTORY_KEY) || "{}");

// Seed history from whatever is already saved, so suggestions are
// available immediately, not just going forward.
cards.forEach(c => {
  if (c.location.trim()) siteHistory.add(c.location.trim());
  [...c.staff, ...(c.relievers || [])].forEach(s => {
    if (!s.name.trim()) return;
    if (!roleHistory[s.label]) roleHistory[s.label] = [];
    if (!roleHistory[s.label].includes(s.name.trim())) roleHistory[s.label].push(s.name.trim());
  });
});

function saveSiteHistory() {
  localStorage.setItem(SITE_HISTORY_KEY, JSON.stringify([...siteHistory]));
}
function saveRoleHistory() {
  localStorage.setItem(ROLE_HISTORY_KEY, JSON.stringify(roleHistory));
}
function addSiteHistory(value) {
  const val = (value || "").trim();
  if (!val || siteHistory.has(val)) return;
  siteHistory.add(val);
  saveSiteHistory();
  renderDatalists();
}
function addRoleHistory(label, value) {
  const val = (value || "").trim();
  if (!val) return;
  if (!roleHistory[label]) roleHistory[label] = [];
  if (roleHistory[label].includes(val)) return;
  roleHistory[label].push(val);
  saveRoleHistory();
  renderDatalists();
}

function slug(str) {
  return (str || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
}

function renderDatalists() {
  const container = document.getElementById("datalistContainer");
  let html = `<datalist id="siteNameList">${[...siteHistory].sort().map(v => `<option value="${escapeAttr(v)}">`).join("")}</datalist>`;
  Object.keys(roleHistory).forEach(label => {
    html += `<datalist id="roleNameList-${slug(label)}">${roleHistory[label].slice().sort().map(v => `<option value="${escapeAttr(v)}">`).join("")}</datalist>`;
  });
  container.innerHTML = html;
}

// Keeps what the user is typing uppercase without jumping the caret around.
function uppercaseInPlace(el) {
  const start = el.selectionStart, end = el.selectionEnd;
  el.value = el.value.toUpperCase();
  el.setSelectionRange(start, end);
}

// Auto-appends " - ONWARDS" to the time field as the user types, and removes
// it again if the field is cleared back to empty. Keeps the caret in place.
const TIME_SUFFIX = " - ONWARDS";
function autoSuffixOnwards(el) {
  const caret = el.selectionStart;
  let base = el.value.replace(/\s*-\s*ONWARDS\s*$/i, "");
  base = base.replace(/[^0-9]/g, "");
  el.value = base.length > 0 ? base + TIME_SUFFIX : base;
  const pos = Math.min(caret, base.length);
  el.setSelectionRange(pos, pos);
}

// ---- Date masking helpers (MMDDYYYY digits <-> "January 31, 2026") ----
function isoToDigits(iso) {
  if (!iso) return "";
  const parts = iso.split("-");
  if (parts.length !== 3) return "";
  const [y, m, d] = parts;
  if (!y || !m || !d) return "";
  return m + d + y;
}
function digitsToIso(raw) {
  if (raw.length < 8) return "";
  const mm = raw.slice(0, 2), dd = raw.slice(2, 4), yyyy = raw.slice(4, 8);
  return `${yyyy}-${mm}-${dd}`;
}
function maskDigits(raw) {
  const mm = raw.slice(0, 2), dd = raw.slice(2, 4), yyyy = raw.slice(4, 8);
  let out = mm;
  if (dd) out += "/" + dd;
  if (yyyy) out += "/" + yyyy;
  return out;
}
function formatDateDisplay(iso) {
  if (!iso) return "";
  const parts = iso.split("-").map(Number);
  if (parts.length !== 3) return "";
  const [y, m, d] = parts;
  const dt = new Date(y, m - 1, d);
  if (isNaN(dt.getTime())) return "";
  return dt.toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });
}
// Rebuilds the visible dateInput value from a raw MMDDYYYY digit buffer and
// returns the resulting ISO date (or "" while incomplete).
function renderDateField(el, raw) {
  const iso = digitsToIso(raw);
  el.value = iso ? formatDateDisplay(iso) : maskDigits(raw);
  el.dataset.raw = raw;
  return iso;
}

// Blocks any keystroke that isn't a digit or a navigation/editing key —
// used to keep TIME and DATE fields number-only.
function digitsOnlyKeydown(e) {
  if (e.metaKey || e.ctrlKey || e.key === "Tab") return;
  const allowed = ["Backspace", "Delete", "ArrowLeft", "ArrowRight", "Home", "End", "Enter", "Escape"];
  if (allowed.includes(e.key)) return;
  if (!/^[0-9]$/.test(e.key)) {
    e.preventDefault();
  }
}

// Converts a native <input type="time"> value ("HH:MM", 24h) into the
// field's display format, e.g. "07:00" -> "7:00AM".
function formatTimeFrom24(hhmm) {
  if (!hhmm) return "";
  const [hStr, mStr] = hhmm.split(":");
  let h = parseInt(hStr, 10);
  if (isNaN(h)) return "";
  const ampm = h >= 12 ? "PM" : "AM";
  h = h % 12;
  if (h === 0) h = 12;
  return `${h}:${mStr}${ampm}`;
}

// ---- Time masking helpers (typed digits -> "7:00AM", auto-completed) ----
// Splits a typed digit buffer into hour/minute digits. Only "1" followed by
// 0/1/2 is treated as a two-digit hour (10, 11, 12); any other first digit
// (2-9) is a complete hour on its own, e.g. "7" -> hour "7" immediately.
function parseTimeRaw(raw) {
  if (!raw) return { hourDigits: "", minuteDigits: "" };
  let hourDigits, rest;
  if (raw[0] === "1" && raw.length >= 2 && /[012]/.test(raw[1])) {
    hourDigits = raw.slice(0, 2);
    rest = raw.slice(2);
  } else {
    hourDigits = raw.slice(0, 1);
    rest = raw.slice(1);
  }
  const minuteDigits = rest.slice(0, 2);
  return { hourDigits, minuteDigits };
}
// Builds the "H:MMAM" text from split digit parts, defaulting minutes to
// "00" until the user types them.
function formatTimeParts(hourDigits, minuteDigits, ampm) {
  if (!hourDigits) return "";
  let h = parseInt(hourDigits, 10);
  if (h === 0) h = 12;
  if (h > 12) h = 12;
  let mDisplay;
  if (minuteDigits.length === 0) mDisplay = "00";
  else if (minuteDigits.length === 1) mDisplay = minuteDigits;
  else {
    let m = parseInt(minuteDigits, 10);
    if (m > 59) m = 59;
    mDisplay = String(m).padStart(2, "0");
  }
  return `${h}:${mDisplay}${ampm}`;
}
// Rebuilds the visible TIME input value (plus the " - ONWARDS" suffix) from
// a raw digit buffer and an AM/PM flag, e.g. raw="7" ampm="AM" ->
// "7:00AM - ONWARDS". Stores the buffer back on the element for next keystroke.
function renderTimeField(el, raw, ampm) {
  const { hourDigits, minuteDigits } = parseTimeRaw(raw);
  const base = formatTimeParts(hourDigits, minuteDigits, ampm);
  el.value = base ? base + TIME_SUFFIX : "";
  el.dataset.raw = raw;
  el.dataset.ampm = ampm;
  return el.value;
}
// Extracts a raw digit buffer + AM/PM flag back out of a previously
// formatted time string, e.g. "7:00AM - ONWARDS" -> {raw:"700", ampm:"AM"}.
function timeToRawAmpm(str) {
  const m = (str || "").match(/(\d{1,2}):(\d{2})\s*(AM|PM)/i);
  if (!m) return { raw: "", ampm: "AM" };
  return { raw: m[1] + m[2], ampm: m[3].toUpperCase() };
}
// Keydown handler for a TIME field: digits build the raw buffer (auto-
// formatting to "H:MMAM/PM" after every keystroke), A/P toggles AM-PM, and
// Backspace/Delete remove the last digit typed.
function timeInputKeydown(el, idx) {
  return e => {
    if (e.metaKey || e.ctrlKey || e.key === "Tab") return;
    let raw = el.dataset.raw || "";
    let ampm = el.dataset.ampm || "AM";
    const key = e.key;
    if (key === "Backspace" || key === "Delete") {
      e.preventDefault();
      raw = raw.slice(0, -1);
    } else if (/^[0-9]$/.test(key)) {
      e.preventDefault();
      if (raw.length < 4) raw += key;
    } else if (/^[aApP]$/.test(key)) {
      e.preventDefault();
      if (!raw) return;
      ampm = key.toLowerCase() === "a" ? "AM" : "PM";
    } else if (["ArrowLeft", "ArrowRight", "Home", "End", "Enter", "Escape"].includes(key)) {
      return;
    } else {
      e.preventDefault();
      return;
    }
    renderTimeField(el, raw, ampm);
    cards[idx].time = el.value;
    saveCards();
  };
}

function regionLabel(card) {
  if (card.region === "south") return "South Caloocan";
  if (card.region === "north") return "North Caloocan";
  return card.regionCustom || "Custom area";
}
function missionLabel(card) {
  if (card.mission === "peoples_day") return "People's Day";
  return "Medical Mission";
}

function updateStats() {
  document.getElementById("statSites").textContent = cards.length;
  let unfilled = 0, ready = 0;
  cards.forEach(c => {
    const empty = c.staff.filter(s => !s.name.trim()).length +
      (c.relievers || []).filter(s => !s.name.trim()).length;
    unfilled += empty;
    if (empty === 0) ready++;
  });
  document.getElementById("statUnfilled").textContent = unfilled;
  document.getElementById("statReady").textContent = ready;
}

// Groups an array of {card, idx} entries into date brackets, sorted
// chronologically with cards that have no date pushed to the end.
function groupCardsByDate(items) {
  const groups = new Map();
  items.forEach(item => {
    const key = item.card.date || "";
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(item);
  });
  const keys = [...groups.keys()].sort((a, b) => {
    if (a === "" && b === "") return 0;
    if (a === "") return 1;
    if (b === "") return -1;
    return a < b ? -1 : a > b ? 1 : 0;
  });
  return keys.map(key => ({ date: key, items: groups.get(key) }));
}

function branchMarkersForGroup(group) {
  const branches = [...new Set(group.items
    .map(({ card }) => card.region === "north" ? "NORTH" : card.region === "south" ? "SOUTH" : "")
    .filter(Boolean))];
  return branches.map(branch =>
    `<span class="branch-marker ${branch.toLowerCase()}">${branch}</span>`
  ).join("");
}

// Counts how many staff slots are still unfilled across a date bracket's
// items. Works for both {card, idx} (admin) and {card} (employee) entries.
function bracketOpenCount(items) {
  let unfilled = 0;
  items.forEach(({ card }) => {
    unfilled += (card.staff || []).filter(s => !(s.name || "").trim()).length;
    unfilled += (card.relievers || []).filter(s => !(s.name || "").trim()).length;
  });
  return unfilled;
}

// Recomputes one date tab's "X open"/"✓ full" badge in place, right after
// a staff name is typed — so the count goes down the moment the field is
// filled instead of waiting for the tab to be clicked again.
function updateTabBadge(dateKey) {
  const tab = document.querySelector(`.date-tabs .date-tab[data-datekey="${escapeAttr(dateKey || "")}"]`);
  if (!tab) return;
  const matching = cards.filter(c => (c.date || "") === (dateKey || ""));
  const openCount = bracketOpenCount(matching.map(card => ({ card })));
  tab.classList.toggle("has-open", openCount > 0);
  const badge = tab.querySelector(".tab-badge");
  if (badge) {
    if (openCount > 0) {
      badge.className = "tab-badge";
      badge.textContent = `${openCount} open`;
    } else {
      badge.className = "tab-badge ok";
      badge.textContent = "✓ full";
    }
  }
}

function render() {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  const visible = [];
  cards.forEach((card, idx) => {
    if (currentFilter !== "all" && card.region !== currentFilter) return;
    visible.push({ card, idx });
  });

  if (!visible.length) {
    const noneMatchFilter = cards.length > 0;
    grid.innerHTML = noneMatchFilter
      ? `<div class="empty-state">
          <span class="stub">🎟️</span>
          <h2>No sites in this region yet</h2>
          <p>Switch the filter above, or add a site under this region to get started.</p>
        </div>`
      : `<div class="empty-state">
          <span class="stub">🎟️</span>
          <h2>No sites yet</h2>
          <p>Start by creating a date bracket for the event, then add each site under it.</p>
          <button type="button" class="btn primary" id="emptyStateAddDate">+ Add date event</button>
        </div>`;
    const emptyBtn = document.getElementById("emptyStateAddDate");
    if (emptyBtn) emptyBtn.addEventListener("click", () => document.getElementById("addDateBtn").click());
    updateStats();
    return;
  }

  const groups = groupCardsByDate(visible);

  // Keep the previously-selected date bracket open if it still exists;
  // otherwise default to the first (earliest) one. This keeps every date's
  // sites tucked behind its own tab instead of stacking all brackets at
  // once, which used to get cluttered fast as more dates were added.
  if (!groups.some(g => g.date === adminSelectedDate)) {
    adminSelectedDate = groups[0].date;
  }

  const tabs = document.createElement("div");
  tabs.className = "date-tabs";
  groups.forEach(group => {
    const tab = document.createElement("button");
    tab.type = "button";
    const openCount = bracketOpenCount(group.items);
    tab.className = "date-tab" + (group.date === adminSelectedDate ? " active" : "") + (openCount > 0 ? " has-open" : "");
    tab.dataset.datekey = group.date || "";
    const label = group.date ? formatDateDisplay(group.date) : "Unscheduled";
    tab.innerHTML = `${escapeHtml(label)} (${group.items.length}) ${branchMarkersForGroup(group)}` +
      (openCount > 0
        ? `<span class="tab-badge">${openCount} open</span>`
        : `<span class="tab-badge ok">✓ full</span>`);
    tab.addEventListener("click", () => {
      adminSelectedDate = group.date;
      render();
    });
    tabs.appendChild(tab);
  });
  grid.appendChild(tabs);

  const activeGroup = groups.find(g => g.date === adminSelectedDate) || groups[0];
  let ticketCounter = 0;

  {
    const group = activeGroup;
    const bracket = document.createElement("div");
    bracket.className = "date-bracket";
    const dateLabel = group.date ? formatDateDisplay(group.date) : "Unscheduled";
    bracket.innerHTML = `
      <div class="bracket-head">
        <span class="bracket-date">${escapeHtml(dateLabel)}</span>
        <span class="bracket-count">${group.items.length} site${group.items.length === 1 ? "" : "s"}</span>
        <div class="bracket-actions">
          <button type="button" class="btn bracket-edit-date-btn">✎ Edit date</button>
          <button type="button" class="btn danger-outline bracket-delete-btn">Delete event</button>
          <button type="button" class="btn bracket-update-btn">Update</button>
          <button type="button" class="btn bracket-add-btn">+ Add site</button>
        </div>
      </div>
      <div class="bracket-grid"></div>
    `;
    bracket.querySelector(".bracket-add-btn").addEventListener("click", () => {
      const nc = blankCard();
      nc.date = group.date;
      cards.push(nc);
      saveCards();
      render();
      pushNewCardToRemote(nc);
    });
    bracket.querySelector(".bracket-edit-date-btn").addEventListener("click", async () => {
      const newIso = await showDatePrompt("Choose the new date for this event:", group.date, "Save date");
      if (newIso === null) return;
      // Re-date every card that currently belongs to this bracket (matched
      // by date, not by the possibly-filtered group.items) so nothing gets
      // left behind under the old date.
      cards.forEach(c => { if ((c.date || "") === (group.date || "")) c.date = newIso; });
      adminSelectedDate = newIso;
      saveCards();
      render();
    });
    bracket.querySelector(".bracket-delete-btn").addEventListener("click", async () => {
      const wholeGroupCount = cards.filter(c => (c.date || "") === (group.date || "")).length;
      const ok = await showConfirm(
        `Delete "${dateLabel}"? This will remove all ${wholeGroupCount} site${wholeGroupCount === 1 ? "" : "s"} under this event date. This cannot be undone.`
      );
      if (!ok) return;
      const deletedDate = group.date;
      cards = cards.filter(c => (c.date || "") !== (group.date || ""));
      if (adminSelectedDate === group.date) adminSelectedDate = undefined;
      saveCards();
      render();
      deleteDateFromRemote(deletedDate);
    });
    bracket.querySelector(".bracket-update-btn").addEventListener("click", e => {
      saveCards();
      updateDateOnRemote(group.date, dateLabel, e.currentTarget);
    });
    const bracketGrid = bracket.querySelector(".bracket-grid");

    group.items.forEach(({ card, idx }) => {
      ticketCounter++;

      const cardEl = document.createElement("div");
      cardEl.className = "site-card" + (card.cancelled ? " is-cancelled" : "");
      cardEl.dataset.cardId = card.id;
      cardEl.dataset.date = card.date || "";
      cardEl.dataset.region = card.region;
      cardEl.dataset.cardId = card.id;

      cardEl.innerHTML = `
      <div class="ticket-number">#${String(ticketCounter).padStart(2, "0")}</div>
      <div class="accent-bar"></div>
      <div class="card-inner">
        ${card.cancelled ? `<div class="cancelled-stamp">CANCELLED</div>` : ""}
        <button class="cancel-event-btn ${card.cancelled ? "is-cancelled" : ""}" title="${card.cancelled ? "Reinstate this event" : "Cancel this event"}" aria-label="${card.cancelled ? "Reinstate this event" : "Cancel this event"}">${card.cancelled ? "↺" : "🚫"}</button>
        <button class="remove-btn" title="Remove this site" aria-label="Remove this site">×</button>

        <div class="region-line">
          <select class="regionSelect">
            <option value="south" ${card.region === "south" ? "selected" : ""}>South Caloocan</option>
            <option value="north" ${card.region === "north" ? "selected" : ""}>North Caloocan</option>
            <option value="other" ${card.region === "other" ? "selected" : ""}>Custom…</option>
          </select>
          ${card.region === "other" ? `<input type="text" class="customText regionCustomInput" placeholder="Area name" value="${escapeAttr(card.regionCustom)}">` : ""}
          <span class="sep">·</span>
          <select class="missionSelect">
            <option value="medical" ${card.mission === "medical" ? "selected" : ""}>Medical Mission</option>
            <option value="peoples_day" ${card.mission === "peoples_day" ? "selected" : ""}>People's Day</option>
          </select>
        </div>

        <input type="text" class="locationInput" list="siteNameList" placeholder="Site name — e.g. Brgy. 91 Hall" value="${escapeAttr(card.location)}">

        <div class="schedule-row">
          <div class="field">
            <label>Date</label>
            <div class="date-wrap">
              <input type="text" inputmode="numeric" class="dateInput" placeholder="MM/DD/YYYY" autocomplete="off" value="${escapeAttr(formatDateDisplay(card.date))}" data-raw="${escapeAttr(isoToDigits(card.date))}">
              <button type="button" class="calendarBtn" title="Choose date" aria-label="Choose date" tabindex="-1">📅</button>
              <input type="date" class="dateNative" tabindex="-1" value="${escapeAttr(card.date)}">
            </div>
          </div>
          <div class="field">
            <label>Time</label>
            <div class="time-wrap">
              <input type="text" inputmode="numeric" class="timeInput" placeholder="7:00AM" value="${escapeAttr(card.time)}">
              <button type="button" class="clockBtn" title="Choose time" aria-label="Choose time" tabindex="-1">🕐</button>
              <input type="time" class="timeNative" tabindex="-1">
            </div>
          </div>
        </div>

        <div class="perforation"></div>

        <div class="staff-section">
          <div class="staff-section-title">🩺 Event Team</div>
          <div class="staff-grid" data-list="staff">
            ${card.staff.map((s, sIdx) => adminStaffRowHtml(s, sIdx, "staff", card)).join("")}
          </div>
          <button type="button" class="addFieldBtn" data-list="staff">+ Add field</button>
        </div>

        <div class="staff-section reliever-section">
          <div class="staff-section-title">🏬 Store Reliever <span class="staff-section-hint">covers the store while Event Team is out</span></div>
          <div class="staff-grid" data-list="relievers">
            ${(card.relievers || []).map((s, sIdx) => adminStaffRowHtml(s, sIdx, "relievers", card)).join("")}
          </div>
          <button type="button" class="addFieldBtn" data-list="relievers">+ Add field</button>
        </div>

        <div class="attach-row ${card.photo ? "has-photo" : ""}">
          <div class="attach-thumb">${card.photo ? `<img src="${card.photo}" alt="">` : "📎"}</div>
          <div class="attach-text">${card.photo ? `<span class="fname">${escapeHtml(card.photoName || "Photo attached")}</span>` : "Attach site photo"}</div>
          <button class="attach-clear" type="button">Remove</button>
          <input type="file" accept="image/*" class="hiddenFile">
        </div>
      </div>
    `;

    // ---- Events ----
    cardEl.querySelector(".cancel-event-btn").addEventListener("click", async function () {
      const nowCancelled = !cards[idx].cancelled;
      const ok = await showConfirm(
        nowCancelled
          ? "Cancel this event? Employees will see it marked as cancelled and won't be able to sign up until it's reinstated."
          : "Reinstate this event? It will become active again for employees."
      );
      if (!ok) return;
      cards[idx].cancelled = nowCancelled;
      saveCards();
      // Flip the visible state on this exact card right away, instead of
      // waiting on the full render() below (or a page refresh) to notice.
      cardEl.classList.toggle("is-cancelled", nowCancelled);
      this.classList.toggle("is-cancelled", nowCancelled);
      this.title = nowCancelled ? "Reinstate this event" : "Cancel this event";
      this.textContent = nowCancelled ? "↺" : "🚫";
      let stampEl = cardEl.querySelector(".cancelled-stamp");
      if (nowCancelled && !stampEl) {
        stampEl = document.createElement("div");
        stampEl.className = "cancelled-stamp";
        stampEl.textContent = "CANCELLED";
        cardEl.querySelector(".card-inner").prepend(stampEl);
      } else if (!nowCancelled && stampEl) {
        stampEl.remove();
      }
      render();
      pushCardPatchToRemote(card.id, { cancelled: nowCancelled }, cards[idx]);
    });

    cardEl.querySelector(".remove-btn").addEventListener("click", async () => {
      if (await showConfirm("Remove this site from the list?")) {
        const removedId = card.id;
        cards.splice(idx, 1);
        saveCards();
        render();
        deleteSiteFromRemote(removedId);
      }
    });

    cardEl.querySelector(".regionSelect").addEventListener("change", e => {
      cards[idx].region = e.target.value;
      saveCards(); render();
    });
    const regionCustomInput = cardEl.querySelector(".regionCustomInput");
    if (regionCustomInput) regionCustomInput.addEventListener("input", e => {
      cards[idx].regionCustom = e.target.value; saveCards();
    });

    cardEl.querySelector(".missionSelect").addEventListener("change", e => {
      cards[idx].mission = e.target.value;
      saveCards(); render();
    });

    const locationInput = cardEl.querySelector(".locationInput");
    locationInput.addEventListener("input", e => {
      uppercaseInPlace(e.target);
      cards[idx].location = e.target.value; saveCards();
    });
    locationInput.addEventListener("change", e => {
      addSiteHistory(e.target.value);
    });
    const dateInputEl = cardEl.querySelector(".dateInput");
    const dateNativeEl = cardEl.querySelector(".dateNative");
    dateInputEl.addEventListener("keydown", e => {
      if (e.metaKey || e.ctrlKey || e.key === "Tab") return;
      e.preventDefault();
      let raw = dateInputEl.dataset.raw || "";
      if (e.key === "Backspace" || e.key === "Delete") {
        raw = raw.slice(0, -1);
      } else if (/^[0-9]$/.test(e.key)) {
        if (raw.length < 8) raw += e.key;
      } else {
        return;
      }
      const iso = renderDateField(dateInputEl, raw);
      cards[idx].date = iso;
      dateNativeEl.value = iso;
      saveCards();
    });
    dateInputEl.addEventListener("paste", e => {
      e.preventDefault();
      const text = (e.clipboardData || window.clipboardData).getData("text");
      const raw = text.replace(/[^0-9]/g, "").slice(0, 8);
      const iso = renderDateField(dateInputEl, raw);
      cards[idx].date = iso;
      dateNativeEl.value = iso;
      saveCards();
    });
    cardEl.querySelector(".calendarBtn").addEventListener("click", () => {
      if (dateNativeEl.showPicker) dateNativeEl.showPicker();
      else dateNativeEl.click();
    });
    dateNativeEl.addEventListener("change", e => {
      const iso = e.target.value;
      renderDateField(dateInputEl, isoToDigits(iso));
      cards[idx].date = iso;
      saveCards();
    });

    const timeInputEl = cardEl.querySelector(".timeInput");
    const timeNativeEl = cardEl.querySelector(".timeNative");
    {
      const initial = timeToRawAmpm(card.time);
      timeInputEl.dataset.raw = initial.raw;
      timeInputEl.dataset.ampm = initial.ampm;
    }
    timeInputEl.addEventListener("keydown", timeInputKeydown(timeInputEl, idx));
    timeInputEl.addEventListener("paste", e => {
      e.preventDefault();
      const text = (e.clipboardData || window.clipboardData).getData("text");
      const digits = text.replace(/[^0-9]/g, "").slice(0, 4);
      const ampmMatch = text.match(/[AP]M?/i);
      const ampm = ampmMatch ? (ampmMatch[0][0].toUpperCase() === "A" ? "AM" : "PM") : (timeInputEl.dataset.ampm || "AM");
      renderTimeField(timeInputEl, digits, ampm);
      cards[idx].time = timeInputEl.value;
      saveCards();
    });
    cardEl.querySelector(".clockBtn").addEventListener("click", () => {
      if (timeNativeEl.showPicker) timeNativeEl.showPicker();
      else timeNativeEl.click();
    });
    timeNativeEl.addEventListener("change", e => {
      const base = formatTimeFrom24(e.target.value);
      const parsed = timeToRawAmpm(base);
      renderTimeField(timeInputEl, parsed.raw, parsed.ampm);
      cards[idx].time = timeInputEl.value;
      saveCards();
    });

    cardEl.querySelectorAll(".nameInput").forEach(inp => {
      inp.addEventListener("input", e => {
        uppercaseInPlace(e.target);
        const listKey = e.target.dataset.list || "staff";
        const sIdx = parseInt(e.target.dataset.sidx, 10);
        const arr = cards[idx][listKey];
        arr[sIdx].name = e.target.value;
        arr[sIdx]._touched = true;
        if (arr[sIdx].emergency && e.target.value.trim()) {
          arr[sIdx].emergency = false;
          arr[sIdx].emergencyBy = null;
          arr[sIdx].emergencyByStaffId = null;
        }
        // Admin manually cleared/edited a self-claimed slot's name by typing —
        // release the ownership tag too, or the previous owner stays stuck
        // seeing "You're already signed up" even though the slot now looks
        // empty (filledByStaffId would otherwise still point to them).
        let releasedReliever = false;
        if (!e.target.value.trim() && arr[sIdx].filledByStaffId) {
          // Same reliever cleanup as unclaimSlot/markUnavailable/the kick
          // button: clearing an Event Team (Pharmacy Assistant) name by
          // typing also releases the store-reliever row auto-added for her,
          // as long as no one has filled it in yet.
          if (listKey === "staff" && roleToTeam(arr[sIdx].label).toUpperCase() === "PHARMACY ASSISTANT") {
            const relieversArr = cards[idx].relievers || [];
            const autoIdx = relieversArr.findIndex(s =>
              s.addedForStaffId === arr[sIdx].filledByStaffId && !(s.name || "").trim()
            );
            if (autoIdx !== -1) {
              relieversArr.splice(autoIdx, 1);
              releasedReliever = true;
            }
          }
          arr[sIdx].filledByStaffId = null;
          arr[sIdx].emergency = false;
          arr[sIdx].emergencyBy = null;
          arr[sIdx].emergencyByStaffId = null;
        }
        if (releasedReliever) {
          // A reliever row disappeared, which changes the DOM structure of
          // this card (not just a text value) — a full re-render is needed
          // so the row actually vanishes on screen instead of only in data.
          saveCards();
          render();
          return;
        }
        const dot = e.target.closest(".staff-row").querySelector(".status-dot");
        dot.classList.toggle("filled", e.target.value.trim().length > 0);
        saveCards();
        updateStats();
        updateTabBadge(group.date);
      });
      inp.addEventListener("change", e => {
        const listKey = e.target.dataset.list || "staff";
        const sIdx = parseInt(e.target.dataset.sidx, 10);
        const slot = cards[idx][listKey][sIdx];
        addRoleHistory(slot.label, e.target.value);
        // Picker/Encoder-Picker (Event Team) duty pulls a Pharmacy Assistant
        // out of her own store — auto-add/refresh a Store Reliever row on
        // this same card with her registered Site Name, same as when she
        // self-signs-up, so Event Team can see which store needs covering
        // even when the admin typed her name in directly instead.
        if (listKey === "staff" && roleToTeam(slot.label).toUpperCase() === "PHARMACY ASSISTANT") {
          syncAutoRelieverForSlot(cards[idx], sIdx, e.target.value);
          saveCards();
          render();
        }
      });
    });

    cardEl.querySelectorAll(".siteInput").forEach(inp => {
      inp.addEventListener("input", e => {
        uppercaseInPlace(e.target);
        const listKey = e.target.dataset.list || "relievers";
        const sIdx = parseInt(e.target.dataset.sidx, 10);
        cards[idx][listKey][sIdx].site = e.target.value;
        saveCards();
      });
      inp.addEventListener("change", e => {
        addSiteHistory(e.target.value);
      });
    });

    cardEl.querySelectorAll(".roleSelect").forEach(sel => {
      sel.addEventListener("change", e => {
        const listKey = e.target.dataset.list || "staff";
        const sIdx = parseInt(e.target.dataset.sidx, 10);
        cards[idx][listKey][sIdx].label = e.target.value;
        saveCards();
        render();
      });
    });

    cardEl.querySelectorAll(".removeFieldBtn").forEach(btn => {
      btn.addEventListener("click", e => {
        const listKey = btn.dataset.list || "staff";
        const sIdx = parseInt(btn.dataset.sidx, 10);
        cards[idx][listKey].splice(sIdx, 1);
        saveCards();
        render();
      });
    });

    cardEl.querySelectorAll(".kickBtn").forEach(btn => {
      btn.addEventListener("click", async () => {
        const listKey = btn.dataset.list || "staff";
        const sIdx = parseInt(btn.dataset.sidx, 10);
        const slot = (cards[idx][listKey] || [])[sIdx];
        const who = (slot && slot.name) ? slot.name : "this employee";
        const ok = await showConfirm(`Remove ${who} from this slot?\n\nThey'll be notified right away and can sign up for a slot again.`);
        if (!ok) return;
        await adminRemoveEmployeeFromSlot(card.id, listKey, sIdx, btn);
      });
    });

    cardEl.querySelectorAll(".addFieldBtn").forEach(btn => {
      btn.addEventListener("click", () => {
        const listKey = btn.dataset.list || "staff";
        if (!Array.isArray(cards[idx][listKey])) cards[idx][listKey] = [];
        cards[idx][listKey].push(
          listKey === "relievers"
            ? { label: RELIEVER_ROLE_OPTIONS[0], name: "", site: "" }
            : { label: ROLE_OPTIONS[0], name: "" }
        );
        saveCards();
        render();
      });
    });

    // ---- Drag-to-reorder roles (grab the 6-dot handle, drop on target row).
    // Reordering only happens within the same list (Event Team stays
    // separate from Store Reliever) — a drop across sections is ignored.
    cardEl.querySelectorAll(".staff-row").forEach(row => {
      row.addEventListener("dragover", e => {
        e.preventDefault();
        row.classList.add("drag-over");
      });
      row.addEventListener("dragleave", () => row.classList.remove("drag-over"));
      row.addEventListener("drop", e => {
        e.preventDefault();
        row.classList.remove("drag-over");
        const [fromList, fromIdxRaw] = String(e.dataTransfer.getData("text/plain")).split(":");
        const fromIdx = parseInt(fromIdxRaw, 10);
        const toList = row.dataset.list || "staff";
        const toIdx = parseInt(row.dataset.sidx, 10);
        if (fromList !== toList || isNaN(fromIdx) || fromIdx === toIdx) return;
        const staffArr = cards[idx][toList];
        const [moved] = staffArr.splice(fromIdx, 1);
        staffArr.splice(toIdx, 0, moved);
        saveCards();
        render();
      });
    });
    cardEl.querySelectorAll(".drag-handle").forEach(handle => {
      handle.addEventListener("dragstart", e => {
        const row = handle.closest(".staff-row");
        e.dataTransfer.effectAllowed = "move";
        e.dataTransfer.setData("text/plain", `${row.dataset.list || "staff"}:${row.dataset.sidx}`);
        row.classList.add("dragging");
      });
      handle.addEventListener("dragend", () => {
        cardEl.querySelectorAll(".staff-row").forEach(r => r.classList.remove("dragging", "drag-over"));
      });
    });

    const fileInput = cardEl.querySelector(".hiddenFile");
    const thumb = cardEl.querySelector(".attach-thumb");
    const attachText = cardEl.querySelector(".attach-text");
    const attachRow = cardEl.querySelector(".attach-row");
    thumb.addEventListener("click", () => fileInput.click());
    attachText.addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        cards[idx].photo = ev.target.result;
        cards[idx].photoName = file.name;
        saveCards();
        render();
      };
      reader.readAsDataURL(file);
    });
    cardEl.querySelector(".attach-clear").addEventListener("click", () => {
      cards[idx].photo = null;
      cards[idx].photoName = "";
      saveCards();
      render();
    });

      bracketGrid.appendChild(cardEl);
    });

    grid.appendChild(bracket);
  }

  updateStats();
}

// Read-only view shown to a logged-in employee. Employees can review every
// published branch because department heads may deploy them to another site.
function renderEmployeeSchedule(scheduleCards, branch) {
  const headSub = document.querySelector(".page-head p");
  if (headSub) headSub.textContent = "Deployment schedule for all branches.";

  const filtered = scheduleCards || [];

  // Find the one slot (if any) this employee currently holds — Event Team
  // OR Store Reliever, across every branch/date. An employee can only hold
  // one slot total at a time, so every other open slot's "Sign me up"
  // button gets disabled until they leave it.
  let myActiveSlot = null;
  (scheduleCards || []).some(c => {
    for (const listKey of ["staff", "relievers"]) {
      const list = c[listKey] || [];
      for (let i = 0; i < list.length; i++) {
        if (slotBelongsToEmployee(list[i])) {
          myActiveSlot = { cardId: c.id, list: listKey, sIdx: i };
          return true;
        }
      }
    }
    return false;
  });

  document.getElementById("statSites").textContent = filtered.length;
  let unfilled = 0, ready = 0;
  filtered.forEach(c => {
    const empty = (c.staff || []).filter(s => !(s.name || "").trim()).length +
      (c.relievers || []).filter(s => !(s.name || "").trim()).length;
    unfilled += empty;
    if (empty === 0) ready++;
  });
  document.getElementById("statUnfilled").textContent = unfilled;
  document.getElementById("statReady").textContent = ready;

  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  if (!filtered.length) {
    grid.innerHTML = `<div class="empty-state">
        <span class="stub">🎟️</span>
        <h2>Nothing posted yet</h2>
        <p>No schedule has been sent yet. Check back once the admin publishes the roster.</p>
      </div>`;
    return;
  }

  // Group this employee's sites into date brackets, so they pick a date
  // up top and only see that date's available event bracket below.
  const groups = groupCardsByDate(filtered.map(card => ({ card })));

  // Keep the previously-selected date if it's still around; otherwise
  // default to the first (earliest) bracket.
  if (!groups.some(g => g.date === employeeSelectedDate)) {
    employeeSelectedDate = groups[0].date;
  }

  const tabs = document.createElement("div");
  tabs.className = "date-tabs";
  groups.forEach(group => {
    const tab = document.createElement("button");
    tab.type = "button";
    const openCount = bracketOpenCount(group.items);
    tab.className = "date-tab" + (group.date === employeeSelectedDate ? " active" : "") + (openCount > 0 ? " has-open" : "");
    tab.dataset.datekey = group.date || "";
    const label = group.date ? formatDateDisplay(group.date) : "Unscheduled";
    tab.innerHTML = `${escapeHtml(label)} (${group.items.length}) ${branchMarkersForGroup(group)}` +
      (openCount > 0
        ? `<span class="tab-badge">${openCount} open</span>`
        : `<span class="tab-badge ok">✓ full</span>`);
    tab.addEventListener("click", () => {
      employeeSelectedDate = group.date;
      renderEmployeeSchedule(scheduleCards, branch);
    });
    tabs.appendChild(tab);
  });
  grid.appendChild(tabs);

  const activeGroup = groups.find(g => g.date === employeeSelectedDate) || groups[0];
  const bracketGrid = document.createElement("div");
  bracketGrid.className = "bracket-grid";
  grid.appendChild(bracketGrid);

  const branchSections = new Map();
  ["north", "south"].forEach(branchKey => {
    const branchItems = activeGroup.items.filter(({ card }) => card.region === branchKey);
    if (!branchItems.length) return;
    const section = document.createElement("section");
    section.className = `branch-container ${branchKey}`;
    section.innerHTML = `<h3 class="branch-container-head ${branchKey}">${branchKey === "north" ? "NORTH" : "SOUTH"} BRANCH</h3>`;
    const sectionGrid = document.createElement("div");
    sectionGrid.className = "branch-container-grid";
    section.appendChild(sectionGrid);
    bracketGrid.appendChild(section);
    branchSections.set(branchKey, sectionGrid);
  });

  activeGroup.items.forEach(({ card }, idx) => {
    const cardEl = document.createElement("div");
    cardEl.className = "site-card" + (card.cancelled ? " is-cancelled" : "");
    cardEl.dataset.region = card.region;
    cardEl.innerHTML = `
      <div class="ticket-number">#${String(idx + 1).padStart(2, "0")}</div>
      <div class="accent-bar"></div>
      <div class="card-inner">
        ${card.cancelled ? `<div class="cancelled-stamp">CANCELLED</div>` : ""}
        <div class="region-line">
          <span class="sep">${escapeHtml(regionLabel(card))} · ${escapeHtml(missionLabel(card))}</span>
          ${(() => {
            if (card.cancelled) return `<span class="card-status cancelled">Cancelled</span>`;
            const openHere = (card.staff || []).filter(s => !(s.name || "").trim()).length +
              (card.relievers || []).filter(s => !(s.name || "").trim()).length;
            return openHere > 0
              ? `<span class="card-status warn">${openHere} role${openHere === 1 ? "" : "s"} open</span>`
              : `<span class="card-status ok">✓ fully staffed</span>`;
          })()}
        </div>
        <div class="locationInput" style="border:none;padding:0;">${escapeHtml(card.location || "Unnamed site")}</div>
        <div class="schedule-row">
          <div class="field">
            <label>Date</label>
            <div>${escapeHtml(formatDateDisplay(card.date) || "—")}</div>
          </div>
          <div class="field">
            <label>Time</label>
            <div>${escapeHtml(card.time || "—")}</div>
          </div>
        </div>
        <div class="perforation"></div>
        <div class="staff-section">
          <div class="staff-section-title">🩺 Event Team</div>
          <div class="staff-grid">
            ${(card.staff || []).map((s, sIdx) => employeeStaffRowHtml(s, sIdx, "staff", card, myActiveSlot, card.cancelled)).join("")}
          </div>
        </div>
        <div class="staff-section reliever-section">
          <div class="staff-section-title">🏬 Store Reliever <span class="staff-section-hint">covers the store while Event Team is out</span></div>
          <div class="staff-grid">
            ${(card.relievers || []).map((s, sIdx) => employeeStaffRowHtml(s, sIdx, "relievers", card, myActiveSlot, card.cancelled)).join("")}
          </div>
        </div>
      </div>
    `;
    cardEl.querySelectorAll(".claim-btn").forEach(btn => {
      btn.addEventListener("click", async () => {
        const roleLabel = btn.dataset.roleLabel;
        const btnListKey = btn.dataset.list || "staff";
        if (!isRoleAllowedForEmployee(roleLabel, btnListKey)) {
          const { team: myTeam } = employeeSession ? splitDepartmentClient(employeeSession.department) : { team: "—" };
          if (btnListKey === "relievers") {
            await showAlert(`You can't sign up here. Store Reliever duty is for Pharmacy Assistant or Billing employees, and your department is ${myTeam}.`);
          } else {
            await showAlert(`You can't sign up here. This is a "${roleLabel}" role only, and your department is ${myTeam}.`);
          }
          return;
        }
        claimSlot(btn.dataset.cardId, btn.dataset.list || "staff", parseInt(btn.dataset.sidx, 10), btn);
      });
    });
    cardEl.querySelectorAll(".unclaim-btn").forEach(btn => {
      btn.addEventListener("click", async () => {
        const ok = await showConfirm("Remove your name from this slot?");
        if (!ok) return;
        unclaimSlot(btn.dataset.cardId, btn.dataset.list || "staff", parseInt(btn.dataset.sidx, 10), btn);
      });
    });
    cardEl.querySelectorAll(".unavailable-btn").forEach(btn => {
      btn.addEventListener("click", async () => {
        const ok = await showConfirm("Mark yourself as unavailable due to an emergency?\n\nThe admin and other qualified employees will be notified right away so this slot can be filled.");
        if (!ok) return;
        markUnavailable(btn.dataset.cardId, btn.dataset.list || "staff", parseInt(btn.dataset.sidx, 10), btn);
      });
    });
    const sectionGrid = branchSections.get(card.region);
    (sectionGrid || bracketGrid).appendChild(cardEl);
  });
}

// Renders one slot row (employee view) for either the "staff" (Event Team)
// or "relievers" (Store Reliever) list — with the appropriate sign-up /
// leave / unavailable controls, scoped by listKey.
function employeeStaffRowHtml(s, sIdx, listKey, card, myActiveSlot, cancelled) {
  const filled = (s.name || "").trim().length > 0;
  const isMine = filled && slotBelongsToEmployee(s);
  const isEmergencyOpen = !filled && s.emergency;
  const blockedByOtherSlot = !filled && !!myActiveSlot &&
    !(myActiveSlot.cardId === card.id && myActiveSlot.list === listKey && myActiveSlot.sIdx === sIdx);
  const displayLabel = listKey === "relievers" ? relieverDisplayLabel(s) : s.label;
  const allowed = isRoleAllowedForEmployee(s.label, listKey);
  return `
    <div class="staff-row${isEmergencyOpen ? " emergency" : ""}">
      <span class="status-dot ${filled ? "filled" : ""}"></span>
      <span style="min-width:120px;color:var(--ink-muted);font-size:12px;">
        ${escapeHtml(blockedByOtherSlot && allowed ? "Already assigned — department transfer required" : displayLabel)}
        ${listKey === "relievers" && (s.site || "").trim() ? `<span class="reliever-site-tag">📍 ${escapeHtml(s.site)}</span>` : ""}
        ${isEmergencyOpen ? `<span class="emergency-note">🚨 Previously: ${escapeHtml(s.emergencyBy || "Employee")} — unavailable</span>` : ""}
      </span>
      ${filled
        ? `<strong style="flex:1;">${escapeHtml(s.name)}</strong>` +
          (isMine
            ? (cancelled
                ? `<span style="flex-shrink:0;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-faint);">Event cancelled</span>`
                : (isPastLeaveCutoff()
                    ? `<span style="flex-shrink:0;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-faint);" title="Past the daily cutoff — only the admin can remove you from this slot now.">🔒 Locked — see admin</span>`
                    : `<button type="button" class="unavailable-btn" data-card-id="${escapeAttr(card.id)}" data-list="${listKey}" data-sidx="${sIdx}">🚨 Not Available</button>` +
                      `<button type="button" class="unclaim-btn" data-card-id="${escapeAttr(card.id)}" data-list="${listKey}" data-sidx="${sIdx}">Leave slot</button>`))
            : "")
        : (() => {
            if (cancelled) {
              return `<button type="button" class="claim-btn blocked" disabled title="This event has been cancelled">Cancelled</button>`;
            }
            const blockedByOtherSlot = !!myActiveSlot && !(myActiveSlot.cardId === card.id && myActiveSlot.list === listKey && myActiveSlot.sIdx === sIdx);
            const label = isEmergencyOpen ? "🚨 Take slot (URGENT)" : (listKey === "relievers" ? "+ Sign up as reliever" : "+ Sign me up");
            const restrictionLabel = listKey === "relievers" ? "Pharmacy Assistant or Billing" : roleToTeam(s.label);
            if (blockedByOtherSlot) {
              return `<button type="button" class="claim-btn blocked" disabled title="You already have an assignment. Only the department can move you to another site.">${label}</button>`;
            }
            return `<button type="button" class="claim-btn${allowed ? "" : " blocked"}${isEmergencyOpen && allowed ? " urgent" : ""}" data-card-id="${escapeAttr(card.id)}" data-list="${listKey}" data-sidx="${sIdx}" data-role-label="${escapeAttr(s.label)}"${allowed ? "" : ` title="This is for ${escapeAttr(restrictionLabel)} only"`}>${label}</button>`;
          })()
      }
    </div>
  `;
}

function escapeAttr(str) {
  return (str || "").replace(/"/g, "&quot;");
}
function escapeHtml(str) {
  return (str || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// ---------- Employee leaderboard (most-participate) ----------
// staffId (lowercase) -> { name, department } from the "employees"
// collection. Filled in by startEmployeesListener(); used to resolve each
// participant's branch (south/north) and team (IT / BILLING / Pharmacy
// Assistant) for the leaderboard cards below.
let employeesMap = new Map();

function relieverDisplayLabel(slot) {
  if (!(slot && (slot.name || "").trim())) return "";
  const employee = slot.filledByStaffId
    ? employeesMap.get(String(slot.filledByStaffId).trim().toLowerCase())
    : [...employeesMap.values()].find(data =>
        String((data && data.name) || "").trim().toUpperCase() === String(slot.name).trim().toUpperCase()
      );
  const employeeTeam = employee
    ? roleToTeam(splitDepartmentClient(employee.department).team).toUpperCase()
    : "";
  const storedTeam = roleToTeam(slot.relieverDepartment || "").toUpperCase();
  const labelTeam = roleToTeam(slot.label).toUpperCase();
  return employeeTeam === "BILLING" || storedTeam === "BILLING" || labelTeam === "BILLING"
    ? "BILLING"
    : "PHARMACY ASSISTANT";
}
// Last full (unfiltered, both branches) schedule cards seen, so the
// leaderboard can be re-rendered whenever either the schedule or the
// employees list changes, without waiting for the other to also change.
let lastScheduleCardsForLeaderboard = [];
// Guards the "my account got deleted" check below against a slow/offline
// first read of the employees collection ever looking like a deletion for
// someone who's actually still a valid employee — only checked from the
// second snapshot onward.
let employeesSnapshotSeen = false;

// Splits a department string like "IT NORTH" or "Pharmacy Assistant SOUTH"
// into { team: "IT", branch: "NORTH" }, same convention as admin-console.html.
function splitDepartmentClient(dep) {
  const raw = String(dep || "").trim();
  const m = raw.match(/^(.*?)\s+(NORTH|SOUTH)$/i);
  if (m) return { team: m[1].trim(), branch: m[2].toUpperCase() };
  return { team: raw || "—", branch: "—" };
}

// Maps a role-slot label (e.g. "IT SPECIALIST", "PHARMACIST", "PICKER") to
// the department/team that's allowed to sign up for it. PICKER and
// ENCODER/PICKER are Pharmacy Assistant work, not PHARMACIST — keep those
// separate so a Pharmacist account can't claim a Picker slot and vice versa.
function roleToTeam(label) {
  const up = String(label || "").toUpperCase();
  if (up.includes("IT")) return "IT";
  if (up.includes("BILLING")) return "BILLING";
  if (up === "PHARMACIST") return "PHARMACIST";
  return "Pharmacy Assistant"; // PICKER, ENCODER, ENCODER/PICKER
}

// Whether the currently logged-in employee's own department matches the
// team a given role slot belongs to. Used to block signing up for roles
// outside your own department (e.g. a BILLING employee can't sign up for
// a PHARMACIST slot). Store Reliever ("relievers") slots may be covered by
// Pharmacy Assistant or Billing employees, regardless of the display role
// label on the reliever row.
function isRoleAllowedForEmployee(label, listKey) {
  if (!employeeSession) return false;
  const { team } = splitDepartmentClient(employeeSession.department);
  // Normalize the department's team through roleToTeam too — this way it
  // still matches "Pharmacy Assistant" even if an older/legacy account has
  // its department saved as something like "PICKER" or "ENCODER" instead of
  // the broader "Pharmacy Assistant" label.
  const normalizedTeam = roleToTeam(team).toUpperCase();
  if (listKey === "relievers") {
    return normalizedTeam === "PHARMACY ASSISTANT" || normalizedTeam === "BILLING";
  }
  return normalizedTeam === roleToTeam(label).toUpperCase();
}

function normalizedEmployeeName(value) {
  return String(value || "").trim().replace(/\s+/g, " ").toLowerCase();
}

function slotBelongsToEmployee(slot) {
  if (!employeeSession || !slot) return false;
  const staffId = String(employeeSession.staffId || "").trim().toLowerCase();
  if (staffId && String(slot.filledByStaffId || "").trim().toLowerCase() === staffId) return true;
  return normalizedEmployeeName(slot.name) === normalizedEmployeeName(employeeSession.name);
}

// Finds an employee record in employeesMap whose registered name matches
// typedName (case-insensitive, exact match). Used so that admin/Event Team
// typing a Pharmacy Assistant's name directly into a Picker/Encoder field
// still resolves to her registered Site Name — the same lookup claimSlot()
// already does for self-signups — instead of only working when the
// employee signs herself up.
function findEmployeeByName(typedName) {
  const name = (typedName || "").trim().toUpperCase();
  if (!name) return null;
  for (const [staffId, data] of employeesMap.entries()) {
    if (String((data && data.name) || "").trim().toUpperCase() === name) {
      return { staffId, siteName: String((data && data.siteName) || "").trim() };
    }
  }
  return null;
}

// Keeps the auto-added Store Reliever row for one Picker/Encoder staff slot
// in sync with whatever name is currently typed into that slot. Mirrors
// claimSlot's auto-add (site pre-filled from the employee's own registered
// Site Name) so Event Team can see, at a glance, which store needs covering
// and who's covering it — regardless of whether the Pharmacy Assistant
// signed herself up or the admin typed her name in directly. Tagged with
// addedForSlotKey (card+slot position) rather than a staffId, since a typed
// name isn't guaranteed to match a real account.
function syncAutoRelieverForSlot(card, sIdx, typedName) {
  if (!Array.isArray(card.relievers)) card.relievers = [];
  const slotKey = `${card.id}:${sIdx}`;
  const existingIdx = card.relievers.findIndex(s => s.addedForSlotKey === slotKey);
  const match = findEmployeeByName(typedName);
  const siteName = match ? match.siteName : "";

  if (existingIdx !== -1) {
    // Only touch it while it's still unfilled — if another Pharmacy
    // Assistant already claimed the reliever slot, leave it be even if the
    // Picker/Encoder name later changes.
    if ((card.relievers[existingIdx].name || "").trim()) return;
    if (!siteName) {
      card.relievers.splice(existingIdx, 1);
    } else {
      card.relievers[existingIdx].site = siteName;
      card.relievers[existingIdx].addedForStaffId = match.staffId;
    }
    return;
  }
  if (siteName) {
    card.relievers.push({
      label: "PHARMACY ASSISTANT",
      name: "",
      site: siteName,
      addedForStaffId: match.staffId,
      addedForSlotKey: slotKey
    });
  }
}

function startEmployeesListener() {
  onSnapshot(employeesCollRef, snap => {
    const map = new Map();
    snap.forEach(d => map.set(d.id, d.data() || {}));
    employeesMap = map;
    renderLeaderboard(lastScheduleCardsForLeaderboard);
    // The account this map no longer contains might still be sitting in a
    // signed-up slot on the live roster (admin deleted the account, but
    // nothing ever told the schedule to let go of it). Every time the
    // employees collection changes — including a deletion — re-check every
    // claimed slot and free the ones whose staffId no longer has an account.
    clearSlotsForDeletedEmployees(map);
    // If the employee currently viewing this page is the one who just got
    // deleted, don't leave them sitting on a page for an account that no
    // longer exists — send them to the same login page/message
    // employee-login.html already shows when it's opened with ?deleted=1.
    if (employeeSession && employeesSnapshotSeen) {
      const myId = (employeeSession.staffId || "").trim().toLowerCase();
      if (myId && !map.has(myId)) {
        try {
          localStorage.removeItem("pdEmployeeSession");
          sessionStorage.removeItem("pdEmployeeSession");
        } catch (e) { /* best-effort */ }
        window.location.href = "employee-login.html?deleted=1";
        return;
      }
    }
    employeesSnapshotSeen = true;
  });
}

// Reads the live roster, clears any slot whose filledByStaffId isn't in
// currentEmployeesMap anymore (account was deleted), and pushes the fix
// straight to Firestore so every open admin/employee view updates itself —
// same as deleteSiteFromRemote/deleteDateFromRemote, no button needed.
// Slots an admin filled in by typing a plain name (no filledByStaffId)
// are untouched; only self-claimed slots tied to a real account are checked.
async function clearSlotsForDeletedEmployees(currentEmployeesMap) {
  try {
    const snap = await getDoc(scheduleDocRef);
    const data = snap.exists() ? snap.data() : { cards: [] };
    const remoteCards = Array.isArray(data.cards) ? data.cards : [];
    let changed = false;
    const clearDeleted = list => (list || []).map(slot => {
      const sid = (slot.filledByStaffId || "").trim();
      if (!sid || currentEmployeesMap.has(sid.toLowerCase())) return slot;
      changed = true;
      return { ...slot, name: "", filledByStaffId: null };
    });
    const nextCards = remoteCards.map(card => ({
      ...card,
      staff: clearDeleted(card.staff),
      relievers: clearDeleted(card.relievers)
    }));
    if (!changed) return;
    await setDoc(scheduleDocRef, {
      cards: nextCards,
      sentAt: serverTimestamp(),
      sentBy: data.sentBy || "admin"
    });
  } catch (err) {
    // Best-effort — if this fails (e.g. offline), the next employees
    // snapshot or page load will simply try the cleanup again.
    console.error("Failed to clear deleted employees' slots:", err);
  }
}

// Counts, per staffId, how many role slots (across every site/date, both
// branches) that person has personally signed themselves up for. Only
// self-claimed slots count (slot.filledByStaffId) — names an admin typed in
// manually don't have a staffId and aren't attributable to a participant.
function computeParticipation(allCards) {
  const counts = new Map(); // staffId(lowercase) -> { count, name }
  (allCards || []).forEach(card => {
    [...(card.staff || []), ...(card.relievers || [])].forEach(s => {
      const sid = (s.filledByStaffId || "").trim();
      if (!sid) return;
      const key = sid.toLowerCase();
      const entry = counts.get(key) || { count: 0, name: s.name || "" };
      entry.count += 1;
      if ((s.name || "").trim()) entry.name = s.name;
      counts.set(key, entry);
    });
  });
  return counts;
}

function leaderboardBranchTag(branch) {
  const upper = String(branch || "").toUpperCase();
  if (upper === "SOUTH") return `<span class="tag tag-south">South</span>`;
  if (upper === "NORTH") return `<span class="tag tag-north">North</span>`;
  return `<span class="tag tag-other">—</span>`;
}

function podiumCardHtml(row, place) {
  const badge = place === 1 ? "🥇" : place === 2 ? "🥈" : "🥉";
  return `
    <div class="podium-card place-${place}">
      <div class="podium-badge">${badge}</div>
      <div class="podium-name">${escapeHtml(row.name)}</div>
      <div class="podium-meta">
        ${leaderboardBranchTag(row.branch)}
        <span class="tag tag-role">${escapeHtml(row.team)}</span>
      </div>
      <div class="podium-count">${row.count} sign-up${row.count === 1 ? "" : "s"}</div>
    </div>
  `;
}

function deptBoardHtml(deptLabel, rows) {
  const items = rows.length
    ? rows.map((row, i) => `
        <li class="dept-row">
          <span class="dept-rank">#${i + 1}</span>
          <span class="dept-name">${escapeHtml(row.name)}</span>
          ${leaderboardBranchTag(row.branch)}
          <span class="dept-count">${row.count}</span>
        </li>
      `).join("")
    : `<li class="dept-empty">No data yet.</li>`;
  return `
    <div class="dept-board">
      <div class="dept-board-title">${escapeHtml(deptLabel)}</div>
      <ul class="dept-list">${items}</ul>
    </div>
  `;
}

function renderLeaderboard(allCards) {
  lastScheduleCardsForLeaderboard = allCards || [];
  const section = document.getElementById("leaderboardSection");
  if (!section || !employeeSession) return;
  section.style.display = "";

  const counts = computeParticipation(lastScheduleCardsForLeaderboard);
  const rows = [...counts.entries()].map(([staffId, info]) => {
    const emp = employeesMap.get(staffId);
    const { team, branch } = emp ? splitDepartmentClient(emp.department) : { team: "—", branch: "—" };
    return {
      staffId,
      name: (emp && emp.name) || info.name || staffId.toUpperCase(),
      count: info.count,
      team,
      branch
    };
  }).sort((a, b) => b.count - a.count);

  if (!rows.length) {
    section.innerHTML = `
      <div class="leaderboard-wrap">
        <h2 class="leaderboard-title">🏆 Most Participate Employee</h2>
        <p class="leaderboard-empty">No one has signed up yet. Be the first — sign up for an open slot below!</p>
      </div>
    `;
    return;
  }

  const top3 = rows.slice(0, 3);
  const podiumHtml = top3.map((row, i) => podiumCardHtml(row, i + 1)).join("");

  const DEPTS = ["IT", "BILLING", "PHARMACIST", "Pharmacy Assistant"];
  const deptBoardsHtml = DEPTS.map(dept => {
    const deptRows = rows.filter(r => r.team.toUpperCase() === dept.toUpperCase()).slice(0, 3);
    return deptBoardHtml(dept, deptRows);
  }).join("");

  section.innerHTML = `
    <div class="leaderboard-wrap">
      <h2 class="leaderboard-title">🏆 Most Participate Employee</h2>
      <p class="leaderboard-sub">Based on the number of slots personally signed up for, South &amp; North Caloocan.</p>
      <div class="podium">${podiumHtml}</div>
      <div class="dept-boards">${deptBoardsHtml}</div>
    </div>
  `;
}

document.querySelectorAll("#regionFilter .filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    currentFilter = btn.dataset.filter;
    document.querySelectorAll("#regionFilter .filter-btn").forEach(b => b.classList.toggle("active", b === btn));
    render();
