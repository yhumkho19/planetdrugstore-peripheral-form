<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Deployment Roster — Medical &amp; People's Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EEF1FA;
    --surface: #FFFFFF;
    --surface-dim: #F2F4FC;
    --ink: #16204A;
    --ink-muted: #6B7290;
    --ink-faint: #9AA1C4;
    --border: #E6E9F7;
    --south: #0B7A5C;
    --south-soft: #DCF1E7;
    --north: #C3720E;
    --north-soft: #FBEAD2;
    --other: #6D4AC7;
    --other-soft: #ECE5FB;
    --danger: #E5484D;
    --danger-soft: #FDE7E8;
    --ok: #1AAE6F;
    --ok-soft: #DFF6EB;
    --stamp: #C13A2C;
    --stamp-ink: #FDF3E9;
    --signal: #2F6FED;
    --signal-soft: #E7EFFE;
    --signal-dark: #1D4FBF;
    --sidebar-bg: #101B3D;
    --sidebar-bg-hi: #16224A;
    --sidebar-ink: #AFB7DE;
    --sidebar-ink-dim: #6C74A0;
    --stat-blue: #2F6FED;
    --stat-blue-soft: #E7EFFE;
    --stat-green: #1AAE6F;
    --stat-green-soft: #DFF6EB;
    --stat-purple: #8B5CF6;
    --stat-purple-soft: #EFE7FE;
    --radius-sm: 10px;
    --radius-md: 16px;
    --radius-lg: 20px;
    --shadow-xs: 0 1px 2px rgba(22,32,74,.06);
    --shadow-sm: 0 2px 10px rgba(22,32,74,.07), 0 1px 2px rgba(22,32,74,.05);
    --shadow-md: 0 10px 28px -10px rgba(22,32,74,.16), 0 2px 8px -1px rgba(22,32,74,.06);
    --shadow-lg: 0 24px 48px -16px rgba(22,32,74,.24), 0 4px 10px -2px rgba(22,32,74,.1);
    --shadow-press: 0 1px 3px rgba(22,32,74,.08);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', 'IBM Plex Sans', Arial, sans-serif;
    font-size: 14px;
  }
  body {
    position: relative;
  }

  /* ---------- App shell: sidebar + main area ---------- */
  .app-shell { display: flex; min-height: 100vh; }
  .sidebar {
    flex-shrink: 0;
    width: 236px;
    background: var(--sidebar-bg);
    color: var(--sidebar-ink);
    display: flex;
    flex-direction: column;
    padding: 22px 16px;
    position: sticky;
    top: 0;
    height: 100vh;
  }
  .sidebar-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 4px 8px 22px;
    margin-bottom: 10px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .sidebar-logo .mark {
    width: 34px; height: 34px;
    border-radius: 10px;
    background: linear-gradient(145deg, var(--signal), #6D4AC7);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Fraunces', serif;
    font-weight: 700;
    color: #fff;
    font-size: 15px;
    flex-shrink: 0;
  }
  .sidebar-logo .label {
    font-weight: 700;
    font-size: 14.5px;
    line-height: 1.25;
    color: #fff;
  }
  .sidebar-nav {
    display: flex;
    flex-direction: column;
    gap: 3px;
    flex: 1;
  }
  .sidebar-nav a {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 10px 12px;
    border-radius: 10px;
    color: var(--sidebar-ink);
    text-decoration: none;
    font-size: 13.5px;
    font-weight: 500;
    transition: background-color .15s ease, color .15s ease;
  }
  .sidebar-nav a .ic { font-size: 15px; width: 18px; text-align: center; flex-shrink: 0; }
  .sidebar-nav a:hover { background: rgba(255,255,255,0.06); color: #fff; }
  .sidebar-nav a.active { background: var(--signal); color: #fff; box-shadow: 0 4px 12px -3px rgba(47,111,237,.6); }
  .sidebar-foot {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 10px 4px;
    border-top: 1px solid rgba(255,255,255,0.08);
    color: var(--sidebar-ink-dim);
    font-size: 11px;
    line-height: 1.5;
    font-style: italic;
  }

  .main-area { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px clamp(16px, 3vw, 36px);
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 40;
  }
  .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .content-scroll { padding: 4px clamp(16px, 3vw, 36px) 64px; max-width: 1440px; }

  /* ---------- Mobile nav (hamburger + off-canvas sidebar) ---------- */
  .menu-toggle {
    display: none;
    align-items: center;
    justify-content: center;
    width: 42px;
    height: 42px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface);
    box-shadow: var(--shadow-xs);
    cursor: pointer;
    flex-shrink: 0;
    font-size: 18px;
    color: var(--ink);
  }
  .menu-toggle:hover { border-color: var(--ink-faint); }
  .sidebar-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(16,27,61,0.45);
    z-index: 199;
  }
  .sidebar-close {
    display: none;
  }
  @media (max-width: 900px) {
    .menu-toggle { display: inline-flex; }
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      z-index: 200;
      transform: translateX(-100%);
      transition: transform .22s ease;
      box-shadow: var(--shadow-lg);
    }
    .sidebar.open { transform: translateX(0); }
    .sidebar-backdrop.open { display: block; }
    .sidebar-close {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border-radius: 8px;
      border: none;
      background: rgba(255,255,255,0.08);
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      margin-left: auto;
    }
    .sidebar-close:hover { background: rgba(255,255,255,0.16); }
  }
  body.is-ready { animation: page-in 0.5s ease both; }
  @keyframes page-in {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
  }
  :focus-visible { outline: 2px solid var(--south); outline-offset: 2px; }

  /* ---------- Header ---------- */
  .page-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 20px;
    margin-bottom: 24px;
    padding-bottom: 0;
    border-bottom: none;
    position: relative;
  }
  .page-head h1 {
    font-family: 'Inter', sans-serif;
    font-weight: 800;
    font-size: clamp(24px, 2.8vw, 32px);
    margin: 0 0 4px;
    letter-spacing: -0.02em;
    line-height: 1.15;
    color: var(--ink);
  }
  .page-head p {
    margin: 0;
    color: var(--ink-muted);
    font-size: 13.5px;
    font-style: normal;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
  }
  .stats {
    display: flex;
    align-items: stretch;
    flex-wrap: wrap;
    gap: 12px;
    font-family: 'Inter', sans-serif;
  }
  .stats .stat {
    display: flex;
    align-items: center;
    gap: 10px;
    text-align: left;
    padding: 12px 18px;
    position: relative;
    background: var(--surface);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-sm);
    flex: 1 1 auto;
    min-width: 0;
  }
  .stats .stat::before {
    content: "🗂️";
    width: 38px; height: 38px;
    border-radius: 50%;
    background: var(--stat-blue-soft);
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
    flex-shrink: 0;
  }
  .stats .stat.warn::before { content: "👥"; background: var(--stat-green-soft); }
  .stats .stat.good::before { content: "✅"; background: var(--stat-purple-soft); }
  .stats .stat .num {
    display: block;
    font-size: 22px;
    font-weight: 800;
    line-height: 1.1;
    color: var(--ink);
  }
  .stats .stat.warn .num { color: var(--ink); }
  .stats .stat.good .num { color: var(--ink); }
  .stats .stat .cap {
    color: var(--ink-faint);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-size: 9.5px;
    font-weight: 600;
    margin-top: 2px;
    display: block;
  }

  /* ---------- Toolbar ---------- */
  .toolbar {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
    align-items: center;
  }
  .region-filter {
    display: flex;
    gap: 4px;
    margin-bottom: 18px;
    flex-wrap: wrap;
    background: var(--surface);
    padding: 5px;
    border-radius: 999px;
    width: fit-content;
    box-shadow: var(--shadow-sm);
  }
  .filter-btn {
    font-family: 'Inter', sans-serif;
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: 0.01em;
    padding: 8px 18px;
    border-radius: 999px;
    cursor: pointer;
    border: none;
    background: transparent;
    color: var(--ink-muted);
  }
  .filter-btn { transition: background-color .15s ease, color .15s ease, box-shadow .15s ease; }
  .filter-btn:hover { color: var(--ink); }
  .filter-btn.active { color: #fff; box-shadow: var(--shadow-xs); }
  .filter-btn.active[data-filter="all"] { background: var(--ink); }
  .filter-btn.active[data-filter="south"] { background: var(--south); }
  .filter-btn.active[data-filter="north"] { background: var(--north); }
  .btn {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    padding: 10px 16px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink);
    box-shadow: var(--shadow-xs);
    transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease, background-color .12s ease;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-sm); border-color: var(--ink-faint); }
  .btn:active { transform: translateY(0); box-shadow: var(--shadow-press); }
  .btn:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
  .btn.primary {
    background: linear-gradient(180deg, #4C87F5, var(--signal) 65%);
    border-color: var(--signal-dark);
    color: #fff;
    box-shadow: 0 4px 12px -3px rgba(47,111,237,.5);
  }
  .btn.primary:hover { box-shadow: 0 6px 16px -3px rgba(47,111,237,.55); border-color: var(--signal-dark); }
  .btn.danger-outline { color: var(--danger); border-color: rgba(229,72,77,.35); }
  .btn.danger-outline:hover { background: var(--danger-soft); border-color: var(--danger); }
  .btn.ghost {
    box-shadow: none;
    border-color: transparent;
    background: transparent;
    color: var(--ink-muted);
  }
  .btn.ghost:hover { border-color: var(--border); color: var(--ink); background: var(--surface); box-shadow: none; transform: none; }

  /* ---------- Grid ---------- */
  .grid {
    display: flex;
    flex-direction: column;
    gap: 28px;
    margin-top: 8px;
  }
  .bracket-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
    gap: 22px 18px;
  }

  /* ---------- Date bracket (admin) ---------- */
  .bracket-head {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 2px solid var(--ink);
  }
  .bracket-date {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 18px;
    letter-spacing: -0.01em;
  }
  .bracket-count {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--ink-faint);
    background: var(--surface-dim);
    border: 1px solid var(--border);
    padding: 3px 9px;
    border-radius: 12px;
  }
  .bracket-add-btn {
    font-size: 12px;
    padding: 6px 12px;
    border-radius: var(--radius-sm);
    box-shadow: var(--shadow-xs);
  }
  .bracket-actions {
    margin-left: auto;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .bracket-actions .btn {
    font-size: 12px;
    padding: 6px 12px;
  }

  /* ---------- Date tabs (employee) ---------- */
  .date-tabs {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 22px;
  }
  .date-tab {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    padding: 9px 16px;
    border-radius: 999px;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink-muted);
    box-shadow: var(--shadow-xs);
  }
  .date-tab { transition: background-color .15s ease, border-color .15s ease, color .15s ease, box-shadow .15s ease; }
  .date-tab:hover { border-color: var(--ink-faint); color: var(--ink); box-shadow: var(--shadow-sm); }
  .date-tab.active { background: var(--ink); border-color: var(--ink); color: #fff; box-shadow: var(--shadow-sm); }
  .date-tab { display: inline-flex; align-items: center; gap: 7px; }
  .date-tab.has-open:not(.active) { border-color: var(--danger); color: var(--danger); }
  .tab-badge {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 10px;
    background: var(--danger-soft);
    color: var(--danger);
  }
  .date-tab.active .tab-badge { background: rgba(255,255,255,0.18); color: #fff; }
  .tab-badge.ok { background: var(--ok-soft); color: var(--ok); }
  .date-tab.active .tab-badge.ok { background: rgba(255,255,255,0.18); color: #fff; }
  .branch-marker {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    padding: 3px 7px;
    border-radius: 999px;
    background: #e8eefc;
    color: #28539a;
    white-space: nowrap;
  }
  .branch-marker.south { background: #fff0d8; color: #965b00; }
  .date-tab.active .branch-marker { background: rgba(255,255,255,0.2); color: #fff; }
  .branch-container {
    grid-column: 1 / -1;
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 14px;
    background: rgba(255,255,255,.65);
  }
  .branch-container + .branch-container { margin-top: 18px; }
  .branch-container-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0 0 12px;
    font-weight: 800;
    letter-spacing: .04em;
    text-transform: uppercase;
  }
  .branch-container-head.north { color: #28539a; }
  .branch-container-head.south { color: #965b00; }
  .branch-container-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 22px 18px; }
  .notification-focus { animation: notificationFocus 2.2s ease; }
  @keyframes notificationFocus { 0%, 100% { box-shadow: var(--shadow-sm); } 20%, 70% { box-shadow: 0 0 0 4px rgba(214,31,44,.35), 0 12px 28px rgba(214,31,44,.22); } }

  .card-status {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 3px 9px;
    border-radius: 20px;
    margin-left: auto;
  }
  .card-status.warn { background: var(--danger-soft); color: var(--danger); }
  .card-status.ok { background: var(--ok-soft); color: var(--ok); }

  .claim-btn {
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 700;
    padding: 7px 16px;
    border-radius: 999px;
    border: 1.5px solid var(--signal);
    background: var(--signal-soft);
    color: var(--signal);
    cursor: pointer;
  }
  .claim-btn:hover { background: var(--signal); color: #fff; }
  .claim-btn:disabled { opacity: 0.6; cursor: default; }
  .claim-btn.blocked {
    border-color: var(--border);
    background: var(--surface-dim);
    color: var(--ink-faint);
  }
  .claim-btn.blocked:hover { background: var(--surface-dim); color: var(--ink-faint); }
  .unclaim-btn {
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 600;
    color: var(--danger);
    background: none;
    border: none;
    text-decoration: underline;
    cursor: pointer;
    padding: 0;
    margin-left: 8px;
  }
  .unclaim-btn:disabled { opacity: 0.6; cursor: default; }

  .unavailable-btn {
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 700;
    color: #fff;
    background: var(--danger);
    border: none;
    border-radius: 999px;
    padding: 6px 12px;
    cursor: pointer;
    margin-left: 8px;
    white-space: nowrap;
  }
  .unavailable-btn:hover { background: #C93338; }
  .unavailable-btn:disabled { opacity: 0.6; cursor: default; }

  .emergency-note {
    display: block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--danger);
    margin-top: 2px;
  }
  .staff-row.emergency { background: var(--danger-soft); margin: 0 -8px; padding: 6px 8px; border-radius: 3px; }
  .emergency-tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: #fff;
    background: var(--danger);
    padding: 2px 7px;
    border-radius: 10px;
    animation: pulse-urgent 1.6s infinite;
    flex-shrink: 0;
  }
  @keyframes pulse-urgent {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.55; }
  }
  .claim-btn.urgent { border-color: var(--danger); background: var(--danger-soft); color: var(--danger); }
  .claim-btn.urgent:hover { background: var(--danger); color: #fff; }

  /* ---------- Urgent banner (unavailable / emergency alerts) ---------- */
  .urgent-banner {
    border: 1.5px solid var(--danger);
    border-radius: 6px;
    background: var(--danger-soft);
    margin-bottom: 18px;
    padding: 12px 16px;
  }
  .urgent-banner-title {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--danger);
    margin: 0 0 8px;
  }
  .urgent-banner-item {
    font-size: 13px;
    color: var(--ink);
    padding: 5px 0;
    border-top: 1px dashed rgba(191,59,44,0.3);
  }
  .urgent-banner-item:first-of-type { border-top: none; }
  .urgent-banner-item strong { color: var(--danger); }

  /* ---------- Card ---------- */
  .site-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    display: flex;
    overflow: visible;
    position: relative;
    box-shadow: var(--shadow-sm);
    transition: box-shadow .18s ease, transform .18s ease;
  }
  .site-card:hover { box-shadow: var(--shadow-md); transform: translateY(-3px); }
  .site-card.is-cancelled:hover { box-shadow: var(--shadow-sm); transform: none; }
  .site-card:focus-within { box-shadow: var(--shadow-md); }
  .accent-bar { display: none; }

  .ticket-number {
    position: absolute;
    top: 14px;
    right: 14px;
    background: var(--surface-dim);
    color: var(--ink-faint);
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.04em;
    padding: 4px 9px;
    border-radius: 20px;
    transform: none;
    box-shadow: none;
    z-index: 2;
  }

  .card-inner {
    flex: 1; padding: 24px 22px 18px; min-width: 0;
    display: grid;
    grid-template-columns: 1fr 190px;
    column-gap: 18px;
    row-gap: 10px;
    grid-template-areas:
      "badge  badge"
      "title  sched"
      "perf   perf"
      "staff  staff"
      "reliever reliever";
    align-items: start;
  }
  .region-line { grid-area: badge; margin-bottom: 0 !important; padding-right: 60px; }
  .locationInput { grid-area: title; margin-bottom: 0 !important; align-self: center; }
  .schedule-row { grid-area: sched; flex-direction: column; margin-bottom: 0 !important; }
  .perforation { grid-area: perf; }
  .staff-section:not(.reliever-section) { grid-area: staff; margin-top: 0 !important; }
  .staff-section.reliever-section { grid-area: reliever; margin-top: 0 !important; }
  @media (max-width: 620px) {
    .card-inner { grid-template-columns: 1fr; grid-template-areas: "badge" "title" "sched" "perf" "staff" "reliever"; }
  }

  .perforation {
    border-top: 1.5px dashed var(--border);
    margin: 14px 0;
  }

  .remove-btn {
    position: absolute;
    top: 10px;

  /* ---------- Empty state ---------- */

  }
  .empty-state .btn { display: inline-flex; }

  /* ---------- Modal (replaces native alert/confirm popups) ---------- */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 1000;
    background: rgba(16,36,30,0.4);
    backdrop-filter: blur(7px) saturate(1.1);
    -webkit-backdrop-filter: blur(7px) saturate(1.1);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    opacity: 0;
    visibility: hidden;
    transition: opacity .2s ease, visibility .2s;
  }
  .modal-overlay.open { opacity: 1; visibility: visible; }
  .modal-box {
    width: 100%; max-width: 380px;
    max-height: calc(100vh - 40px);
    max-height: calc(100dvh - 40px);
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg);
    padding: 26px 24px 22px;
    transform: scale(0.88) translateY(14px);
    opacity: 0;
    transition: transform .34s cubic-bezier(.32,1.56,.64,1), opacity .22s ease;
  }
  .modal-overlay.open .modal-box {
    transform: scale(1) translateY(0);
    opacity: 1;
  }
  .modal-icon {
    width: 46px; height: 46px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 16px;
    background: var(--signal-soft);
    color: var(--signal);
    animation: modal-icon-pop .38s cubic-bezier(.32,1.6,.64,1) .08s both;
    flex: 0 0 auto;
  }
  .modal-icon:empty { display: none; }
  .modal-icon.warn { background: var(--danger-soft); color: var(--danger); }
  .modal-icon.question { background: var(--other-soft); color: var(--other); }
  @keyframes modal-icon-pop {
    from { transform: scale(0.3); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .modal-box p {
    margin: 0 0 22px;
    font-size: 14.5px;
    line-height: 1.55;
    color: var(--ink);
    white-space: pre-line;
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; flex: 0 0 auto; flex-wrap: wrap; }
  .modal-actions button {
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 10px 18px;
    border-radius: 999px;
    border: 1.5px solid var(--ink);
    background: var(--surface);
    color: var(--ink);
    cursor: pointer;
    transition: transform .1s ease, box-shadow .1s ease, background-color .15s ease;
  }
  .modal-actions button:hover { background: var(--surface-dim); transform: translateY(-1px); }
  .modal-actions button.primary {
    background: linear-gradient(180deg, #1E63B4, var(--signal) 65%);
    border-color: var(--signal-dark);
    color: #fff;
    box-shadow: 0 6px 14px -4px rgba(24,87,166,.5);
  }
  .modal-actions button.primary:hover { opacity: 0.92; transform: translateY(-1px); }

  /* ---------- Planet Drugstore visual theme ---------- */
  :root {
    --bg: #FAF6F5;
    --surface: #FFFFFF;
    --surface-dim: #FFF1F1;
    --ink: #2A1416;
    --ink-muted: #7A5B5D;
    --ink-faint: #B58D90;
    --border: #E6D5D6;
    --signal: #D61F2C;
    --signal-dark: #A5151F;
    --signal-soft: #FBE7E9;
    --danger: #D61F2C;
    --danger-soft: #FBE7E9;
    --ok: #1F8A4C;
    --ok-soft: #E3F4E9;
    --sidebar-bg: #3D0A10;
    --sidebar-bg-hi: #6E1620;
    --sidebar-ink: #F6DADC;
    --sidebar-ink-dim: #D7AEB1;
    --stat-blue: #D61F2C;
    --stat-blue-soft: #FBE7E9;
    --stat-green: #1F8A4C;
    --stat-green-soft: #E3F4E9;
    --stat-purple: #A5151F;
    --stat-purple-soft: #FBE7E9;
  }
  body {
    background:
      radial-gradient(900px 420px at 100% -10%, rgba(214,31,44,.10), transparent 60%),
      var(--bg);
    font-family: 'Inter', 'Segoe UI', Roboto, Arial, sans-serif;
    color: var(--ink);
  }

<script type="module">
// ---------- Update/version check ----------
// This page is a single static HTML file served with no per-deploy hashed
// filename, so a browser (or a CDN/proxy in front of the host) that cached
// an old copy has no natural reason to notice a new one was uploaded. The
// Cache-Control meta tags in <head> ask browsers not to cache this page at
// all, but that's only advisory. This is the reliable fix: bump
// APP_VERSION any time a new version of this file is uploaded. Every open
// tab then periodically re-fetches this same page with cache forcibly
// bypassed, reads the APP_VERSION embedded in that fresh copy, and — if it
// doesn't match what this tab is currently running — shows a small banner
// instead of silently staying on stale code.
const APP_VERSION = "2026-09-13.1";
function startVersionWatch() {
  async function checkForUpdate() {
    try {
      const res = await fetch(location.pathname + "?v=" + Date.now(), { cache: "no-store" });
      if (!res.ok) return;
      const text = await res.text();
      const match = text.match(/const APP_VERSION = "([^"]+)"/);
      if (match && match[1] !== APP_VERSION) {
        window.location.replace("update-waiting.html?next=" + encodeURIComponent(location.pathname) + "&version=" + encodeURIComponent(match[1]));
      }
    } catch (err) {
      // Offline or a network hiccup — just try again on the next tick.
    }
  }
  function showUpdateBanner() {
    if (document.getElementById("updateBanner")) return;
    const bar = document.createElement("div");
    bar.id = "updateBanner";
    bar.style.cssText =
      "position:fixed;top:0;left:0;right:0;z-index:9999;background:#1F2937;color:#fff;" +
      "padding:10px 16px;font:600 14px/1.4 Inter,sans-serif;display:flex;gap:12px;" +
      "align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.2);";
    bar.innerHTML =
      `<span>May bagong bersyon ng page na available.</span>` +
      `<button type="button" id="updateBannerBtn" style="background:#fff;color:#1F2937;border:none;` +
      `border-radius:6px;padding:6px 14px;font:600 13px/1 Inter,sans-serif;cursor:pointer;">I-refresh ngayon</button>`;
    document.body.prepend(bar);
    document.getElementById("updateBannerBtn").addEventListener("click", () => {
      // Generic guard: only files that track unsaved local edits define
      // `hasUnsavedChanges` — for everything else this simply reloads.
      if (typeof hasUnsavedChanges !== "undefined" && hasUnsavedChanges) {
        if (!confirm("May unsaved changes ka pa. Sigurado ka bang mag-refresh?")) return;
      }
      location.reload();
    });
  }
  checkForUpdate();
  setInterval(checkForUpdate, 5 * 1000);
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") checkForUpdate();
  });
}
startVersionWatch();

// ---------- In-page modal (replaces native alert()/confirm()) ----------
const appModal = document.getElementById("appModal");
const appModalMessage = document.getElementById("appModalMessage");
const appModalActions = document.getElementById("appModalActions");
const appModalIcon = document.getElementById("appModalIcon");

function closeModal() {
  appModal.classList.remove("open");
  appModalActions.innerHTML = "";
}

// Sets the little animated badge above the modal text. "kind" controls both
// the glyph and the color: "ok" (default, checkmark) for plain confirmations,
// "warn" (!) for failures/destructive actions, "question" (?) for yes/no
// prompts, "date" (📅) for the date picker. Re-triggers the pop-in animation
// each time so repeat modals (e.g. two alerts in a row) still animate.
function setModalIcon(kind) {
  const glyphs = { ok: "✓", warn: "!", question: "?", date: "📅" };
  appModalIcon.textContent = glyphs[kind] || glyphs.ok;
  appModalIcon.className = "modal-icon" + (kind === "warn" || kind === "question" ? " " + kind : "");
  appModalIcon.style.animation = "none";
  void appModalIcon.offsetWidth;
  appModalIcon.style.animation = "";
}

function showAlert(message, kind, siteTarget) {
  return new Promise(resolve => {
    setModalIcon(kind || (/fail|error|can'?t|cannot/i.test(message) ? "warn" : "ok"));
    appModalMessage.textContent = message;
    appModalActions.innerHTML = "";
    const okBtn = document.createElement("button");
    okBtn.className = "primary";
    okBtn.textContent = "OK";
    okBtn.addEventListener("click", () => { closeModal(); resolve(); });
    appModalActions.appendChild(okBtn);
    if (siteTarget && siteTarget.cardId) {
      const viewBtn = document.createElement("button");
      viewBtn.className = "secondary";
      viewBtn.textContent = "View assigned site";
      viewBtn.addEventListener("click", () => {
        closeModal();
        const tab = document.querySelector(`.date-tab[data-datekey="${escapeAttr(siteTarget.date || "")}"]`);
        if (tab && !tab.classList.contains("active")) tab.click();
        setTimeout(() => {
          const card = document.querySelector(`.site-card[data-card-id="${escapeAttr(siteTarget.cardId)}"]`);
          if (!card) return;
          card.scrollIntoView({ behavior: "smooth", block: "center" });
          card.classList.add("notification-focus");
          setTimeout(() => card.classList.remove("notification-focus"), 2200);
        }, 80);
        resolve();
      });
      appModalActions.appendChild(viewBtn);
    }
    appModal.classList.add("open");
    okBtn.focus();
  });
}

function showConfirm(message) {
  return new Promise(resolve => {
    setModalIcon(/undone|remove|delete|unavailable/i.test(message) ? "warn" : "question");
    appModalMessage.textContent = message;
    appModalActions.innerHTML = "";
    const cancelBtn = document.createElement("button");
    cancelBtn.textContent = "Cancel";
    cancelBtn.addEventListener("click", () => { closeModal(); resolve(false); });
    const okBtn = document.createElement("button");
    okBtn.className = "primary";
    okBtn.textContent = "Confirm";
    okBtn.addEventListener("click", () => { closeModal(); resolve(true); });
    appModalActions.appendChild(cancelBtn);
    appModalActions.appendChild(okBtn);
    appModal.classList.add("open");
    okBtn.focus();
  });
}

// Prompts for a single date, used to create a new date-event bracket (or
// edit an existing one's date, when a different confirmBtnLabel is passed).
// Resolves to the chosen ISO date string, or null if cancelled/empty.
function showDatePrompt(message, defaultIso, confirmBtnLabel) {
  return new Promise(resolve => {
    setModalIcon("date");
    appModalMessage.innerHTML = `
      <div style="margin-bottom:14px;">${escapeHtml(message)}</div>

    `;
    appModalActions.innerHTML = "";
    const cancelBtn = document.createElement("button");
    cancelBtn.textContent = "Cancel";
    cancelBtn.addEventListener("click", () => { closeModal(); resolve(null); });
    const okBtn = document.createElement("button");
    okBtn.className = "primary";
    okBtn.textContent = confirmBtnLabel || "Create bracket";
    okBtn.addEventListener("click", () => {
      const input = document.getElementById("datePromptInput");
      const val = input ? input.value : "";
      closeModal();
      resolve(val || null);
    });
    appModalActions.appendChild(cancelBtn);
    appModalActions.appendChild(okBtn);
    appModal.classList.add("open");
    setTimeout(() => document.getElementById("datePromptInput") && document.getElementById("datePromptInput").focus(), 30);
  });
}

// "+ Add date event" used to only ask for the date, leaving branch, mission
// type, and site name to be filled in afterward on the new (blank) card
// before it was really ready to Send. Event Team asked for all of that up
// front instead — branch right under the date picker, plus mission type and
// site name — so a new bracket is fully filled in and can just be sent with

function showAddDateEventPrompt() {
  return new Promise(resolve => {
    setModalIcon("date");

        <option value="other">Custom…</option>
      </select>
      <input type="text" id="addEventRegionCustomInput" placeholder="Area name" style="${fieldInput}margin-top:8px;display:none;">

      <label style="${fieldLabel}">Event type</label>
      <select id="addEventMissionSelect" style="${fieldInput}">
        <option value="medical">Medical Mission</option>
        <option value="peoples_day">People's Day</option>
      </select>

      <label style="${fieldLabel}">Site name</label>
      <input type="text" id="addEventLocationInput" placeholder="e.g. Brgy. 91 Hall" style="${fieldInput}">
    `;
    const regionSelect = document.getElementById("addEventRegionSelect");
    const regionCustomInput = document.getElementById("addEventRegionCustomInput");
    regionSelect.addEventListener("change", () => {
      regionCustomInput.style.display = regionSelect.value === "other" ? "" : "none";
    });

    appModalActions.innerHTML = "";
    const cancelBtn = document.createElement("button");
    cancelBtn.textContent = "Cancel";
    cancelBtn.addEventListener("click", () => { closeModal(); resolve(null); });
    const okBtn = document.createElement("button");
    okBtn.className = "primary";
    okBtn.textContent = "Create bracket";
    okBtn.addEventListener("click", async () => {
      const dateVal = document.getElementById("addEventDateInput").value;
      const locationVal = document.getElementById("addEventLocationInput").value.trim();
      if (!dateVal) {
        await showAlert("Please choose a date for the event.", "warn");
        return;
      }
      if (!locationVal) {
        await showAlert("Please enter the site name.", "warn");
        return;
      }
      const result = {
        date: dateVal,
        region: regionSelect.value,
        regionCustom: regionSelect.value === "other" ? document.getElementById("addEventRegionCustomInput").value.trim() : "",
        mission: document.getElementById("addEventMissionSelect").value,
        location: locationVal
      };
      closeModal();
      resolve(result);
    });
    appModalActions.appendChild(cancelBtn);
    appModalActions.appendChild(okBtn);
    appModal.classList.add("open");
    setTimeout(() => document.getElementById("addEventDateInput") && document.getElementById("addEventDateInput").focus(), 30);
  });
}

});

// Employee self-service writes must update the published roster without
// accidentally publishing unrelated pharmacist drafts (such as cancellation).
function publishedCardsWithRosterChanges(data, liveCards) {
  const published = Array.isArray(data.employeeCards) ? data.employeeCards : liveCards;
  const publishedById = new Map(published.map(card => [card.id, card]));
  return liveCards.map(card => {
    const publishedCard = publishedById.get(card.id);
    if (!publishedCard) return card;
    return {
      ...publishedCard,
      staff: card.staff,
      relievers: card.relievers
    };
  });
}
// Same "employees" collection admin-console.html registers accounts into
// (doc id = staffId.toLowerCase(), fields include name/department), read
// here only to resolve each participant's branch + team for the leaderboard.
const employeesCollRef = collection(db, "employees");
// One doc per "employee marked herself unavailable" event. Admin sees these
// as a live bell/badge; matching employees (same branch + team) see them as
// an urgent banner on their own schedule, so a same-day emergency gets

const notificationsCollRef = collection(db, "emergencyNotifications");

// The logged-in employee's session, expected to be set by employee-login.html
// after a successful sign-in, shaped like:
//   { staffId, name, department, branch }  where branch is "south" or "north"
// (branch comes from the Branch field added to employee-signup.html).
// If employee-login.html stores this under a different key/shape, update
// this function to match — that's the only place session lookup happens.
function getEmployeeSession() {
  try {
    const raw = sessionStorage.getItem("pdEmployeeSession") || localStorage.getItem("pdEmployeeSession");
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (!s) return null;
    // Normalize branch casing before checking — the "branch" field comes
    // straight from Firestore as whatever the Admin typed/selected at
    // registration (e.g. "South", "NORTH"), not guaranteed lowercase. A
    // strict === "south"/"north" check here silently returned null for any
    // non-lowercase value, which meant employeeSession was null even for a
    // signed-in employee — breaking not just this page's employee view but
    // also the account-deletion listener below (it only runs when
    // employeeSession is truthy).
    const normalizedBranch = String(s.branch || "").trim().toLowerCase();
    if (normalizedBranch !== "south" && normalizedBranch !== "north") return null;
    s.branch = normalizedBranch;
    return s;
  } catch (e) { return null; }
}

// ---------- Leave-slot / Not-Available daily cutoff ----------
// After this local time each day, employees can no longer tap "Leave slot"
// or "🚨 Not Available" themselves — only the admin can remove them from a
// slot at that point. Change LEAVE_CUTOFF_HOUR / LEAVE_CUTOFF_MINUTE below
// to move the cutoff. Currently set to 8:35 PM for testing — set back to
// 17 / 0 (5:00 PM) for production use.
const LEAVE_CUTOFF_HOUR = 20;   // 24-hour format: 17 = 5:00 PM, 20 = 8:00 PM
const LEAVE_CUTOFF_MINUTE = 35; // 0-59
function isPastLeaveCutoff() {
  const now = new Date();
  const cutoffMinutesOfDay = LEAVE_CUTOFF_HOUR * 60 + LEAVE_CUTOFF_MINUTE;
  const nowMinutesOfDay = now.getHours() * 60 + now.getMinutes();
  return nowMinutesOfDay >= cutoffMinutesOfDay;
}

function roleOptionsHtml(current, listKey) {
