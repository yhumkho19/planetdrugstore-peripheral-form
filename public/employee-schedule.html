document.getElementById("addDateBtn").addEventListener("click", async () => {
  const details = await showAddDateEventPrompt();
  if (!details) return;
  const newCard = blankCard();
  newCard.date = details.date;
  newCard.region = details.region;
  newCard.regionCustom = details.regionCustom;
  newCard.mission = details.mission;
  newCard.location = details.location;
  cards.push(newCard);
  adminSelectedDate = details.date;
  saveCards();
  render();
  addSiteHistory(details.location);
  pushNewCardToRemote(newCard);
});

// Firestore's setDoc rejects any field whose value is literally `undefined`
// (as opposed to null/missing) with "Unsupported field value: undefined".
// Local card/slot objects can pick up such fields over time (e.g. a slot
// shape that only sometimes carries a given property), so anything headed
// to Firestore is swept for undefined values and coerced to null first.
function scrubUndefined(value) {
  if (Array.isArray(value)) return value.map(scrubUndefined);
  if (value && typeof value === "object" && !(value instanceof Date)) {
    const out = {};
    for (const [k, v] of Object.entries(value)) {
      out[k] = v === undefined ? null : scrubUndefined(v);
    }
    return out;
  }
  return value;
}

// Strips fields that should never be pushed to the remote doc: photo data
// (too large, employees don't need it) and the local-only _touched marker
// used by mergeRemoteClaims below.
function stripForRemote(cardsArr) {
  return cardsArr.map(({ photo, photoName, staff, relievers, ...rest }) => scrubUndefined({
    ...rest,
    staff: (staff || []).map(({ _touched, ...s }) => s),
    relievers: (relievers || []).map(({ _touched, ...s }) => s)
  }));
}

// Admin edits happen on a local copy that isn't live-synced with Firestore,
// so if an employee signs herself up for an open slot after the admin last
// loaded the page, a plain overwrite (Send / Update) would silently erase
// that signup. Before pushing, for every slot the admin did NOT touch this
// session, if it's blank locally but remote shows an employee already
// claimed it, keep the remote value instead of blanking it out.
function mergeRemoteClaims(localCards, remoteCards) {
  const remoteById = new Map(remoteCards.map(c => [c.id, c]));
  const mergeList = (localList, remoteList) => (localList || []).map((slot, sIdx) => {
    if (slot._touched) return slot;
    const remoteSlot = (remoteList || [])[sIdx];
    if (!remoteSlot) return slot;
    if (!(slot.name || "").trim() && remoteSlot.filledByStaffId && (remoteSlot.name || "").trim()) {
      return { ...slot, name: remoteSlot.name, filledByStaffId: remoteSlot.filledByStaffId };
    }
    return slot;
  });
  return localCards.map(card => {
    const remoteCard = remoteById.get(card.id);
    if (!remoteCard) return card;
    return {
      ...card,
      staff: mergeList(card.staff, remoteCard.staff),
      relievers: mergeList(card.relievers, remoteCard.relievers)
    };
  });
}

// A card's "branch" for comparison purposes: for "other"/custom areas the
// typed area name is what actually identifies the branch, so two "other"
// cards only count as the same branch if the custom text also matches.
function effectiveRegionKey(card) {
  return card.region === "other"
    ? "other:" + String(card.regionCustom || "").trim().toLowerCase()
    : String(card.region || "");
}

// If the admin switches a site's branch/region (e.g. North Caloocan ->
// South Caloocan) and then pushes that change, the old Event Team roster no
// longer belongs to this card at all — leaving the old names in place would
// show South Caloocan staff who never signed up for it, and silently
// dropping them with no explanation would just confuse whoever was signed
// in. So for every local card whose region no longer matches what's
// currently live on the remote doc: wipe every staff/reliever slot back to
// empty, and queue a "branchChanged" notification for anyone who had
// actually self-signed into a slot there (identified by filledByStaffId —
// a name the admin merely typed by hand has no account to notify). Slots
// are marked _touched so mergeRemoteClaims (which runs right after this)
// doesn't quietly re-fill them from the old remote data. Returns the list
// of notification payloads to file once the push itself succeeds.
function applyRegionChangeClearing(localCardsSubset, remoteCards) {
  const remoteById = new Map(remoteCards.map(c => [c.id, c]));
  const notifyPayloads = [];
  localCardsSubset.forEach(card => {
    const remoteCard = remoteById.get(card.id);
    if (!remoteCard) return;
    if (effectiveRegionKey(remoteCard) === effectiveRegionKey(card)) return;
    ["staff", "relievers"].forEach(listKey => {
      (remoteCard[listKey] || []).forEach(slot => {
        if (slot && slot.filledByStaffId) {
          notifyPayloads.push({
            type: "branchChanged",
            cardId: card.id,
            list: listKey,
            role: slot.label || "",
            location: (listKey === "relievers" && (slot.site || "").trim()) ? slot.site : (remoteCard.location || card.location || "Unnamed site"),
            date: card.date || "",
            time: card.time || "",
            oldRegion: remoteCard.region || "",
            newRegion: card.region || "",
            employeeName: slot.name || "",
            staffId: slot.filledByStaffId,
            createdAt: serverTimestamp(),
            resolved: false
          });
        }
      });
      card[listKey] = (card[listKey] || []).map(slot => ({
        ...slot,
        name: "",
        filledByStaffId: null,
        emergency: false,
        emergencyBy: null,
        emergencyByStaffId: null,
        emergencyAt: null,
        _touched: true
      }));
    });
  });
  return notifyPayloads;
}

// If the admin moves a site to a different event date, or edits its time or
// location, and then pushes that change (Send/Update), everyone who had
// actually self-signed into a slot on that card (identified by
// filledByStaffId — a name the admin merely typed by hand has no account to
// notify) should be told the Event Team changed it, rather than silently
// discovering it next time they open the schedule. Unlike a branch change,
// the slot itself isn't cleared — the employee is still booked, just on the
// new date/time — so this only ever queues a notification, it never touches
// `card`. Returns the list of notification payloads to file once the push
// itself succeeds.
function applyScheduleChangeNotifications(localCardsSubset, remoteCards) {
  const remoteById = new Map(remoteCards.map(c => [c.id, c]));
  const notifyPayloads = [];
  localCardsSubset.forEach(card => {
    const remoteCard = remoteById.get(card.id);
    if (!remoteCard) return; // brand-new card — nothing prior to compare against
    const oldDate = remoteCard.date || "";
    const newDate = card.date || "";
    const oldTime = remoteCard.time || "";
    const newTime = card.time || "";
    const oldLocation = remoteCard.location || "";
    const newLocation = card.location || "";
    const dateChanged = oldDate !== newDate;
    const detailsChanged = !dateChanged && (oldTime !== newTime || oldLocation !== newLocation);
    if (!dateChanged && !detailsChanged) return;
    ["staff", "relievers"].forEach(listKey => {
      (remoteCard[listKey] || []).forEach(slot => {
        if (slot && slot.filledByStaffId) {
          notifyPayloads.push({
            type: dateChanged ? "dateChanged" : "eventUpdated",
            cardId: card.id,
            list: listKey,
            role: slot.label || "",
            location: (listKey === "relievers" && (slot.site || "").trim()) ? slot.site : (newLocation || oldLocation || "Unnamed site"),
            date: newDate,
            time: newTime,
            oldDate: oldDate,
            newDate: newDate,
            region: card.region || "",
            employeeName: slot.name || "",
            staffId: slot.filledByStaffId,
            createdAt: serverTimestamp(),
            resolved: false
          });
        }
      });
    });
  });
  return notifyPayloads;
}

// Lets a logged-in employee claim one open role slot directly, as a single
// Firestore transaction — so two employees tapping the same open slot at
// the same moment can't both "win" it.
async function claimSlot(cardId, listKey, staffIdx, btn) {
  const originalLabel = btn.textContent;
  btn.disabled = true;
  btn.textContent = "Sending…";
  try {
    await runTransaction(db, async (tx) => {
      const snap = await tx.get(scheduleDocRef);
      const data = snap.exists() ? snap.data() : { cards: [] };
      const remoteCards = Array.isArray(data.cards) ? data.cards : [];
      const cIdx = remoteCards.findIndex(c => c.id === cardId);
      if (cIdx === -1) throw new Error("Site not found — try refreshing.");
      if (remoteCards[cIdx].cancelled) throw new Error("This event has been cancelled.");
      const staffArr = (remoteCards[cIdx][listKey] || []).slice();
      const slot = staffArr[staffIdx];
      if (!slot) throw new Error("Role slot not found — try refreshing.");
      if ((slot.name || "").trim()) throw new Error("Someone already signed up here before you. Try refreshing.");
      if (!isRoleAllowedForEmployee(slot.label, listKey)) {
        throw new Error(listKey === "relievers"
          ? "You can't sign up here. Store Reliever duty is for Pharmacy Assistant or Billing employees."
          : `You can't sign up here. This is a "${slot.label}" role only.`);
      }
      const alreadyHasSlot = remoteCards.some(c =>
        (c.staff || []).some(slotBelongsToEmployee) ||
        (c.relievers || []).some(slotBelongsToEmployee)
      );
      if (alreadyHasSlot) throw new Error("You're already signed up for another slot. Leave that one first before signing up here.");

      // Picker/Encoder-Picker (Event Team) duty pulls a Pharmacy Assistant
      // out of her own store, so that store now needs a Store Reliever.
      // Auto-add an open reliever row on this same card, pre-filled with
      // the employee's own registered Site Name (from her employee-signup
      // profile) so admin/other Pharmacy Assistants immediately see which
      // store needs covering — they just need to fill in the name.
      const isStoreAwayRole = listKey === "staff" && roleToTeam(slot.label).toUpperCase() === "PHARMACY ASSISTANT";
      let mySiteName = "";
      if (isStoreAwayRole) {
        const empRef = doc(db, "employees", (employeeSession.staffId || "").trim().toLowerCase());
        const empSnap = await tx.get(empRef);
        if (empSnap.exists()) mySiteName = String(empSnap.data().siteName || "").trim();
      }

      staffArr[staffIdx] = {
        ...slot,
        label: listKey === "relievers"
          ? (splitDepartmentClient(employeeSession.department).team.toUpperCase() === "BILLING"
            ? "BILLING"
            : "PHARMACY ASSISTANT")
          : slot.label,
        relieverDepartment: listKey === "relievers"
          ? splitDepartmentClient(employeeSession.department).team
          : (slot.relieverDepartment || null),
        name: (employeeSession.name || "").toUpperCase(),
        filledByStaffId: employeeSession.staffId,
        emergency: false,
        emergencyBy: null,
        emergencyByStaffId: null,
        emergencyAt: null
      };
      remoteCards[cIdx] = { ...remoteCards[cIdx], [listKey]: staffArr };
      if (isStoreAwayRole && mySiteName) {
        const relieversArr = (remoteCards[cIdx].relievers || []).slice();
        relieversArr.push({
          label: "PHARMACY ASSISTANT",
          name: "",
          site: mySiteName,
          addedForStaffId: employeeSession.staffId
        });
        remoteCards[cIdx] = { ...remoteCards[cIdx], relievers: relieversArr };
      }
      tx.set(scheduleDocRef, {
        cards: scrubUndefined(remoteCards),
        employeeCards: scrubUndefined(publishedCardsWithRosterChanges(data, remoteCards)),
        sentAt: serverTimestamp(),
        sentBy: data.sentBy || "admin"
      });
    });
    // The slot may have been an emergency vacancy — clear any matching
    // open notification now that someone has covered it.
    resolveNotificationsFor(cardId, listKey, staffIdx);
  } catch (err) {
    await showAlert(err.message || "Failed to save. Please try again.");
    btn.disabled = false;
    btn.textContent = originalLabel;
  }
  // On success the onSnapshot listener re-renders with the live result —
  // no local re-render needed here.
}

// Lets a logged-in employee mark herself unavailable for a slot she already
// owns, due to an emergency. This frees the slot back up (like unclaimSlot)
// but tags it "emergency" so admin and other employees see it as urgent —
// and files a notification doc so the admin bell + matching employees'
// banners light up immediately, without anyone needing to refresh.
async function markUnavailable(cardId, listKey, staffIdx, btn) {
  if (isPastLeaveCutoff()) {
    await showAlert("Past today's cutoff — please contact the admin to be removed from this slot.");
    return;
  }
  const originalLabel = btn.textContent;
  btn.disabled = true;
  btn.textContent = "Sending…";
  let notifyPayload = null;
  try {
    await runTransaction(db, async (tx) => {
      const snap = await tx.get(scheduleDocRef);
      const data = snap.exists() ? snap.data() : { cards: [] };
      const remoteCards = Array.isArray(data.cards) ? data.cards : [];
      const cIdx = remoteCards.findIndex(c => c.id === cardId);
      if (cIdx === -1) throw new Error("Site not found — try refreshing.");
      const card = remoteCards[cIdx];
      const staffArr = (card[listKey] || []).slice();
      const slot = staffArr[staffIdx];
      if (!slot) throw new Error("Role slot not found — try refreshing.");
      if (!employeeSession || slot.filledByStaffId !== employeeSession.staffId) {
        throw new Error("This is not your slot.");
      }
      const prevName = slot.name || employeeSession.name || "";
      staffArr[staffIdx] = {
        ...slot,
        name: "",
        filledByStaffId: null,
        emergency: true,
        emergencyBy: prevName,
        emergencyByStaffId: employeeSession.staffId,
        emergencyAt: Date.now()
      };
      remoteCards[cIdx] = { ...card, [listKey]: staffArr };
      // Same cleanup as leaving the slot: her going unavailable means this
      // specific reliever need (tied to her own site) no longer applies —
      // whoever eventually takes the reopened slot will trigger their own.
      if (listKey === "staff" && roleToTeam(slot.label).toUpperCase() === "PHARMACY ASSISTANT") {
        const relieversArr = (remoteCards[cIdx].relievers || []).slice();
        const autoIdx = relieversArr.findIndex(s =>
          s.addedForStaffId === employeeSession.staffId && !(s.name || "").trim()
        );
        if (autoIdx !== -1) {
          relieversArr.splice(autoIdx, 1);
          remoteCards[cIdx] = { ...remoteCards[cIdx], relievers: relieversArr };
        }
      }
      tx.set(scheduleDocRef, {
        cards: scrubUndefined(remoteCards),
        employeeCards: scrubUndefined(publishedCardsWithRosterChanges(data, remoteCards)),
        sentAt: serverTimestamp(),
        sentBy: data.sentBy || "admin"
      });
      notifyPayload = {
        cardId,
        list: listKey,
        staffIdx,
        role: slot.label || "",
        location: (listKey === "relievers" && (slot.site || "").trim()) ? slot.site : (card.location || "Unnamed site"),
        date: card.date || "",
        time: card.time || "",
        region: card.region || "",
        employeeName: prevName,
        staffId: employeeSession.staffId,
        createdAt: serverTimestamp(),
        resolved: false,
        backupName: null,
        backupStaffId: null
      };
    });
    if (notifyPayload) {
      try {
        await addDoc(notificationsCollRef, notifyPayload);
      } catch (notifyErr) {
        // Slot is already freed at this point, so don't block that — but do
        // surface the failure instead of hiding it, since a silent failure
        // here means admin/other employees never get notified.
        console.error("Failed to file emergency notification:", notifyErr);
        await showAlert(
          "You've been marked unavailable and your slot is open again, BUT the alert to the admin/other employees was not sent.\n\n" +
          "Error: " + (notifyErr && notifyErr.message ? notifyErr.message : notifyErr) +
          "\n\nThe \"emergencyNotifications\" collection likely needs to be added to the Firestore Security Rules. Please message the admin right away."
        );
      }
    }
  } catch (err) {
    await showAlert(err.message || "Failed to save. Please try again.");
    btn.disabled = false;
    btn.textContent = originalLabel;
  }
  // On success the onSnapshot listener re-renders with the live result —
  // no local re-render needed here.
}

        );

async function sendAllToEmployees(btn) {

    // Wipe rosters (and queue alerts) for any card whose branch changed
    // since the last push, before merging in newer remote self-signups.
    const branchChangeNotifications = applyRegionChangeClearing(cards, remoteCards);
    // Tell anyone booked on a card whose date/time/location moved, so they
    // find out from a notification instead of noticing on their own later.
    const scheduleChangeNotifications = applyScheduleChangeNotifications(cards, remoteCards);
    const merged = mergeRemoteClaims(cards, remoteCards);
    await setDoc(scheduleDocRef, {
      cards: stripForRemote(merged),
      sentAt: serverTimestamp(),
      sentBy: "admin"
    });
    saveCards();
    render();
    const allChangeNotifications = [...branchChangeNotifications, ...scheduleChangeNotifications];
    let notifFailCount = 0;
    if (allChangeNotifications.length) {
      await Promise.all(allChangeNotifications.map(p =>
        addDoc(notificationsCollRef, p).catch(err => {

// Pushes only one date bracket's cards to the remote doc, leaving whatever
// the remote already has for every other date completely untouched — so an
// edit to one event doesn't clobber another admin's edits on a different
// date.
async function updateDateOnRemote(dateKey, dateLabelForMsg, btn) {
  const originalLabel = btn.textContent;
  btn.disabled = true;
  btn.textContent = "Updating…";
  try {
    const snap = await getDoc(scheduleDocRef);
    const remoteCards = (snap.exists() && Array.isArray(snap.data().cards)) ? snap.data().cards : [];
    const thisDateLocal = cards.filter(c => (c.date || "") === (dateKey || ""));
    // Match by card ID, not by date, when deciding what to drop from the
    // remote doc. If the admin used "Edit date" to move this bracket to a
    // new date, these same cards still exist on the remote doc under their
    // OLD date — filtering "kept" by dateKey alone would never touch that
    // old-dated copy (its date isn't the new dateKey either), leaving a
    // stale duplicate of every re-dated card behind. Excluding by ID
    // guarantees each card we're about to push replaces its one and only
    // remote copy, wherever that copy's date used to be.
    const thisDateLocalIds = new Set(thisDateLocal.map(c => c.id));
    const kept = remoteCards.filter(c => !thisDateLocalIds.has(c.id));
    // Wipe rosters (and queue alerts) for any card in this date whose
    // branch changed since the last push, before merging in newer remote
    // self-signups.
    const branchChangeNotifications = applyRegionChangeClearing(thisDateLocal, remoteCards);
    // Tell anyone booked on a card whose date/time/location moved (e.g. the
    // whole bracket's date was just edited via "Edit date"), so they find
    // out from a notification instead of noticing on their own later.
    const scheduleChangeNotifications = applyScheduleChangeNotifications(thisDateLocal, remoteCards);
    const mergedThisDate = mergeRemoteClaims(thisDateLocal, remoteCards);
    const merged = [...kept, ...stripForRemote(mergedThisDate)];
    await setDoc(scheduleDocRef, {
      cards: merged,
      sentAt: serverTimestamp(),
      sentBy: "admin"
    });
    saveCards();
    render();
    const allChangeNotifications = [...branchChangeNotifications, ...scheduleChangeNotifications];
    let notifFailCount = 0;
    if (allChangeNotifications.length) {
      await Promise.all(allChangeNotifications.map(p =>
        addDoc(notificationsCollRef, p).catch(err => {
          notifFailCount++;
          console.error("Failed to file schedule-change notification:", err);
        })
      ));
    }
    if (notifFailCount > 0) {
      await showAlert(
        `"${dateLabelForMsg}" updated, but ${notifFailCount} employee notification(s) failed to send.\n\n` +
        `The "emergencyNotifications" collection's Firestore Security Rules may not allow the new notification types (dateChanged/eventUpdated). Please check the rules or message the developer.`
      );
    }
    await showAlert(`"${dateLabelForMsg}" updated for employees. Other event dates were left as they were.`);
  } catch (err) {
    await showAlert("Failed to update online: " + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = originalLabel;
  }
}

// Deletion needs to sync out right away too — otherwise employees keep
// seeing a bracket/site the admin already removed until the next
// Send/Update. These push straight to Firestore, no button needed.
async function deleteDateFromRemote(dateKey) {
  try {
    const snap = await getDoc(scheduleDocRef);
    const remoteCards = (snap.exists() && Array.isArray(snap.data().cards)) ? snap.data().cards : [];
    const removedCards = remoteCards.filter(c => (c.date || "") === (dateKey || ""));
    const kept = remoteCards.filter(c => (c.date || "") !== (dateKey || ""));
    if (kept.length === remoteCards.length) return; // wasn't live yet, nothing to remove
    // Anyone who'd actually self-signed into a slot on one of these cards
    // (filledByStaffId — a hand-typed name has no account to notify) needs
    // to be told the whole event date was deleted, not just find their slot
    // silently gone next time they open the schedule.
    const notifyPayloads = [];
    removedCards.forEach(removedCard => {
      ["staff", "relievers"].forEach(listKey => {
        (removedCard[listKey] || []).forEach(slot => {
          if (slot && slot.filledByStaffId) {
            notifyPayloads.push({
              type: "eventDeleted",
              cardId: removedCard.id,
              list: listKey,
              role: slot.label || "",
              location: (listKey === "relievers" && (slot.site || "").trim()) ? slot.site : (removedCard.location || "Unnamed site"),
              date: removedCard.date || "",
              time: removedCard.time || "",
              region: removedCard.region || "",
              employeeName: slot.name || "",
              staffId: slot.filledByStaffId,
              createdAt: serverTimestamp(),
              resolved: false
            });
          }
        });
      });
    });
    await setDoc(scheduleDocRef, {
      cards: kept,
      sentAt: serverTimestamp(),
      sentBy: "admin"
    });
    if (notifyPayloads.length) {
      let notifFailCount = 0;
      await Promise.all(notifyPayloads.map(p =>
        addDoc(notificationsCollRef, p).catch(err => {
          notifFailCount++;
          console.error("Failed to file event-deleted notification:", err);
        })
      ));
      if (notifFailCount > 0) {
        await showAlert(
          `Event deleted, but ${notifFailCount} employee notification(s) failed to send.\n\n` +
          `The "emergencyNotifications" collection's Firestore Security Rules may not allow the "eventDeleted" notification type. Please check the rules or message the developer.`
        );
      }
    }
  } catch (err) {
    await showAlert("Deleted in your browser, but failed to sync online: " + err.message);
  }
}

// Patches a few top-level fields on one existing card straight on the
// remote doc (e.g. cancelled: true/false), leaving every staff/reliever
// signup on that card and every other card completely untouched — same
// "sync immediately, no button needed" pattern as pushNewCardToRemote /
// deleteSiteFromRemote above.
async function pushCardPatchToRemote(cardId, patch, fallbackLocalCard) {
  try {
    const snap = await getDoc(scheduleDocRef);
    const data = snap.exists() ? snap.data() : { cards: [] };
    const remoteCards = Array.isArray(data.cards) ? data.cards : [];
    const cIdx = remoteCards.findIndex(c => c.id === cardId);
    let nextCards;
    let cardBeforePatch = null; // the remote card as it stood before this patch — used below to find who to notify
    if (cIdx === -1) {
      // This card was never "Sent"/"Updated" to Firestore before — append a
      // full copy now (patch applied) instead of silently doing nothing,
      // otherwise the cancel/reinstate would only reach employees the next
      // time someone clicks Send/Update.
      if (!fallbackLocalCard) return;
      nextCards = [...remoteCards, { ...stripForRemote([fallbackLocalCard])[0], ...patch }];
    } else {
      cardBeforePatch = remoteCards[cIdx];
      nextCards = remoteCards.slice();
      nextCards[cIdx] = { ...nextCards[cIdx], ...patch };
    }
    // If this patch toggles "cancelled", tell everyone who'd actually
    // self-signed into a slot on this card (filledByStaffId — a name the
    // admin merely typed by hand has no account to notify) that the Event
    // Team cancelled or reinstated it.
    const notifyPayloads = [];
    if (Object.prototype.hasOwnProperty.call(patch, "cancelled") && cardBeforePatch) {
      const wasCancelled = !!cardBeforePatch.cancelled;
      const nowCancelled = !!patch.cancelled;
      if (wasCancelled !== nowCancelled) {
        ["staff", "relievers"].forEach(listKey => {
          (cardBeforePatch[listKey] || []).forEach(slot => {
            if (slot && slot.filledByStaffId) {
              notifyPayloads.push({
                type: nowCancelled ? "eventCancelled" : "eventReinstated",
                cardId: cardBeforePatch.id,
                list: listKey,
                role: slot.label || "",
                location: (listKey === "relievers" && (slot.site || "").trim()) ? slot.site : (cardBeforePatch.location || "Unnamed site"),
                date: cardBeforePatch.date || "",
                time: cardBeforePatch.time || "",
                region: cardBeforePatch.region || "",
                employeeName: slot.name || "",
                staffId: slot.filledByStaffId,
                createdAt: serverTimestamp(),
                resolved: false
              });
            }
          });
        });
      }
    }
    await setDoc(scheduleDocRef, {
      cards: nextCards,
      sentAt: serverTimestamp(),
      sentBy: data.sentBy || "admin"
    });
    if (notifyPayloads.length) {
      let notifFailCount = 0;
      await Promise.all(notifyPayloads.map(p =>
        addDoc(notificationsCollRef, p).catch(err => {
          notifFailCount++;
          console.error("Failed to file cancel-toggle notification:", err);
        })
      ));
      if (notifFailCount > 0) {
        const actionLabel = patch.cancelled ? "Event cancelled" : "Event reinstated";
        await showAlert(
          `${actionLabel}, but ${notifFailCount} employee notification(s) failed to send.\n\n` +
          `The "emergencyNotifications" collection's Firestore Security Rules may not allow the "eventCancelled"/"eventReinstated" notification types. Please check the rules or message the developer.`
        );
      }
    }
  } catch (err) {
    await showAlert("Saved in your browser, but failed to sync online: " + err.message);
  }
}

      let notifFailCount = 0;
      await Promise.all(notifyPayloads.map(p =>
        addDoc(notificationsCollRef, p).catch(err => {
          notifFailCount++;
          console.error("Failed to file site-removed notification:", err);
        })
      ));
      if (notifFailCount > 0) {
        await showAlert(
          `Site removed, but ${notifFailCount} employee notification(s) failed to send.\n\n` +
          `The "emergencyNotifications" collection's Firestore Security Rules may not allow the "siteRemoved" notification type. Please check the rules or message the developer.`
        );
      }
    }
  } catch (err) {
    await showAlert("Deleted in your browser, but failed to sync online: " + err.message);
  }
}

// New site/date-event cards need to sync out immediately too, same as the
// deletes above — otherwise another admin device (or an employee) won't
// see a newly added site until someone remembers to click Update/Send.
// This only appends the one new card; it never touches anything else
// already on the remote doc, so it can't clobber concurrent edits.
async function pushNewCardToRemote(card) {
  pendingLocalCardIds.add(card.id);
  try {
    const snap = await getDoc(scheduleDocRef);
    const data = snap.exists() ? snap.data() : { cards: [] };
    const remoteCards = Array.isArray(data.cards) ? data.cards : [];
    if (remoteCards.some(c => c.id === card.id)) return; // already synced somehow
    const merged = [...remoteCards, ...stripForRemote([card])];
    await setDoc(scheduleDocRef, {
      cards: merged,
      sentAt: serverTimestamp(),
      sentBy: data.sentBy || "admin"
    });
  } catch (err) {
    await showAlert("Saved in your browser, but failed to sync online: " + err.message);
  } finally {
    // Whether that push just succeeded or failed, it's no longer "in
    // flight" — if it failed, the card genuinely isn't on the server, so
    // the live-sync listener should be free to clean it up like any other
    // orphan instead of protecting it forever.
    pendingLocalCardIds.delete(card.id);
  }
}

// ---------- Emergency notifications (admin bell + employee banner) ----------
// Local cache of ALL emergency notifications (both open and resolved), kept
// in sync by the onSnapshot listener below. Used both to render the
// bell/banner and to find & update the right doc(s) once a slot is refilled.
let latestNotifications = [];

// Instead of deleting the notification once someone signs up to cover the
// slot, mark it resolved and record who backed it up — so the bell panel
// turns it green ("<name> — FOR BACKUP") instead of just vanishing. Admin
// can still permanently dismiss it afterwards via the "Clear" button.
async function resolveNotificationsFor(cardId, listKey, staffIdx) {
  const matches = latestNotifications.filter(n =>
    !n.resolved && n.cardId === cardId && staffIdx === n.staffIdx && (n.list || "staff") === listKey
  );
  for (const n of matches) {
    try {
      await updateDoc(doc(db, "emergencyNotifications", n.id), {
        resolved: true,
        backupName: (employeeSession && employeeSession.name) ? employeeSession.name.toUpperCase() : "",
        backupStaffId: employeeSession ? employeeSession.staffId : null,
        resolvedAt: serverTimestamp()
      });
    } catch (e) { /* best-effort */ }
  }
}

// Manual "Resolved"/"Clear" button in the panel — permanently removes the
// notification doc, whether it's still red (admin handling it outside the
// system) or already green (dismissing it after seeing the backup).
async function resolveNotification(notifId) {
  try {
    await deleteDoc(doc(db, "emergencyNotifications", notifId));
  } catch (err) {
    await showAlert("Failed to clear the notification: " + err.message);
  }
}

function regionLabelFromValue(region) {
  if (region === "south") return "South Caloocan";
  if (region === "north") return "North Caloocan";
  return region || "—";
}

// Shared by admin and employees: bell + badge count + dropdown list of
// emergency vacancies. Unresolved items render red with a "Resolved"
// button; once someone backs up the slot the item turns green and shows
// who covered it, with a "Clear" button to dismiss it for good. Admins get
// every item; employees get only the pre-filtered subset for their own
// branch + team (see getRelevantNotifications below). Badge count only
// tallies still-open (unresolved) items — resolved ones stay visible in
// the panel but don't need action.
function renderNotifPanel(items) {
  const badge = document.getElementById("notifBadge");
  const wrap = document.getElementById("notifWrap");
  const panel = document.getElementById("notifPanel");
  if (!badge || !wrap || !panel) return;
  wrap.style.display = "inline-block";
  const openCount = items.filter(n => !n.resolved).length;
  badge.textContent = String(openCount);
  badge.classList.toggle("show", openCount > 0);
  if (!items.length) {
    panel.innerHTML = `<div class="notif-panel-empty">No emergency notifications.</div>`;
    return;
  }
  panel.innerHTML = items.map(n => {
    const isResolved = !!n.resolved;
    const isRemoved = n.type === "removed";
    const isBranchChanged = n.type === "branchChanged";
    const isDateChanged = n.type === "dateChanged";
    const isEventUpdated = n.type === "eventUpdated";
    const isEventDeleted = n.type === "eventDeleted";
    const isSiteRemoved = n.type === "siteRemoved";
    const isEventCancelled = n.type === "eventCancelled";
    const isEventReinstated = n.type === "eventReinstated";
    const isSlotAssigned = n.type === "slotAssigned";
    const isPersonalNotice = isRemoved || isBranchChanged || isDateChanged || isEventUpdated || isEventDeleted || isSiteRemoved || isEventCancelled || isEventReinstated || isSlotAssigned;
    let title, statusLine, btnLabel;
    if (isRemoved) {
      title = `🔔 You've been removed from this slot`;
      statusLine = `You're free to sign up for another slot now.`;
      btnLabel = "Got it";
    } else if (isBranchChanged) {
      title = `🔔 The event team's branch was changed`;
      statusLine = `Your slot was cleared — you're free to sign up for another slot now.`;
      btnLabel = "Got it";
    } else if (isDateChanged) {
      title = `🔔 The date of this event was changed`;
      statusLine = n.oldDate
        ? `Moved from ${escapeHtml(formatDateDisplay(n.oldDate))} to ${escapeHtml(formatDateDisplay(n.newDate))} by the Event Team. You're still booked — just on the new date.`
        : `This event's date was changed by the Event Team. You're still booked — just on the new date.`;
      btnLabel = "Got it";
    } else if (isEventUpdated) {
      title = `🔔 This event was updated`;
      statusLine = `The Event Team updated the time or location for this slot. You're still booked.`;
      btnLabel = "Got it";
    } else if (isEventDeleted) {
      title = `🔔 This event was deleted`;
      statusLine = `The Event Team deleted this event date — you're free to sign up for another slot now.`;
      btnLabel = "Got it";
    } else if (isSiteRemoved) {
      title = `🔔 This site was removed`;
      statusLine = `The Event Team removed this site from the schedule — you're free to sign up for another slot now.`;
      btnLabel = "Got it";
    } else if (isEventCancelled) {
      title = `🔔 This event was cancelled`;
      statusLine = `The Event Team cancelled this event — you're still on the roster, but there's nothing to show up for unless it's reinstated.`;
      btnLabel = "Got it";
    } else if (isEventReinstated) {
      title = `🔔 This event is back on`;
      statusLine = `The Event Team reinstated this event — you're good to go as scheduled.`;
      btnLabel = "Got it";
    } else if (isSlotAssigned) {
      title = `📌 You were assigned to this event slot`;
      statusLine = `The event team added your name to this role.`;
      btnLabel = "Got it";
    } else if (isResolved) {
      title = `✅ ${escapeHtml(n.backupName || "A teammate")} — FOR BACKUP`;
      statusLine = `Backing up for ${escapeHtml(n.employeeName || "the previous employee")}.`;
      btnLabel = "Clear";
    } else {
      title = `🚨 ${escapeHtml(n.employeeName || "Employee")} — UNAVAILABLE`;
      statusLine = `Needs a replacement.`;
      btnLabel = "Resolved";
    }
    const btnClass = (isPersonalNotice || isResolved) ? "notif-clear-btn" : "notif-resolve-btn";
    return `
    <div class="notif-item ${(isResolved || isPersonalNotice) ? "is-resolved" : ""}">
      <div class="notif-item-title">${title}</div>
      <div class="notif-item-body">
        ${escapeHtml(n.role || "")}${n.list === "relievers" ? " (Store Reliever)" : ""} at ${escapeHtml(n.location || "site")}${n.date ? " — " + escapeHtml(formatDateDisplay(n.date)) : ""}${n.time ? ", " + escapeHtml(n.time) : ""}<br>
        ${isPersonalNotice ? "" : `Region: ${escapeHtml(regionLabelFromValue(n.region))}. `}${statusLine}
      </div>
      <button type="button" class="${btnClass}" data-id="${escapeAttr(n.id)}">${btnLabel}</button>
    </div>`;
  }).join("");
  panel.querySelectorAll(".notif-resolve-btn, .notif-clear-btn").forEach(btn => {
    btn.addEventListener("click", () => resolveNotification(btn.dataset.id));
  });
}

// Admin-only: banner above the schedule listing open emergency vacancies
// across all branches/teams. Employees no longer see this banner — they
// still get the bell — so this bails out immediately on the employee view.
function renderUrgentBanner(items) {
  const banner = document.getElementById("urgentBanner");
  if (!banner) return;
  if (employeeSession) { banner.style.display = "none"; banner.innerHTML = ""; return; }
  const personalTypes = ["removed", "branchChanged", "dateChanged", "eventUpdated", "eventDeleted", "siteRemoved", "eventCancelled", "eventReinstated", "slotAssigned", "siteMoved"];
  const openItems = items.filter(n => !n.resolved && !personalTypes.includes(n.type));
  if (!openItems.length) { banner.style.display = "none"; banner.innerHTML = ""; return; }
  banner.style.display = "block";
  banner.innerHTML = `<p class="urgent-banner-title">🚨 Emergency — needs replacement now</p>` +
    openItems.map(n => `
      <div class="urgent-banner-item">
        <strong>${escapeHtml(n.role || "")}</strong>${n.list === "relievers" ? " (Store Reliever)" : ""} at ${escapeHtml(n.location || "site")}${n.date ? " — " + escapeHtml(formatDateDisplay(n.date)) : ""}${n.time ? ", " + escapeHtml(n.time) : ""}.
        ${escapeHtml(n.employeeName || "An employee")} became unavailable. Sign up below if you can cover.
      </div>
    `).join("");
}

// Admins see every notification (open or resolved). Employees only see the
// ones that match their own branch + team, same as the old employee-only
// banner used to filter — now shared by both the bell panel and the (now
// admin-only) banner. An employee never sees the notification generated by
// their own "Unavailable" click; only other employees (and the admin) are
// notified.
function getRelevantNotifications(items) {
  // "removed"/"branchChanged"/"dateChanged"/"eventUpdated"/"eventDeleted"/
  // "siteRemoved"/"slotAssigned" are all personal, addressed-to-one-employee notices — the
  // admin already knows they made the change, so none of these belong in
  // the Event Team's own bell/panel. Admins still see every open
  // emergency-vacancy ("unavailable") notification.
  const personalTypes = ["removed", "branchChanged", "dateChanged", "eventUpdated", "eventDeleted", "siteRemoved", "eventCancelled", "eventReinstated", "slotAssigned", "siteMoved"];
  if (!employeeSession) {
    return items.filter(n => !personalTypes.includes(n.type));
  }
  const myTeam = splitDepartmentClient(employeeSession.department).team;
  const myStaffId = String(employeeSession.staffId || "").trim().toLowerCase();
  return items.filter(n => {
    // Personal notices are addressed to the one employee whose slot was
    // taken away, moved, updated, or removed entirely — so show them to
    // that employee specifically, regardless of team/branch (unlike
    // "emergency" ones, which broadcast to teammates who could cover the
    // vacancy and never show up for the reporter).
    if (personalTypes.includes(n.type)) {
      return String(n.staffId || "").trim().toLowerCase() === myStaffId;
    }
    return (
      String(n.staffId || "").trim().toLowerCase() !== myStaffId &&
      n.region === employeeSession.branch &&
      roleToTeam(n.role).toUpperCase() === String(myTeam).toUpperCase()
    );
  });
}

function latestPersonalNotifications(items) {
  const personalTypes = ["removed", "branchChanged", "dateChanged", "eventUpdated", "eventDeleted", "siteRemoved", "eventCancelled", "eventReinstated", "slotAssigned", "siteMoved"];
  const latestBySlot = new Map();
  const ordered = [...items].sort((a, b) => {
    const toMillis = value => {
      if (!value) return 0;
      if (typeof value.toMillis === "function") return value.toMillis();
      if (value instanceof Date) return value.getTime();
      const parsed = Date.parse(value);
      return Number.isNaN(parsed) ? 0 : parsed;
    };
    return toMillis(b.createdAt) - toMillis(a.createdAt);
  });
  return ordered.filter(notification => {
    if (!personalTypes.includes(notification.type)) return true;
    // Prefer the exact slot when newer records include staffIdx. The
    // role/location fallback keeps older records from appearing as separate
    // historical states.
    const slot = notification.staffIdx !== undefined
      ? `index:${notification.staffIdx}`
      : `legacy:${notification.role || ""}:${notification.location || ""}`;
    const key = `${notification.cardId || ""}:${notification.list || "staff"}:${slot}`;
    if (latestBySlot.has(key)) return false;
    latestBySlot.set(key, notification);
    return true;
  });
}

// Tracks notification ids we've already alerted the current employee about
// via the pop-up modal, so a notification only interrupts them once (the
// bell panel still lists it after that).
//
// Two trackers, because "first snapshot after page load" is NOT a safe
// signal that the employee has already seen a notification:
//   - seenNotificationIds: in-memory only, resets every reload. Still used
//     to gate broadcast/team "unavailable" vacancy notices, so opening the
//     page doesn't modal-flood the employee with every open vacancy that
//     was already sitting there before this tab opened.
//   - alertedPersonalNotifIds: persisted to localStorage per employee (key
//     includes staffId), because a personal notice — e.g. "you've been
//     removed" — can be filed by the admin while the employee is logged
//     out entirely. With only the in-memory tracker, logging back in made
//     that notification look "already there on first snapshot" and it was
//     silently marked seen without ever alerting — the employee only found
//     out if they happened to open the bell panel manually. Personal
//     notices now always alert once, checked against this persisted set,
//     regardless of whether it's the first snapshot this session.
let seenNotificationIds = null;
const personalNotifTypes = ["removed", "branchChanged", "dateChanged", "eventUpdated", "eventDeleted", "siteRemoved", "eventCancelled", "eventReinstated", "slotAssigned", "siteMoved"];
function alertedPersonalNotifIdsKey() {
  return (employeeSession && employeeSession.staffId)
    ? `pdAlertedPersonalNotifIds_${String(employeeSession.staffId).trim().toLowerCase()}`
    : null;
}
function loadAlertedPersonalNotifIds() {
  const key = alertedPersonalNotifIdsKey();
  if (!key) return new Set();
  try { return new Set(JSON.parse(localStorage.getItem(key) || "[]")); }
  catch (e) { return new Set(); }
}
function saveAlertedPersonalNotifIds(set) {
  const key = alertedPersonalNotifIdsKey();
  if (!key) return;
  try { localStorage.setItem(key, JSON.stringify([...set])); }
  catch (e) { /* storage full/unavailable — non-fatal, the modal already showed */ }
}
let alertedPersonalNotifIds = loadAlertedPersonalNotifIds();

onSnapshot(
  query(notificationsCollRef, orderBy("createdAt", "desc")),
  async snap => {
    const all = [];
    snap.forEach(d => all.push({ id: d.id, ...d.data() }));
    // Keep resolved items too now (they're no longer deleted on cover) so
    // the panel can still show the green "FOR BACKUP" state.
    latestNotifications = all;
    const relevant = latestPersonalNotifications(getRelevantNotifications(latestNotifications));
    renderNotifPanel(relevant);
    renderUrgentBanner(relevant);

    // Pop up a modal right in front of an employee who is actively on the
    // page for any brand-new notification addressed to them — such as a new
    // assignment or schedule change — so they're aware immediately instead
    // of only noticing the bell badge later. Removal remains visible in the
    // bell, but is not shown as a stale modal when the slot is empty.
    if (employeeSession) {
      const openRelevant = relevant.filter(n => !n.resolved);
      const freshPersonal = openRelevant.filter(n =>
        personalNotifTypes.includes(n.type) &&
        n.type !== "removed" &&
        !alertedPersonalNotifIds.has(n.id)
      );
      const freshBroadcast = seenNotificationIds !== null
        ? openRelevant.filter(n => !personalNotifTypes.includes(n.type) && !seenNotificationIds.has(n.id))
        : [];
      // Show only the newest personal state in one login session. Older
      // assignment/removal records are still coalesced in the bell, but must
      // never stack modal dialogs and confuse an employee about their status.
      const freshOnes = [...freshPersonal.slice(0, 1), ...freshBroadcast];
      for (const n of freshOnes) {
        const isRemoved = n.type === "removed";
        const isBranchChanged = n.type === "branchChanged";
        const isDateChanged = n.type === "dateChanged";
        const isEventUpdated = n.type === "eventUpdated";
        const isEventDeleted = n.type === "eventDeleted";
        const isSiteRemoved = n.type === "siteRemoved";
        const isEventCancelled = n.type === "eventCancelled";
        const isEventReinstated = n.type === "eventReinstated";
        const isSlotAssigned = n.type === "slotAssigned";
        const isSiteMoved = n.type === "siteMoved";
        const where = `${n.role || ""}${n.list === "relievers" ? " (Store Reliever)" : ""} at ${n.location || "site"}${n.date ? " — " + formatDateDisplay(n.date) : ""}${n.time ? ", " + n.time : ""}`;
        let message;
        if (isSiteMoved) {
          message = `📍 You were moved to a new event site: ${where}.\n\nYour previous assignment was cleared and this is now your active deployment.`;
        } else if (isRemoved) {
          message = `You've been removed from your slot: ${where}.\n\nYou're free to sign up for another slot now.`;
        } else if (isBranchChanged) {
          message = `The event team is changed the branch for: ${where}.\n\nYour slot was cleared — you're free to sign up for another slot now.`;
        } else if (isDateChanged) {
          const moved = n.oldDate ? `moved from ${formatDateDisplay(n.oldDate)} to ${formatDateDisplay(n.newDate)}` : `changed`;
          message = `The event team changed the date for your slot: ${where}.\n\nThe date was ${moved}. You're still booked — just on the new date.`;
        } else if (isEventUpdated) {
          message = `The event team updated your slot: ${where}.\n\nThe time or location changed. You're still booked.`;
        } else if (isEventDeleted) {
          message = `The event team deleted this event: ${where}.\n\nYou're free to sign up for another slot now.`;
        } else if (isSiteRemoved) {
          message = `The event team removed this site: ${where}.\n\nYou're free to sign up for another slot now.`;
        } else if (isEventCancelled) {
          message = `The event team cancelled this event: ${where}.\n\nYou're still on the roster — nothing to show up for unless it's reinstated.`;
        } else if (isEventReinstated) {
          message = `Good news — this event is back on: ${where}.\n\nYou're good to go as scheduled.`;
        } else if (isSlotAssigned) {
          message = `📌 You were assigned to an event slot: ${where}.\n\nThe event team added your name to this role.`;
        } else {
          message = `🚨 Emergency vacancy just opened for your team: ${where}.\n\n${n.employeeName || "A teammate"} became unavailable — sign up below if you can cover.`;
        }
        await showAlert(message, undefined,
          (isSiteMoved || isSlotAssigned) && n.cardId
            ? { cardId: n.cardId, date: n.date || "" }
            : null
        );
        if (personalNotifTypes.includes(n.type)) {
          alertedPersonalNotifIds.add(n.id);
        }
      }
      if (freshPersonal.length) {
        freshPersonal.forEach(n => alertedPersonalNotifIds.add(n.id));
        saveAlertedPersonalNotifIds(alertedPersonalNotifIds);
      }
      seenNotificationIds = new Set(openRelevant.map(n => n.id));
    }
  },
  err => {
    // Most likely cause: Firestore Security Rules don't yet allow read
    // access to the "emergencyNotifications" collection (it's new — the
    // rest of the app's rules won't automatically cover it). Surface this
    // loudly instead of leaving the bell/banner silently empty forever.
    // The bell + panel are shared elements, so both admin and employees
    // will see this if it happens.
    console.error("emergencyNotifications listener failed:", err);
    const wrap = document.getElementById("notifWrap");
    const panel = document.getElementById("notifPanel");
    if (wrap) wrap.style.display = "inline-block";
    if (panel) {
      panel.classList.add("open");
      panel.innerHTML = `<div class="notif-panel-empty" style="color:var(--danger);font-style:normal;">
        ⚠ Failed to load notifications.<br><br>
        <span style="font-size:11px;">${escapeHtml(err.message || String(err))}</span><br><br>
        The "emergencyNotifications" collection needs to be allowed in the Firestore Security Rules.
      </div>`;
    }
  }
);

const notifBellBtn = document.getElementById("notifBell");
if (notifBellBtn) {
  notifBellBtn.addEventListener("click", () => {
    document.getElementById("notifPanel").classList.toggle("open");
  });
  document.addEventListener("click", e => {
    const wrap = document.getElementById("notifWrap");
    if (wrap && !wrap.contains(e.target)) {
      const panel = document.getElementById("notifPanel");
      if (panel) panel.classList.remove("open");
    }
  });
}

// Send / Update All / Reset all all assume there's at least one site to act
// on. With zero cards (the "No sites yet" empty state), there's nothing
// meaningful to push, update, or reset — so guard each button with a plain
// message instead of silently sending/resetting an empty roster.
function hasNoSitesYet() {
  return cards.length === 0;
}

document.getElementById("saveBtn").addEventListener("click", async () => {
  if (hasNoSitesYet()) {
    await showAlert("You need to add a date event and at least one site before you can send this.", "warn");
    return;
  }
  saveCards();
  await sendAllToEmployees(document.getElementById("saveBtn"));
});

document.getElementById("updateAllBtn").addEventListener("click", async () => {
  if (hasNoSitesYet()) {
    await showAlert("You need to add a date event and at least one site before you can update this.", "warn");
    return;
  }
  saveCards();
  await sendAllToEmployees(document.getElementById("updateAllBtn"));
});

document.getElementById("printBtn").addEventListener("click", () => window.print());

document.getElementById("resetBtn").addEventListener("click", async () => {
  if (hasNoSitesYet()) {
    await showAlert("There's nothing to reset yet — add a date event and at least one site first.", "warn");
    return;
  }
  if (await showConfirm("Reset all data? This cannot be undone.")) {
    cards = Array.from({ length: 6 }, blankCard);
    saveCards();
    render();
  }
});

// Needed in both modes now: this is what notices when the admin deletes an
// employee's account and clears any slot that employee had signed up for
// (see clearSlotsForDeletedEmployees above). Previously this only ran for
// employees, so a deleted account's slot only got cleared if some employee
// happened to have the page open — the admin's own dashboard never noticed.
startEmployeesListener();

if (employeeSession) {
  // Employee mode: hide the admin editing toolbar/filters and show a
  // live, read-only view scoped to their own branch.
  document.querySelector(".toolbar").style.display = "none";
  document.getElementById("regionFilter").style.display = "none";
  let lastEmployeeAllCards = [];
  onSnapshot(scheduleDocRef, snap => {
    const data = snap.exists() ? snap.data() : { cards: [] };
    // Store Reliever rows display as Pharmacy Assistant duty — strip any leftover
    // PHARMACIST/BILLING/IT SPECIALIST reliever rows pushed from older data,
    // relabel any old PICKER/ENCODER entries to "PHARMACY ASSISTANT", and
    // drop empty leftover placeholder rows (no name AND no site) from
    // before Store Reliever rows were auto-added per Picker/Encoder signup —
    // before showing the roster to employees.
    const publishedCards = Array.isArray(data.employeeCards) ? data.employeeCards : (data.cards || []);
    const allCards = publishedCards.map(c => ({
      ...c,
      relievers: (c.relievers || [])
        .filter(s => ["PHARMACY ASSISTANT", "BILLING"].includes(roleToTeam(s.label).toUpperCase()))
        .filter(s => (s.name || "").trim() || (s.site || "").trim())
        .map(s => ({
          ...s,
          label: (s.name || "").trim()
            ? (roleToTeam(s.label).toUpperCase() === "BILLING" ? "BILLING" : "PHARMACY ASSISTANT")
            : ""
        }))
    }));
    lastEmployeeAllCards = allCards;
    renderEmployeeSchedule(allCards, employeeSession.branch);
    renderLeaderboard(allCards);
  });
  // Live cutoff watch: no Firestore change happens exactly at the cutoff
  // time, so without this, "Leave slot" / "Not Available" would only lock
  // out on the next signup or page reload. This polls the clock every 15s
  // and re-renders — using the last data already received above, no extra
  // reads — the instant the cutoff boundary is crossed while someone is
  // sitting on the page.
  let wasPastLeaveCutoff = isPastLeaveCutoff();
  setInterval(() => {
    const nowPastCutoff = isPastLeaveCutoff();
    if (nowPastCutoff !== wasPastLeaveCutoff) {
      wasPastLeaveCutoff = nowPastCutoff;
      renderEmployeeSchedule(lastEmployeeAllCards, employeeSession.branch);
    }
  }, 15000);
} else {
  // Admin/manager mode: full editable dashboard, as before.
  renderDatalists();
  render();

  // Live sign-up feed: merges employee self-signups into the local view
  // in real time, the same way employees see the roster update live.
  // Only slots the admin hasn't touched this session are updated, and if
  // the admin is actively typing somewhere, the visual refresh is held
  // back (data still merges underneath) so it doesn't yank their cursor
  // away mid-edit — it catches up as soon as they click elsewhere or the
  // next signup comes in.
  //
  // This also picks up whole new site/date-event cards (or removals) that
  // another admin device Sent/Updated — previously this only diffed staff
  // fields on cards that already matched an existing local id, so a new
  // site added on Device A and pushed to Firestore would never show up on
  // Device B's dashboard at all, live or even after refresh, since Device
  // B's local `cards` only ever grows from Device B's own edits.
  onSnapshot(scheduleDocRef, snap => {
    const data = snap.exists() ? snap.data() : { cards: [] };
    const remoteCards = Array.isArray(data.cards) ? data.cards : [];
    const remoteById = new Map(remoteCards.map(c => [c.id, c]));
    const activeEl = document.activeElement;
    const isNameField = activeEl && activeEl.classList && activeEl.classList.contains("nameInput");
    const activeCardId = isNameField ? activeEl.dataset.cardId : null;
    const activeList = isNameField ? (activeEl.dataset.list || "staff") : null;
    const activeSIdx = isNameField ? parseInt(activeEl.dataset.sidx, 10) : null;
    // A second device editing the SAME card (branch, mission, site name,
    // date, time) at this exact moment shouldn't get its typing overwritten
    // either — same idea as the nameInput protection above, just scoped to
    // the whole card instead of one slot, since these fields aren't tied to
    // a list index.
    const activeCardEl = activeEl && activeEl.closest && activeEl.closest(".site-card");
    const activeCardIdForFields = activeCardEl ? activeCardEl.dataset.cardId : null;
    let changed = false;
    let structuralChange = false;
    const affectedDates = new Set();
    cards.forEach(card => {
      const remoteCard = remoteById.get(card.id);
      if (!remoteCard) return;
      const remoteCancelled = !!remoteCard.cancelled;
      if (remoteCancelled !== !!card.cancelled) {
        card.cancelled = remoteCancelled;
        structuralChange = true;
        affectedDates.add(card.date || "");
      }
      // Branch, mission, site name, date, and time were previously never
      // synced here at all — only "cancelled" and the staff/reliever lists
      // were. So if one device changed a card's branch (e.g. North -> South)
      // and pushed Send/Update, every OTHER device logged into the same
      // account kept showing the old branch indefinitely, since nothing
      // ever pulled these fields off the remote doc into the local `cards`
      // array. These go through `render()` (structuralChange) since branch
      // affects the card's color/badge and site name affects its position
      // in region-filtered views.
      if (card.id !== activeCardIdForFields) {
        const cardLevelFields = ["region", "regionCustom", "mission", "location", "date", "time"];
        cardLevelFields.forEach(field => {
          const remoteVal = remoteCard[field] || "";
          const localVal = card[field] || "";
          if (remoteVal !== localVal) {
            card[field] = remoteCard[field];
            structuralChange = true;
            affectedDates.add(card.date || "");
            affectedDates.add(remoteCard.date || "");
          }
        });
      }
      ["staff", "relievers"].forEach(listKey => {
        const remoteList = remoteCard[listKey] || [];
        const localList = card[listKey] || [];
        // A resized list (row count changed) means a slot was appended or
        // removed — e.g. an employee's Picker/Encoder self-signup auto-adds
        // a new Store Reliever row on this same card, or the admin typing a
        // Pharmacy Assistant's name in directly does the same, or another
        // device used "+ Add field"/"Remove field". The per-index diff below
        // only ever visits indices that already exist in the LOCAL array, so
        // it can never notice the list grew or shrank — without this check,
        // Event Team's dashboard would silently miss brand-new Store
        // Reliever rows (and the site/name in them) until the page is
        // reloaded, even though employees see them live immediately.
        if (remoteList.length !== localList.length) {
          const activeHere = card.id === activeCardId && listKey === activeList;
          card[listKey] = remoteList.map((remoteSlot, sIdx) => {
            // Still protect whatever the admin is actively typing into,
            // even though the list around it just got resized.
            if (activeHere && sIdx === activeSIdx && localList[sIdx]) {
              return { ...remoteSlot, name: localList[sIdx].name, filledByStaffId: localList[sIdx].filledByStaffId };
            }
            return { ...remoteSlot };
          });
          structuralChange = true;
          affectedDates.add(card.date || "");
          return;
        }
        localList.forEach((slot, sIdx) => {
          // Only skip the exact field being typed into right now — a field
          // that was edited earlier and later cleared should still receive
          // live signups going forward, not stay locked out forever.
          if (card.id === activeCardId && listKey === activeList && sIdx === activeSIdx) return;
          const remoteSlot = remoteList[sIdx];
          if (!remoteSlot) return;
          const remoteName = (remoteSlot.name || "").trim();
          const localName = (slot.name || "").trim();
          if (remoteName !== localName || (remoteSlot.filledByStaffId || null) !== (slot.filledByStaffId || null)) {
            slot.name = remoteSlot.name || "";
            slot.filledByStaffId = remoteSlot.filledByStaffId || null;
            changed = true;
            affectedDates.add(card.date || "");
          }
        });
      });
    });
    // Pick up brand-new cards another device already Sent/Updated.
    remoteCards.forEach(remoteCard => {
      if (cards.some(c => c.id === remoteCard.id)) return;
      cards.push({
        ...remoteCard,
        staff: (remoteCard.staff || []).map(s => ({ ...s })),
        // Store Reliever rows display as Pharmacy Assistant duty — drop any
        // leftover PHARMACIST/BILLING/IT SPECIALIST reliever rows, relabel
        // any old PICKER/ENCODER entries to "PHARMACY ASSISTANT", and drop
        // empty leftover placeholder rows (no name AND no site).
        relievers: (remoteCard.relievers || [])
          .filter(s => ["PHARMACY ASSISTANT", "BILLING"].includes(roleToTeam(s.label).toUpperCase()))
          .filter(s => (s.name || "").trim() || (s.site || "").trim())
          .map(s => ({
            ...s,
            label: (s.name || "").trim()
              ? (roleToTeam(s.label).toUpperCase() === "BILLING" ? "BILLING" : "PHARMACY ASSISTANT")
              : ""
          }))
      });
      structuralChange = true;
      affectedDates.add(remoteCard.date || "");
    });
    // Drop cards that don't exist on the server — another device deleted
    // them, or (this was the actual bug) this browser's OWN localStorage
    // cache is simply stale: e.g. this card was deleted from another device
    // while this browser's tab was closed, so this browser never lived
    // through that deletion as a snapshot event and just reloaded the old
    // card straight from localStorage. That used to only get swept away
    // starting from the SECOND snapshot this session — meaning a card that
    // was already gone from the server before the page even loaded could
    // stay "stuck" on that one device forever. This now runs on every
    // snapshot, including the very first one. The only cards exempt are
    // ones THIS device just created and is still actively pushing to
    // Firestore for the first time (pendingLocalCardIds) — everything else
    // missing from the server is trusted to really be gone.
    const removeIds = new Set(
      cards.filter(c => !remoteById.has(c.id) && !pendingLocalCardIds.has(c.id)).map(c => c.id)
    );
    if (removeIds.size) {
      cards.forEach(c => { if (removeIds.has(c.id)) affectedDates.add(c.date || ""); });
      cards = cards.filter(c => !removeIds.has(c.id));
      structuralChange = true;
    }
    if (structuralChange) {
      // New/removed cards change the DOM structure itself (new site cards,
      // new date tabs) — always do a full re-render for these, even if the
      // admin is mid-edit elsewhere, rather than leave the dashboard
      // showing a stale set of sites.
      saveCards();
      render();
      return;
    }
    if (!changed) return;
    saveCards();
    const isTypingInCard = activeEl && activeEl.closest && activeEl.closest(".site-card");
    if (isTypingInCard) {
      updateStats();
      affectedDates.forEach(d => updateTabBadge(d));
    } else {
      render();
    }
  });
}
</script>

</body>
</html>
